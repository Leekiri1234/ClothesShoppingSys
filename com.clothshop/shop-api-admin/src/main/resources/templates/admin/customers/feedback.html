<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <title>Kiểm duyệt đánh giá</title>
</head>
<body>

<h1 layout:fragment="page-title">Kiểm duyệt đánh giá</h1>

<div layout:fragment="content" class="customers-feedback-page">
    <div class="page-header">
        <h2>Feedback Moderation</h2>
        <span class="page-subtitle">Duyệt đánh giá của khách để hiển thị trên trang sản phẩm</span>
    </div>

    <div style="display: flex; justify-content: flex-end; margin-bottom: 12px;">
        <form th:action="@{/admin/customers/feedback/seed}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button class="btn btn-outline" type="submit">Seed feedback test data</button>
        </form>
    </div>

    <div class="dashboard-card">
        <table class="admin-table">
            <thead>
            <tr>
                <th>Ngày</th>
                <th>Khách</th>
                <th>Sản phẩm</th>
                <th>Đánh giá</th>
                <th>Nội dung</th>
                <th>Trạng thái</th>
                <th>Thao tác</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="r : ${reviews}">
                <td th:text="${r.date}">2026-04-02</td>
                <td th:text="${r.customer}">Nguyen Thi Bich</td>
                <td th:text="${r.product}">Ao Linen Co V</td>
                <td>
                    <span class="badge badge-warning" th:text="${r.rating} + '/5'">5/5</span>
                </td>
                <td th:text="${r.content}">Ao dep, vai mem va de mac.</td>
                <td>
                    <span class="badge badge-success" th:if="${r.status == 'APPROVED'}">Đã duyệt</span>
                    <span class="badge badge-warning" th:if="${r.status == 'PENDING'}">Chờ duyệt</span>
                    <span class="badge badge-muted" th:if="${r.status == 'REJECTED' or r.status == 'HIDDEN'}">Đã ẩn</span>
                </td>
                <td>
                    <div class="actions-cell" style="justify-content: center;">
                        <form th:if="${r.status == 'PENDING'}" th:action="@{/admin/customers/feedback/{id}/approve(id=${r.id})}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button class="btn btn-xs btn-success" type="submit">Duyệt</button>
                        </form>
                        <form th:if="${r.status == 'PENDING'}" th:action="@{/admin/customers/feedback/{id}/reject(id=${r.id})}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button class="btn btn-xs btn-danger" type="submit">Từ chối</button>
                        </form>
                        <form th:if="${r.status == 'APPROVED'}" th:action="@{/admin/customers/feedback/{id}/hide(id=${r.id})}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button class="btn btn-xs btn-outline" type="submit">Ẩn</button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
