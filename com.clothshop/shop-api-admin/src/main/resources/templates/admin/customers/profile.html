<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <title>Hồ sơ khách hàng</title>
</head>
<body>

<h1 layout:fragment="page-title">Hồ sơ khách hàng</h1>

<div layout:fragment="content" class="customers-profile-page">
    <div class="page-header">
        <h2>Thông tin chi tiết khách hàng</h2>
        <span class="page-subtitle">Theo dõi hồ sơ mua hàng và phân hạng khách hàng</span>
    </div>

    <div class="form-card" style="max-width: 760px; margin: 0 auto;">
        <div class="form-row">
            <div class="form-group">
                <label>Họ tên</label>
                <input type="text" th:value="${customer.name}" readonly>
            </div>
            <div class="form-group">
                <label>Hạng</label>
                <input type="text" th:value="${customer.tier}" readonly>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Email</label>
                <input type="text" th:value="${customer.email}" readonly>
            </div>
            <div class="form-group">
                <label>Số điện thoại</label>
                <input type="text" th:value="${customer.phone}" readonly>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Tổng số đơn</label>
                <input type="text" th:value="${customer.orders}" readonly>
            </div>
            <div class="form-group">
                <label>Tổng chi tiêu</label>
                <input type="text" th:value="${customer.spent} + ' ₫'" readonly>
            </div>
        </div>

        <div class="form-actions">
            <a class="btn btn-outline" th:href="@{/admin/customers}">Quay lại danh sách</a>
            <a class="btn btn-primary" th:href="@{/admin/customers/feedback}">Xem feedback</a>
        </div>
    </div>
</div>

</body>
</html>
