<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <title>Dashboard</title>
</head>
<body>

<h1 layout:fragment="page-title">Dashboard</h1>

<div layout:fragment="content">
    <!-- STAT CARDS (backed by DashboardController) -->
    <div class="stat-cards">
        <div class="stat-card">
            <div class="stat-icon" style="background: #f0f7ff;">
                <svg style="width: 20px; height: 20px; color: #2196F3;" viewBox="0 0 24 24">
                    <line x1="12" y1="1" x2="12" y2="23"/>
                    <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
                </svg>
            </div>
            <div class="stat-body">
                <div class="stat-label">Doanh thu hôm nay</div>
                <div class="stat-value" th:text="${#numbers.formatDecimal(todayRevenue, 0, 'COMMA', 0, 'POINT')} + '₫'">0₫</div>
            </div>
        </div>

        <div class="stat-card">
            <div class="stat-icon" style="background: #e8f5e9;">
                <svg style="width: 20px; height: 20px; color: #4CAF50;" viewBox="0 0 24 24">
                    <circle cx="9" cy="21" r="1"/>
                    <circle cx="20" cy="21" r="1"/>
                    <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
                </svg>
            </div>
            <div class="stat-body">
                <div class="stat-label">Đơn hàng mới</div>
                <div class="stat-value" th:text="${todayOrders}">0</div>
            </div>
        </div>

        <div class="stat-card">
            <div class="stat-icon" style="background: #fff3e0;">
                <svg style="width: 20px; height: 20px; color: #f0a500;" viewBox="0 0 24 24">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                    <circle cx="9" cy="7" r="4"/>
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                    <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                </svg>
            </div>
            <div class="stat-body">
                <div class="stat-label">Khách hàng</div>
                <div class="stat-value" th:text="${totalCustomers}">0</div>
            </div>
        </div>

        <div class="stat-card">
            <div class="stat-icon" style="background: #fdecea;">
                <svg style="width: 20px; height: 20px; color: #e63946;" viewBox="0 0 24 24">
                    <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
                </svg>
            </div>
            <div class="stat-body">
                <div class="stat-label">Sản phẩm</div>
                <div class="stat-value" th:text="${totalProducts}">0</div>
            </div>
        </div>
    </div>

    <!-- REVENUE CHART (backed by ReportController API) -->
    <div class="dashboard-grid">
        <div class="dashboard-card chart-card">
            <div class="card-header">
                <h3>Biểu đồ doanh thu</h3>
                <div class="date-range-selector">
                    <button class="range-btn active">7 ngày</button>
                    <button class="range-btn">30 ngày</button>
                    <button class="range-btn">90 ngày</button>
                </div>
            </div>
            <div class="chart-container">
                <canvas id="revenueChart"></canvas>
            </div>
        </div>
    </div>
</div>

<div layout:fragment="scripts">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
<script>
let revenueChart = null;
const rangePeriods = ['weekly', 'monthly', 'quarterly'];

function formatCurrency(value) {
    return new Intl.NumberFormat('vi-VN', {
        style: 'currency',
        currency: 'VND',
        minimumFractionDigits: 0
    }).format(value);
}

function loadRevenueChart(period) {
    fetch(`/admin/reports/api/${period}`)
        .then(response => response.json())
        .then(data => renderChart(data.dailySales))
        .catch(error => console.error('Error loading chart data:', error));
}

function renderChart(dailySales) {
    const ctx = document.getElementById('revenueChart').getContext('2d');

    const labels = dailySales.map(sale => {
        const date = new Date(sale.date);
        return date.toLocaleDateString('vi-VN', { month: '2-digit', day: '2-digit' });
    });
    const amounts = dailySales.map(sale => parseFloat(sale.amount));

    if (revenueChart) {
        revenueChart.destroy();
    }

    revenueChart = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: labels,
            datasets: [{
                label: 'Doanh thu (₫)',
                data: amounts,
                backgroundColor: '#2196F3',
                borderColor: '#1976D2',
                borderWidth: 1,
                borderRadius: 4
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: true,
            plugins: {
                legend: { display: true, labels: { font: { size: 12 } } },
                tooltip: {
                    backgroundColor: 'rgba(0, 0, 0, 0.8)',
                    padding: 12,
                    callbacks: {
                        label: function(context) {
                            return formatCurrency(context.parsed.y);
                        }
                    }
                }
            },
            scales: {
                y: {
                    beginAtZero: true,
                    ticks: {
                        callback: function(value) {
                            return value >= 1000000 ? (value / 1000000).toFixed(1) + 'M' : value;
                        }
                    }
                }
            }
        }
    });
}

document.addEventListener('DOMContentLoaded', function() {
    const buttons = Array.from(document.querySelectorAll('.range-btn'));
    buttons.forEach((btn, index) => {
        btn.dataset.period = rangePeriods[index] || 'weekly';
        btn.addEventListener('click', function() {
            buttons.forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            loadRevenueChart(this.dataset.period);
        });
    });

    loadRevenueChart('weekly');
});
</script>
</div>

</body>
</html>
