<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/layout}">
<head>
    <title>Danh sách thông báo</title>
</head>
<body>
<div layout:fragment="content">
    <div class="container-fluid py-4">
        <div class="row">
            <div class="col-12">
                <div class="card mb-4">
                    <div class="card-header pb-0 d-flex justify-content-between align-items-center">
                        <h6>Danh sách thông báo</h6>
                        <a th:href="@{/admin/notifications/create}" class="btn btn-primary btn-sm">Tạo thông báo mới</a>
                    </div>
                    <div class="card-body px-0 pt-0 pb-2">
                        <div th:if="${param.success}" class="alert alert-success mx-4 text-white">
                            Tạo thông báo thành công!
                        </div>
                        <div class="table-responsive p-0">
                            <table class="table align-items-center mb-0">
                                <thead>
                                <tr>
                                    <th class="text-uppercase text-secondary text-xxs font-weight-bolder opacity-7">Tiêu đề</th>
                                    <th class="text-uppercase text-secondary text-xxs font-weight-bolder opacity-7 ps-2">Loại</th>
                                    <th class="text-center text-uppercase text-secondary text-xxs font-weight-bolder opacity-7">Ngày tạo</th>
                                    <th class="text-center text-uppercase text-secondary text-xxs font-weight-bolder opacity-7">Hành động</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="notification : ${notifications}">
                                    <td>
                                        <div class="d-flex px-3 py-1">
                                            <div class="d-flex flex-column justify-content-center">
                                                <h6 class="mb-0 text-sm" th:text="${notification.title}">Tiêu đề</h6>
                                            </div>
                                        </div>
                                    </td>
                                    <td>
                                        <span class="badge badge-sm bg-gradient-success" th:text="${notification.targetType.displayName}">Loại</span>
                                    </td>
                                    <td class="align-middle text-center">
                                        <span class="text-secondary text-xs font-weight-bold" th:text="${#temporals.format(notification.createdAt, 'dd/MM/yyyy HH:mm')}">Ngày tạo</span>
                                    </td>
                                    <td class="align-middle text-center">
                                        <a th:href="@{/admin/notifications/edit/{id}(id=${notification.id})}" class="text-secondary font-weight-bold text-xs" data-toggle="tooltip" data-original-title="Edit notification">
                                            Sửa
                                        </a>
                                        |
                                        <form th:action="@{/admin/notifications/delete/{id}(id=${notification.id})}" method="post" style="display:inline;">
                                            <button type="submit" class="text-danger font-weight-bold text-xs border-0 bg-transparent p-0" onclick="return confirm('Bạn có chắc chắn muốn xóa thông báo này?');">Xóa</button>
                                        </form>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(notifications)}">
                                    <td colspan="4" class="text-center py-4">Chưa có thông báo nào.</td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
