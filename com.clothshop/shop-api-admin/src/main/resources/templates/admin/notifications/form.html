<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/layout}">
<head>
    <title th:text="${isEdit != null and isEdit} ? 'Cập nhật thông báo' : 'Tạo thông báo mới'">Tạo thông báo mới</title>
</head>
<body>
<div layout:fragment="content">
    <div class="container-fluid py-4">
        <div class="row">
            <div class="col-12 col-lg-8 mx-auto">
                <div class="card">
                    <div class="card-header pb-0">
                        <div class="d-flex align-items-center">
                            <p class="mb-0" th:text="${isEdit != null and isEdit} ? 'Cập nhật thông báo' : 'Tạo thông báo mới'">Tạo thông báo mới</p>
                            <a th:href="@{/admin/notifications}" class="btn btn-sm btn-outline-secondary ms-auto">Quay lại</a>
                        </div>
                    </div>
                    <div class="card-body">
                        <form th:action="${isEdit != null and isEdit} ? @{/admin/notifications/edit/{id}(id=${request.id})} : @{/admin/notifications/create}"
                              th:object="${request}"
                              method="post">
                            <div class="row">
                                <div class="col-md-12">
                                    <div class="form-group mb-3">
                                        <label for="title" class="form-control-label">Tiêu đề <span class="text-danger">*</span></label>
                                        <input class="form-control" type="text" id="title" th:field="*{title}" required>
                                    </div>
                                </div>

                                <th:block th:if="${isEdit == null or !isEdit}">
                                    <div class="col-md-6">
                                        <div class="form-group mb-3">
                                            <label for="type" class="form-control-label">Loại thông báo <span class="text-danger">*</span></label>
                                            <select class="form-select" id="type" th:field="*{type}" required>
                                                <option th:each="t : ${types}" th:value="${t}" th:text="${t.displayName}"></option>
                                            </select>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="form-group mb-3">
                                            <label for="targetType" class="form-control-label">Lựa chọn người nhận <span class="text-danger">*</span></label>
                                            <select class="form-select" id="targetType" th:field="*{targetType}" onchange="toggleCustomerSelect()" required>
                                                <option value="ALL">Tất cả khách hàng</option>
                                                <option value="CUSTOM">Khách hàng cụ thể</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div class="col-md-12" id="customerSelectGroup" style="display: none;">
                                        <div class="form-group mb-3">
                                            <label for="customerIds" class="form-control-label">Chọn khách hàng <span class="text-danger">*</span></label>
                                            <select class="form-select" id="customerIds" th:field="*{customerIds}" multiple size="5">
                                                <option th:each="customer : ${customers}" th:value="${customer.id}" th:text="|${customer.username} - ${customer.email}|"></option>
                                            </select>
                                            <small class="text-muted">Giữ phím Ctrl (hoặc Cmd trên Mac) để chọn nhiều người.</small>
                                        </div>
                                    </div>
                                </th:block>

                                <div class="col-md-12">
                                    <div class="form-group mb-3">
                                        <label for="message" class="form-control-label">Nội dung <span class="text-danger">*</span></label>
                                        <textarea class="form-control" id="message" th:field="*{message}" rows="5" required></textarea>
                                    </div>
                                </div>
                            </div>

                            <div class="d-flex justify-content-end mt-4">
                                <button type="submit" class="btn btn-primary btn-sm mb-0"
                                        th:text="${isEdit != null and isEdit} ? 'Cập nhật' : 'Gửi thông báo'">
                                    Gửi thông báo
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function toggleCustomerSelect() {
            const targetTypeElem = document.getElementById('targetType');

            // Kiến trúc phòng ngừa: Nếu đang ở chế độ Edit, DOM element targetType sẽ không tồn tại do th:block.
            // Trả về ngay lập tức để tránh lỗi JS "Cannot read properties of null".
            if (!targetTypeElem) return;

            const targetType = targetTypeElem.value;
            const customerGroup = document.getElementById('customerSelectGroup');
            const customerSelect = document.getElementById('customerIds');

            if (targetType === 'CUSTOM') {
                customerGroup.style.display = 'block';
                if(customerSelect) {
                    customerSelect.setAttribute('required', 'required');
                }
            } else {
                customerGroup.style.display = 'none';
                if(customerSelect) {
                    customerSelect.removeAttribute('required');
                    const options = customerSelect.options;
                    for (let i = 0; i < options.length; i++) {
                        options[i].selected = false;
                    }
                }
            }
        }

        // Chạy lần đầu nếu form reload giữ state
        document.addEventListener("DOMContentLoaded", function() {
            toggleCustomerSelect();
        });
    </script>
</div>
</body>
</html>
