<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <title>Cập nhật giá variant</title>
</head>
<body>

<h1 layout:fragment="page-title">Cập nhật giá variant</h1>

<div layout:fragment="page-actions">
    <a th:href="@{/admin/products/{id}(id=${variant.productId})}" class="btn btn-outline">
        <svg style="width: 14px; height: 14px;" viewBox="0 0 24 24">
            <line x1="19" y1="12" x2="5" y2="12"/>
            <polyline points="12 19 5 12 12 5"/>
        </svg>
        Quay lại
    </a>
</div>

<div layout:fragment="content">

    <div style="max-width: 500px; margin: 0 auto;">
        <form th:action="@{/admin/variants/{id}/update-price(id=${variant.variantId})}"
              th:object="${priceRequest}"
              method="post"
              data-validate>

            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="form-card">
                <h3>Thông tin variant</h3>

                <div style="background: var(--bg); padding: 16px; border-radius: var(--radius); margin-bottom: 20px;">
                    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; font-size: 13px;">
                        <div>
                            <div style="color: var(--muted); margin-bottom: 4px;">SKU</div>
                            <div style="font-weight: 600; font-family: monospace;" th:text="${variant.sku}">SKU001</div>
                        </div>
                        <div>
                            <div style="color: var(--muted); margin-bottom: 4px;">Màu sắc</div>
                            <div style="font-weight: 600;" th:text="${variant.color}">Đỏ</div>
                        </div>
                        <div>
                            <div style="color: var(--muted); margin-bottom: 4px;">Kích thước</div>
                            <div style="font-weight: 600;" th:text="${variant.sizeValue}">M</div>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label>Giá hiện tại</label>
                    <div style="font-size: 20px; font-weight: 700; color: var(--muted); margin-bottom: 16px;"
                         th:text="${#numbers.formatDecimal(variant.retailPrice, 0, 'COMMA', 0, 'POINT')} + '₫'">
                        299.000₫
                    </div>
                </div>

                <div class="form-group">
                    <label>Giá mới <span style="color: var(--danger);">*</span></label>
                    <input type="number"
                           th:field="*{price}"
                           placeholder="0"
                           min="0"
                           step="1000"
                           required
                           autofocus>
                    <span class="text-danger" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></span>
                    <small style="font-size: 11px; color: var(--muted);">
                        Nhập giá bán mới cho variant này
                    </small>
                </div>

                <div style="padding: 12px; background: #fff3e0; border: 1px solid #ffe0b2; border-radius: var(--radius); margin-top: 16px;">
                    <div style="display: flex; gap: 8px;">
                        <svg style="width: 16px; height: 16px; color: #f0a500; flex-shrink: 0; margin-top: 2px;" viewBox="0 0 24 24">
                            <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
                            <line x1="12" y1="9" x2="12" y2="13"/>
                            <line x1="12" y1="17" x2="12.01" y2="17"/>
                        </svg>
                        <div style="font-size: 12px; color: #e65100; line-height: 1.5;">
                            <strong>Cảnh báo:</strong> Thay đổi giá sẽ ảnh hưởng đến giá hiển thị trên website ngay lập tức.
                        </div>
                    </div>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">
                    <svg style="width: 14px; height: 14px;" viewBox="0 0 24 24">
                        <polyline points="20 6 9 17 4 12"/>
                    </svg>
                    Cập nhật giá
                </button>
                <a th:href="@{/admin/products/{id}(id=${variant.productId})}" class="btn btn-outline">Hủy</a>
            </div>

        </form>
    </div>

</div>

</body>
</html>
