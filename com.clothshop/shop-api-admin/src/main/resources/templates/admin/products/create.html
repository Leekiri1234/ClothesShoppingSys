<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <title>Thêm sản phẩm mới</title>
</head>
<body>

<h1 layout:fragment="page-title">Thêm sản phẩm mới</h1>

<div layout:fragment="page-actions">
    <a th:href="@{/admin/products}" class="btn btn-outline">
        <svg style="width: 14px; height: 14px;" viewBox="0 0 24 24">
            <line x1="19" y1="12" x2="5" y2="12"/>
            <polyline points="12 19 5 12 12 5"/>
        </svg>
        Quay lại
    </a>
</div>

<div layout:fragment="content">
    <form th:action="@{/admin/products/create}"
          th:object="${product}"
          method="post"
          data-validate>

        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="product-form-layout">
            <!-- LEFT COLUMN -->
            <div class="product-form-left">

                <!-- THÔNG TIN CƠ BẢN -->
                <div class="form-card">
                    <h3>Thông tin cơ bản</h3>

                    <div class="form-group">
                        <label>Tên sản phẩm <span style="color: var(--danger);">*</span></label>
                        <input type="text"
                               th:field="*{productName}"
                               placeholder="VD: Áo thun cotton nam basic"
                               required>
                        <span class="text-danger" th:if="${#fields.hasErrors('productName')}" th:errors="*{productName}"></span>
                    </div>

                    <div class="form-group">
                        <label>Mô tả sản phẩm <span style="color: var(--danger);">*</span></label>
                        <textarea th:field="*{description}"
                                  rows="5"
                                  placeholder="Mô tả chi tiết về sản phẩm..."
                                  required></textarea>
                        <span class="text-danger" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></span>
                    </div>

                    <div class="form-group">
                        <label>Giá gốc <span style="color: var(--danger);">*</span></label>
                        <input type="number"
                               th:field="*{price}"
                               placeholder="0"
                               min="0"
                               step="1000"
                               required>
                        <span class="text-danger" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></span>
                        <small style="font-size: 11px; color: var(--muted);">
                            Tồn kho sẽ được quản lý ở từng variant (màu sắc + size)
                        </small>
                    </div>

                    <div class="form-group">
                        <label>URL hình ảnh</label>
                        <input type="text"
                               th:field="*{imageUrl}"
                               placeholder="https://example.com/image.jpg">
                        <span class="text-danger" th:if="${#fields.hasErrors('imageUrl')}" th:errors="*{imageUrl}"></span>
                    </div>
                </div>

            </div>

            <!-- RIGHT COLUMN -->
            <div class="product-form-right">

                <!-- DANH MỤC -->
                <div class="form-card">
                    <h3>Danh mục</h3>

                    <div class="form-group">
                        <label>Chọn danh mục <span style="color: var(--danger);">*</span></label>
                        <select th:field="*{categoryId}" required>
                            <option value="">-- Chọn danh mục --</option>
                            <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.categoryName}">Category</option>
                        </select>
                        <span class="text-danger" th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}"></span>
                    </div>
                </div>

                <!-- TRẠNG THÁI -->
                <div class="form-card">
                    <h3>Trạng thái</h3>

                    <label class="toggle-switch">
                        <input type="checkbox" th:field="*{isActive}" checked>
                        <span class="toggle-slider"></span>
                        <span class="toggle-label">Hiển thị sản phẩm</span>
                    </label>

                    <small style="font-size: 11px; color: var(--muted); display: block; margin-top: 8px;">
                        Bật để sản phẩm hiển thị trên website
                    </small>
                </div>

            </div>
        </div>

        <!-- FORM ACTIONS -->
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">
                <svg style="width: 14px; height: 14px;" viewBox="0 0 24 24">
                    <polyline points="20 6 9 17 4 12"/>
                </svg>
                Tạo sản phẩm
            </button>
            <a th:href="@{/admin/products}" class="btn btn-outline">Hủy</a>
        </div>

    </form>
</div>

</body>
</html>
