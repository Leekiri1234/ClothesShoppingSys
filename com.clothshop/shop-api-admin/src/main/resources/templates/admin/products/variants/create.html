<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <title>Thêm variant mới</title>
</head>
<body>

<h1 layout:fragment="page-title">Thêm variant mới</h1>

<div layout:fragment="page-actions">
    <a th:href="@{/admin/products/{id}/edit(id=${productId})}" class="btn btn-outline">
        <svg style="width: 14px; height: 14px;" viewBox="0 0 24 24">
            <line x1="19" y1="12" x2="5" y2="12"/>
            <polyline points="12 19 5 12 12 5"/>
        </svg>
        Quay lại
    </a>
</div>

<div layout:fragment="content">

    <div style="max-width: 600px; margin: 0 auto;">
        <form th:action="@{/admin/products/{id}/variants/create(id=${productId})}"
              method="post"
              data-validate>

            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="form-card">
                <h3>Thông tin biến thể</h3>

                <div class="form-group">
                    <label>Màu sắc <span style="color: var(--danger);">*</span></label>
                    <input type="text"
                           name="color"
                           placeholder="VD: Đỏ, Xanh navy, Trắng..."
                           required>
                </div>

                <div class="form-group">
                    <label>Kích thước <span style="color: var(--danger);">*</span></label>
                    <input type="text"
                           name="size"
                           placeholder="VD: S, M, L, XL, XXL..."
                           required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Giá bán <span style="color: var(--danger);">*</span></label>
                        <input type="number"
                               name="price"
                               placeholder="0"
                               min="0"
                               step="1000"
                               required>
                    </div>

                    <div class="form-group">
                        <label>Tồn kho <span style="color: var(--danger);">*</span></label>
                        <input type="number"
                               name="stock"
                               placeholder="0"
                               min="0"
                               value="0"
                               required>
                    </div>
                </div>

                <div style="padding: 12px; background: #f0f7ff; border: 1px solid #d0e7ff; border-radius: var(--radius); margin-top: 16px;">
                    <div style="display: flex; gap: 8px;">
                        <svg style="width: 16px; height: 16px; color: #2196F3; flex-shrink: 0; margin-top: 2px;" viewBox="0 0 24 24">
                            <circle cx="12" cy="12" r="10"/>
                            <line x1="12" y1="16" x2="12" y2="12"/>
                            <line x1="12" y1="8" x2="12.01" y2="8"/>
                        </svg>
                        <div style="font-size: 12px; color: #1565c0; line-height: 1.5;">
                            <strong>Lưu ý:</strong> Mỗi variant là một tổ hợp duy nhất của màu sắc và kích thước.
                            Ví dụ: "Đỏ - M", "Xanh - L" là 2 variants khác nhau.
                        </div>
                    </div>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">
                    <svg style="width: 14px; height: 14px;" viewBox="0 0 24 24">
                        <polyline points="20 6 9 17 4 12"/>
                    </svg>
                    Tạo variant
                </button>
                <a th:href="@{/admin/products/{id}/edit(id=${productId})}" class="btn btn-outline">Hủy</a>
            </div>

        </form>
    </div>

</div>

</body>
</html>
