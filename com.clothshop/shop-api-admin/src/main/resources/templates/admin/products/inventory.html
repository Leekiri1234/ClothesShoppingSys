<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <title>Sản phẩm - Quản lý kho</title>
</head>
<body>

<h1 layout:fragment="page-title">Quản lý kho</h1>

<div layout:fragment="content" class="products-inventory-page">
    <div class="page-header">
        <h2>Tồn kho sản phẩm</h2>
        <span class="page-subtitle">Theo dõi trạng thái kho và điều hướng nhanh tới cập nhật variant</span>
    </div>

    <div class="stat-cards" style="margin-bottom: 20px;">
        <div class="stat-card">
            <div class="stat-label">Tổng SKU</div>
            <div class="stat-value" th:text="${totalSku}">312</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Sắp hết hàng</div>
            <div class="stat-value text-warning" th:text="${lowStock}">26</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Hết hàng</div>
            <div class="stat-value text-danger" th:text="${outOfStock}">11</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Sẵn sàng bán</div>
            <div class="stat-value text-success" th:text="${inStock}">275</div>
        </div>
    </div>

    <div class="dashboard-card">
        <table class="admin-table">
            <thead>
            <tr>
                <th style="width: 110px;">Ảnh</th>
                <th>Tên sản phẩm</th>
                <th>SKU</th>
                <th>Variant</th>
                <th>Tồn kho</th>
                <th>Trạng thái</th>
                <th style="width: 180px;">Thao tác</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${items}">
                <td>
                    <img th:src="@{${item.image}}" th:alt="${item.name}" style="width: 84px; height: 56px; object-fit: cover; border: 1px solid var(--border); border-radius: 6px;">
                </td>
                <td style="font-weight: 600;" th:text="${item.name}">Ao Linen Co V</td>
                <td th:text="${item.sku}">ALV-001</td>
                <td th:text="${item.variant}">Trang / M</td>
                <td th:text="${item.stock}">22</td>
                <td>
                    <span th:if="${item.status == 'IN_STOCK'}" class="badge badge-success">Đủ hàng</span>
                    <span th:if="${item.status == 'LOW_STOCK'}" class="badge badge-warning">Sắp hết</span>
                    <span th:if="${item.status == 'OUT_OF_STOCK'}" class="badge badge-danger">Hết hàng</span>
                </td>
                <td>
                    <div class="actions-cell" style="justify-content: center;">
                        <a class="btn btn-xs btn-outline" th:href="@{/admin/products/{id}(id=${item.productId})}">Xem SP</a>
                        <a class="btn btn-xs btn-primary" th:href="@{/admin/products/{id}/edit(id=${item.productId})}">Cập nhật</a>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
