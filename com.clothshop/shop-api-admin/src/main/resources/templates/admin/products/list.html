<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <title>Quản lý sản phẩm</title>
</head>
<body>

<h1 layout:fragment="page-title">Sản phẩm</h1>

<div layout:fragment="page-actions">
    <a th:href="@{/admin/products/create}" class="btn btn-primary">
        <svg style="width: 14px; height: 14px;" viewBox="0 0 24 24">
            <line x1="12" y1="5" x2="12" y2="19"/>
            <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        Thêm sản phẩm
    </a>
</div>

<div layout:fragment="content">
    <!-- FILTER CARD -->
    <div class="dashboard-card" style="margin-bottom: 20px;">
        <form th:action="@{/admin/products}" method="get" class="filter-form">
            <div style="display: flex; gap: 15px; flex-wrap: wrap; align-items: flex-end;">
                <div style="flex: 1; min-width: 250px;">
                    <label style="display: block; margin-bottom: 5px; font-weight: 500;">Tên / SKU / Danh mục</label>
                    <input type="text" name="keyword" th:value="${keyword}" class="form-control" placeholder="Tìm kiếm tên sản phẩm, mã SKU...">
                </div>

                <div style="flex: 1; min-width: 200px;">
                    <label style="display: block; margin-bottom: 5px; font-weight: 500;">Danh mục</label>
                    <select name="categoryId" class="form-control">
                        <option value="">Tất cả danh mục</option>
                        <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.categoryName}" th:selected="${categoryId == cat.id}"></option>
                    </select>
                </div>

                <div style="flex: 1; min-width: 150px;">
                    <label style="display: block; margin-bottom: 5px; font-weight: 500;">Trạng thái KD</label>
                    <select name="prodStatus" class="form-control">
                        <option value="">Tất cả</option>
                        <option value="ACTIVE" th:selected="${prodStatus != null and prodStatus.name() == 'ACTIVE'}">Đang kinh doanh</option>
                        <option value="INACTIVE" th:selected="${prodStatus != null and prodStatus.name() == 'INACTIVE'}">Ngừng kinh doanh</option>
                    </select>
                </div>

                <div>
                    <button type="submit" class="btn btn-primary" style="margin-bottom: 8px;">Lọc</button>
                    <a th:href="@{/admin/products}" class="btn btn-outline" style="margin-bottom: 8px;">Xóa lọc</a>
                </div>
            </div>
        </form>
    </div>

    <!-- TABLE CARD -->
    <div class="dashboard-card">
        <table class="admin-table">
            <thead>
                <tr>
                    <th style="width: 80px;">Hình ảnh</th>
                    <th>Tên sản phẩm</th>
                    <th style="width: 150px;">Danh mục</th>
                    <th style="width: 120px;">Giá bán</th>
                    <th style="width: 100px;">Tồn kho</th>
                    <th style="width: 120px;">Trạng thái</th>
                    <th style="width: 160px;">Hành động</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="product : ${products.content}" th:classappend="${!product.isActive} ? 'inactive-row' : ''">
                    <td>
                        <div class="table-product-img"
                             th:style="${product.imageUrl != null} ? 'background-image: url(' + ${product.imageUrl} + '); background-size: cover;' : ''"
                             th:text="${product.imageUrl == null} ? 'IMG' : ''">
                        </div>
                    </td>
                    <td>
                        <div style="font-weight: 500;" th:text="${product.productName}">Áo sơ mi trắng basic</div>
                        <div style="font-size: 11px; color: var(--muted);" th:text="${product.productSlug}">ao-so-mi-trang-basic</div>
                    </td>
                    <td>
                        <span th:text="${product.categoryName}">Áo sơ mi</span>
                    </td>
                    <td>
                        <div style="font-weight: 600;" th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')} + '₫'">299.000₫</div>
                    </td>
                    <td>
                        <span th:text="${product.stock}"
                              th:classappend="${product.stock < 10} ? 'text-warning' : (${product.stock == 0} ? 'text-danger' : '')">0</span>
                    </td>
                    <td>
                        <span th:unless="${product.isActive}" class="badge badge-danger">Ngưng bán</span>
                        <th:block th:if="${product.isActive}">
                            <span th:if="${product.stock > 0}" class="badge badge-success">Đang bán</span>
                            <span th:if="${product.stock <= 0}" class="badge badge-warning">Hết hàng</span>
                        </th:block>
                    </td>
                    <td>
                        <div class="actions-cell">
                            <a th:href="@{/admin/products/{id}(id=${product.productId})}"
                               class="btn btn-xs btn-outline" title="Xem chi tiết">
                                <svg style="width: 12px; height: 12px;" viewBox="0 0 24 24">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                            </a>
                            <a th:href="@{'/admin/products/' + ${product.productId} + '#reviews'}"
                               class="btn btn-xs btn-outline" title="Quản lý đánh giá">
                                <svg style="width: 12px; height: 12px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                                </svg>
                            </a>
                            <a th:href="@{/admin/products/{id}/edit(id=${product.productId})}"
                               class="btn btn-xs btn-outline" title="Chỉnh sửa">
                                <svg style="width: 12px; height: 12px;" viewBox="0 0 24 24">
                                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                                    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                                </svg>
                            </a>
                            <form th:action="@{/admin/products/{id}/toggle-status(id=${product.productId})}"
                                  method="post" style="display:inline;">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <button type="submit"
                                        th:if="${product.isActive}"
                                        class="btn btn-xs btn-outline-danger"
                                        title="Ẩn sản phẩm"
                                        onclick="return confirm('⚠️ Ẩn sản phẩm này?\n\nSản phẩm sẽ không hiển thị trên cửa hàng!')">
                                    <svg style="width: 12px; height: 12px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                        <line x1="1" y1="1" x2="23" y2="23"></line>
                                    </svg>
                                </button>
                                <button type="submit"
                                        th:unless="${product.isActive}"
                                        class="btn btn-xs btn-outline-success"
                                        title="Khôi phục sản phẩm"
                                        onclick="return confirm('✅ Khôi phục sản phẩm này?\n\nSản phẩm sẽ hiển thị lại trên cửa hàng!')">
                                    <svg style="width: 12px; height: 12px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <polyline points="1 4 1 10 7 10"></polyline>
                                        <path d="M3.51 15a9 9 0 1 0 .49-3.51"></path>
                                    </svg>
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>

        <!-- Empty State -->
        <div class="empty-state" th:if="${#lists.isEmpty(products.content)}">
            <svg style="width: 48px; height: 48px; margin-bottom: 12px;" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="10"/>
                <line x1="12" y1="8" x2="12" y2="12"/>
                <line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
            <p>Không tìm thấy sản phẩm nào</p>
            <a th:href="@{/admin/products/create}" class="btn btn-primary" style="margin-top: 12px;">
                Thêm sản phẩm đầu tiên
            </a>
        </div>
    </div>

    <!-- PAGINATION -->
    <th:block th:replace="~{fragments/pagination :: pagination(page=${products}, baseUrl='/admin/products')}"/>
</div>

</body>
</html>
