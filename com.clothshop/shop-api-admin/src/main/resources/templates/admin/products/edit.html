<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <title>Chỉnh sửa sản phẩm</title>
</head>
<body>

<h1 layout:fragment="page-title">Chỉnh sửa sản phẩm</h1>

<div layout:fragment="page-actions">
    <a th:href="@{/admin/products}" class="btn btn-outline">
        <svg style="width: 14px; height: 14px;" viewBox="0 0 24 24">
            <line x1="19" y1="12" x2="5" y2="12"/>
            <polyline points="12 19 5 12 12 5"/>
        </svg>
        Quay lại
    </a>
</div>

<div layout:fragment="content">
    <form th:action="@{/admin/products/{id}/edit(id=${product.productId})}"
          method="post"
          data-validate>

        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="product-form-layout">
            <!-- LEFT COLUMN -->
            <div class="product-form-left">

                <!-- THÔNG TIN CƠ BẢN -->
                <div class="form-card">
                    <h3>Thông tin cơ bản</h3>

                    <div class="form-group">
                        <label>Tên sản phẩm <span style="color: var(--danger);">*</span></label>
                        <input type="text"
                               name="productName"
                               th:value="${product.productName}"
                               placeholder="VD: Áo thun cotton nam basic"
                               required>
                    </div>

                    <div class="form-group">
                        <label>Slug</label>
                        <input type="text"
                               th:value="${product.productSlug}"
                               readonly
                               style="background: var(--bg); cursor: not-allowed;">
                        <small style="font-size: 11px; color: var(--muted);">
                            URL thân thiện SEO (tự động tạo từ tên sản phẩm)
                        </small>
                    </div>

                    <div class="form-group">
                        <label>Mô tả sản phẩm</label>
                        <textarea name="description"
                                  rows="5"
                                  placeholder="Mô tả chi tiết về sản phẩm..."
                                  th:text="${product.description}"></textarea>
                    </div>

                    <div class="form-group">
                        <label>Giá gốc <span style="color: var(--danger);">*</span></label>
                        <input type="number"
                               name="price"
                               th:value="${product.price}"
                               placeholder="0"
                               min="0"
                               step="1000"
                               required>
                    </div>

                    <div class="form-group">
                        <label>URL hình ảnh</label>
                        <input type="text"
                               name="imageUrl"
                               th:value="${product.imageUrl}"
                               placeholder="https://example.com/image.jpg">
                    </div>

                    <div class="form-group">
                        <label>Tồn kho hiện tại (readonly)</label>
                        <input type="text"
                               th:value="${product.stock}"
                               readonly
                               style="background: var(--bg); cursor: not-allowed;">
                        <small style="font-size: 11px; color: var(--muted);">
                            Tồn kho được quản lý ở variants. Đây là tổng kho của tất cả variants.
                        </small>
                    </div>
                </div>

            </div>

            <!-- RIGHT COLUMN -->
            <div class="product-form-right">

                <!-- DANH MỤC -->
                <div class="form-card">
                    <h3>Danh mục</h3>

                    <div class="form-group">
                        <label>Chọn danh mục <span style="color: var(--danger);">*</span></label>
                        <select name="categoryId" required>
                            <option value="">-- Chọn danh mục --</option>
                            <option th:each="cat : ${categories}"
                                    th:value="${cat.id}"
                                    th:text="${cat.categoryName}"
                                    th:selected="${cat.id == product.categoryId}">Category</option>
                        </select>
                    </div>
                </div>

                <!-- TRẠNG THÁI -->
                <div class="form-card">
                    <h3>Trạng thái</h3>

                    <label class="toggle-switch">
                        <input type="checkbox"
                               name="isActive"
                               th:checked="${product.isActive}">
                        <span class="toggle-slider"></span>
                        <span class="toggle-label">Hiển thị sản phẩm</span>
                    </label>

                    <small style="font-size: 11px; color: var(--muted); display: block; margin-top: 8px;">
                        Bật để sản phẩm hiển thị trên website
                    </small>
                </div>

                <!-- THÔNG TIN HỆ THỐNG -->
                <div class="form-card">
                    <h3>Thông tin</h3>

                    <div style="font-size: 12px; color: var(--muted); line-height: 1.6;">
                        <div style="margin-bottom: 6px;">
                            <strong>Ngày tạo:</strong>
                            <span th:text="${#temporals.format(product.createdAt, 'dd/MM/yyyy HH:mm')}">01/01/2024 10:00</span>
                        </div>
                        <div>
                            <strong>Cập nhật:</strong>
                            <span th:text="${#temporals.format(product.updatedAt, 'dd/MM/yyyy HH:mm')}">01/01/2024 10:00</span>
                        </div>
                    </div>
                </div>

            </div>
        </div>

        <!-- FORM ACTIONS -->
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">
                <svg style="width: 14px; height: 14px;" viewBox="0 0 24 24">
                    <polyline points="20 6 9 17 4 12"/>
                </svg>
                Lưu thay đổi
            </button>
            <a th:href="@{/admin/products}" class="btn btn-outline">Hủy</a>
            <form th:action="@{/admin/products/{id}/toggle-status(id=${product.productId})}"
                  method="post" style="display: inline; margin-left: auto;">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit"
                        class="btn"
                        th:classappend="${product.isActive} ? 'btn-danger' : 'btn-success'"
                        th:onclick="${product.isActive}
                            ? 'return confirm(\'⚠️ Ẩn sản phẩm này?\n\nSản phẩm sẽ không hiển thị trên cửa hàng!\')'
                            : 'return confirm(\'✅ Khôi phục sản phẩm này?\n\nSản phẩm sẽ hiển thị lại trên cửa hàng!\')'">
                    <span th:if="${product.isActive}">Ẩn sản phẩm</span>
                    <span th:unless="${product.isActive}">Hiện sản phẩm</span>
                </button>
            </form>
        </div>

    </form>
</div>

</body>
</html>
