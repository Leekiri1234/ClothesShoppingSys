<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quen mat khau Admin - MINIMAL</title>
    <link rel="stylesheet" th:href="@{/css/legacy-admin.css}">
    <style>
        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            background: radial-gradient(circle at 15% 20%, #f3eee5 0%, #f3eee5 20%, transparent 21%),
                        radial-gradient(circle at 82% 75%, #ebe5db 0%, #ebe5db 22%, transparent 23%),
                        #fafaf8;
            padding: 24px;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            border: 1px solid #e8e6e1;
            box-shadow: 0 24px 50px rgba(28, 28, 26, 0.08);
            padding: 32px 28px;
        }

        h1 {
            margin: 0;
            font-size: 13px;
            letter-spacing: 0.25em;
            text-align: center;
        }

        p {
            margin: 8px 0 18px;
            font-size: 12px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #6b6b67;
            text-align: center;
        }

        .alert {
            margin-bottom: 14px;
            border: 1px solid #b9d6f5;
            background: #f5faff;
            color: #2f5f9f;
            font-size: 13px;
            padding: 10px 12px;
        }

        label {
            display: block;
            font-size: 12px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 6px;
            color: #6b6b67;
        }

        input {
            width: 100%;
            border: 1px solid #e8e6e1;
            background: #fafaf8;
            padding: 10px 12px;
            font-size: 14px;
            color: #1c1c1a;
            margin-bottom: 14px;
        }

        button {
            width: 100%;
            border: 1px solid #1c1c1a;
            background: #1c1c1a;
            color: #fff;
            padding: 12px 14px;
            font-size: 12px;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            cursor: pointer;
        }

        button:hover {
            background: #c5a882;
            border-color: #c5a882;
        }

        .back {
            margin-top: 14px;
            text-align: center;
            font-size: 13px;
        }

        .back a {
            color: #1c1c1a;
            text-decoration: none;
            border-bottom: 1px solid #d2d0ca;
        }
    </style>
</head>
<body>
<div class="card">
    <h1>MINIMAL ADMIN</h1>
    <p>Khoi phuc mat khau</p>

    <div th:if="${message}" class="alert" th:text="${message}"></div>

    <form th:action="@{/admin/forgot-password}" method="post">
        <label for="email">Email nhan vien</label>
        <input id="email" name="email" type="email" autocomplete="email" required>

        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button type="submit">Gui yeu cau</button>
    </form>

    <div class="back">
        <a th:href="@{/admin/login}">Quay lai dang nhap</a>
    </div>
</div>
</body>
</html>
