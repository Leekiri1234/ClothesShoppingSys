<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <title>Thêm nhân viên mới</title>
</head>
<body>

<h1 layout:fragment="page-title">Thêm nhân viên mới</h1>

<div layout:fragment="page-actions">
    <a th:href="@{/admin/staff}" class="btn btn-outline">
        <svg style="width: 14px; height: 14px;" viewBox="0 0 24 24">
            <line x1="19" y1="12" x2="5" y2="12"/>
            <polyline points="12 19 5 12 12 5"/>
        </svg>
        Quay lại
    </a>
</div>

<div layout:fragment="content">

    <div style="max-width: 800px; margin: 0 auto;">
        <form th:action="@{/admin/staff/create}"
              th:object="${staffRequest}"
              method="post"
              data-validate>

            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <!-- THÔNG TIN CÁ NHÂN -->
            <div class="form-card">
                <h3>Thông tin cá nhân</h3>

                <div class="form-row">
                    <div class="form-group">
                        <label>Họ và tên <span style="color: var(--danger);">*</span></label>
                        <input type="text"
                               th:field="*{fullName}"
                               placeholder="VD: Nguyễn Văn A"
                               required>
                        <span class="text-danger" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></span>
                    </div>

                    <div class="form-group">
                        <label>Email <span style="color: var(--danger);">*</span></label>
                        <input type="email"
                               th:field="*{email}"
                               placeholder="email@example.com"
                               required>
                        <span class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Số điện thoại</label>
                        <input type="tel"
                               th:field="*{phone}"
                               placeholder="0123456789">
                        <span class="text-danger" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></span>
                    </div>

                    <!-- TODO: Add dateOfBirth to StaffCreateRequest if needed -->
                    <!--
                    <div class="form-group">
                        <label>Ngày sinh</label>
                        <input type="date"
                               th:field="*{dateOfBirth}">
                    </div>
                    -->
                </div>

                <!-- TODO: Add address to StaffCreateRequest if needed -->
                <!--
                <div class="form-group">
                    <label>Địa chỉ</label>
                    <textarea th:field="*{address}"
                              rows="2"
                              placeholder="Địa chỉ chi tiết..."></textarea>
                </div>
                -->
            </div>

            <!-- THÔNG TIN TÀI KHOẢN -->
            <div class="form-card">
                <h3>Thông tin tài khoản</h3>

                <div class="form-row">
                    <div class="form-group">
                        <label>Tên đăng nhập <span style="color: var(--danger);">*</span></label>
                        <input type="text"
                               th:field="*{username}"
                               placeholder="VD: nguyenvana"
                               required>
                        <span class="text-danger" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></span>
                        <small style="font-size: 11px; color: var(--muted);">
                            Chỉ chứa chữ thường, số và dấu gạch dưới
                        </small>
                    </div>

                    <div class="form-group">
                        <label>Vai trò <span style="color: var(--danger);">*</span></label>
                        <select th:field="*{roleId}" required>
                            <option value="">-- Chọn vai trò --</option>
                            <option th:each="role : ${roles}"
                                    th:value="${role.id}"
                                    th:text="${role.staffRole}">Role</option>
                        </select>
                        <span class="text-danger" th:if="${#fields.hasErrors('roleId')}" th:errors="*{roleId}"></span>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Mật khẩu <span style="color: var(--danger);">*</span></label>
                        <input type="password"
                               th:field="*{password}"
                               placeholder="Tối thiểu 6 ký tự"
                               required
                               minlength="6">
                        <span class="text-danger" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
                    </div>

                    <div class="form-group">
                        <label>Xác nhận mật khẩu <span style="color: var(--danger);">*</span></label>
                        <input type="password"
                               id="confirmPassword"
                               placeholder="Nhập lại mật khẩu"
                               required
                               minlength="6">
                        <small id="passwordMatch" style="font-size: 11px; display: none;"></small>
                    </div>
                </div>

                <div style="padding: 12px; background: #f0f7ff; border: 1px solid #d0e7ff; border-radius: var(--radius); margin-top: 16px;">
                    <div style="display: flex; gap: 8px;">
                        <svg style="width: 16px; height: 16px; color: #2196F3; flex-shrink: 0; margin-top: 2px;" viewBox="0 0 24 24">
                            <circle cx="12" cy="12" r="10"/>
                            <line x1="12" y1="16" x2="12" y2="12"/>
                            <line x1="12" y1="8" x2="12.01" y2="8"/>
                        </svg>
                        <div style="font-size: 12px; color: #1565c0; line-height: 1.5;">
                            <strong>Lưu ý:</strong> Mật khẩu phải có ít nhất 6 ký tự.
                            Nhân viên có thể đổi mật khẩu sau khi đăng nhập lần đầu.
                        </div>
                    </div>
                </div>
            </div>

            <!-- TRẠNG THÁI -->
            <div class="form-card">
                <h3>Trạng thái</h3>

                <label class="toggle-switch">
                    <input type="checkbox"
                           th:field="*{isActive}"
                           checked>
                    <span class="toggle-slider"></span>
                    <span class="toggle-label">Kích hoạt tài khoản ngay</span>
                </label>

                <small style="font-size: 11px; color: var(--muted); display: block; margin-top: 8px;">
                    Bật để nhân viên có thể đăng nhập ngay sau khi tạo tài khoản
                </small>
            </div>

            <!-- FORM ACTIONS -->
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">
                    <svg style="width: 14px; height: 14px;" viewBox="0 0 24 24">
                        <polyline points="20 6 9 17 4 12"/>
                    </svg>
                    Tạo nhân viên
                </button>
                <a th:href="@{/admin/staff}" class="btn btn-outline">Hủy</a>
            </div>

        </form>
    </div>

</div>

<div layout:fragment="scripts">
<script>
// Password confirmation validation
const passwordInput = document.querySelector('input[name="password"]');
const confirmPasswordInput = document.getElementById('confirmPassword');
const passwordMatchMsg = document.getElementById('passwordMatch');

function validatePassword() {
    if (confirmPasswordInput.value === '') {
        passwordMatchMsg.style.display = 'none';
        return;
    }

    passwordMatchMsg.style.display = 'block';
    if (passwordInput.value === confirmPasswordInput.value) {
        passwordMatchMsg.style.color = 'var(--success)';
        passwordMatchMsg.textContent = '✓ Mật khẩu khớp';
    } else {
        passwordMatchMsg.style.color = 'var(--danger)';
        passwordMatchMsg.textContent = '✗ Mật khẩu không khớp';
    }
}

passwordInput?.addEventListener('input', validatePassword);
confirmPasswordInput?.addEventListener('input', validatePassword);

// Form validation before submit
document.querySelector('form')?.addEventListener('submit', function(e) {
    if (passwordInput.value !== confirmPasswordInput.value) {
        e.preventDefault();
        AdminUI.showToast('Mật khẩu xác nhận không khớp!', 'danger');
        confirmPasswordInput.focus();
    }
});
</script>
</div>

</body>
</html>
