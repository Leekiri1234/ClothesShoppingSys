<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <title>Danh sách Voucher</title>
</head>
<body>

<h1 layout:fragment="page-title">Quản lý Voucher</h1>

<div layout:fragment="content" class="vouchers-list-page">
    <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
            <h5 class="mb-0">Danh sách Voucher</h5>
            <a class="btn btn-primary" th:href="@{/admin/vouchers/create}">+ Thêm mới</a>
        </div>
        <div class="card-body">
            <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead>
                    <tr>
                        <th>Mã</th>
                        <th>Loại</th>
                        <th>Giá trị</th>
                        <th>Đơn tối thiểu</th>
                        <th>Giảm tối đa</th>
                        <th>Lượt dùng</th>
                        <th>Hiệu lực</th>
                        <th>Trạng thái</th>
                        <th>Hành động</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="item : ${vouchers}">
                        <td th:text="${item.code}"></td>
                        <td th:text="${item.discountType.displayName}"></td>
                        <td th:text="${item.discountType.name() == 'PERCENTAGE' ? #numbers.formatDecimal(item.discountValue, 0, 'COMMA', 2, 'POINT') + ' %' : #numbers.formatDecimal(item.discountValue, 0, 'COMMA', 0, 'POINT') + ' ₫'}"></td>
                        <td th:text="${item.minOrderAmount != null ? #numbers.formatDecimal(item.minOrderAmount, 0, 'COMMA', 0, 'POINT') + ' ₫' : '-'}"></td>
                        <td th:text="${item.discountType.name() == 'PERCENTAGE' ? (item.maxDiscount != null ? #numbers.formatDecimal(item.maxDiscount, 0, 'COMMA', 0, 'POINT') + ' ₫' : '-') : '-'}"></td>
                        <td th:text="${item.currentUsage} + '/' + (${item.usageLimit} != null ? ${item.usageLimit} : '∞')"></td>
                        <td>
                            <div th:text="${#temporals.format(item.validFrom, 'dd/MM/yyyy HH:mm')} + ' - ' + ${#temporals.format(item.validTo, 'dd/MM/yyyy HH:mm')}"></div>
                        </td>
                        <td>
                            <span th:classappend="${item.status} == 'ACTIVE' ? 'bg-success' : (${item.status} == 'DISABLED' ? 'bg-secondary' : 'bg-warning')"
                                  class="badge"
                                  th:text="${item.status}"></span>
                        </td>
                        <td>
                            <div class="d-flex gap-2">
                                <a class="btn btn-sm btn-outline-primary" th:href="@{/admin/vouchers/edit/{id}(id=${item.id})}">Sửa</a>
                                <form th:if="${item.status == 'ACTIVE'}"
                                      th:action="@{/admin/vouchers/{id}/disable(id=${item.id})}"
                                      method="post"
                                      class="voucher-status-form"
                                      data-confirm-message="Vô hiệu hóa voucher này?">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                    <button type="submit" class="btn btn-sm btn-outline-danger">Vô hiệu</button>
                                </form>
                                <form th:if="${item.status == 'DISABLED'}"
                                      th:action="@{/admin/vouchers/{id}/enable(id=${item.id})}"
                                      method="post"
                                      class="voucher-status-form"
                                      data-confirm-message="Kích hoạt lại voucher này?">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                    <button type="submit" class="btn btn-sm btn-outline-success">Kích hoạt</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${vouchers == null or vouchers.isEmpty()}">
                        <td colspan="9" class="text-center text-muted">Chưa có voucher nào.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div layout:fragment="scripts">
    <script th:src="@{/js/modules/vouchers.js}"></script>
</div>

</body>
</html>
