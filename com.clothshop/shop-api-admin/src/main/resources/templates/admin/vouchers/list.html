<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <title>Danh sách Voucher</title>
</head>
<body>

<h1 layout:fragment="page-title">Voucher</h1>

<div layout:fragment="page-actions">
    <a class="btn btn-primary" th:href="@{/admin/vouchers/create}">
        <svg style="width: 14px; height: 14px;" viewBox="0 0 24 24">
            <line x1="12" y1="5" x2="12" y2="19"/>
            <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        Thêm Voucher
    </a>
</div>

<div layout:fragment="content">
    <div class="dashboard-card">
        <table class="admin-table">
            <thead>
            <tr>
                <th>Mã</th>
                <th>Loại</th>
                <th style="text-align: right;">Giá trị</th>
                <th style="text-align: right;">Đơn tối thiểu</th>
                <th style="text-align: right;">Giảm tối đa</th>
                <th style="text-align: center;">Lượt dùng</th>
                <th>Hiệu lực</th>
                <th style="width: 100px;">Trạng thái</th>
                <th style="width: 160px;">Hành động</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${vouchers}">
                <td>
                    <span style="font-weight: 600; font-family: monospace; font-size: 13px;"
                          th:text="${item.code}"></span>
                </td>
                <td th:text="${item.discountType.displayName}"></td>
                <td style="text-align: right; font-weight: 600;"
                    th:text="${item.discountType.name() == 'PERCENTAGE' ? #numbers.formatDecimal(item.discountValue, 0, 'COMMA', 2, 'POINT') + ' %' : #numbers.formatDecimal(item.discountValue, 0, 'COMMA', 0, 'POINT') + ' ₫'}"></td>
                <td style="text-align: right;"
                    th:text="${item.minOrderAmount != null ? #numbers.formatDecimal(item.minOrderAmount, 0, 'COMMA', 0, 'POINT') + ' ₫' : '—'}"></td>
                <td style="text-align: right;"
                    th:text="${item.discountType.name() == 'PERCENTAGE' ? (item.maxDiscount != null ? #numbers.formatDecimal(item.maxDiscount, 0, 'COMMA', 0, 'POINT') + ' ₫' : '—') : '—'}"></td>
                <td style="text-align: center;"
                    th:text="${item.currentUsage} + '/' + (${item.usageLimit} != null ? ${item.usageLimit} : '∞')"></td>
                <td>
                    <div style="font-size: 12px; color: var(--muted);"
                         th:text="${#temporals.format(item.validFrom, 'dd/MM/yyyy')} + ' → ' + ${#temporals.format(item.validTo, 'dd/MM/yyyy')}"></div>
                </td>
                <td>
                    <span th:if="${item.status == 'ACTIVE'}" class="badge badge-success">Active</span>
                    <span th:if="${item.status == 'DISABLED'}" class="badge badge-muted">Disabled</span>
                    <span th:if="${item.status != 'ACTIVE' && item.status != 'DISABLED'}" class="badge badge-warning" th:text="${item.status}"></span>
                </td>
                <td>
                    <div style="display: flex; gap: 6px; flex-wrap: wrap;">
                        <a class="btn btn-xs btn-outline" th:href="@{/admin/vouchers/edit/{id}(id=${item.id})}">
                            <svg style="width: 12px; height: 12px;" viewBox="0 0 24 24">
                                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                            </svg>
                            Sửa
                        </a>
                        <form th:if="${item.status == 'ACTIVE'}" th:action="@{/admin/vouchers/{id}/disable(id=${item.id})}" method="post" style="display: inline;"
                              onsubmit="return confirm('Vô hiệu hóa voucher này?');">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                            <button type="submit" class="btn btn-xs btn-danger">Tắt</button>
                        </form>
                        <form th:if="${item.status == 'DISABLED'}" th:action="@{/admin/vouchers/{id}/enable(id=${item.id})}" method="post" style="display: inline;"
                              onsubmit="return confirm('Kích hoạt lại voucher này?');">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                            <button type="submit" class="btn btn-xs btn-success">Bật</button>
                        </form>
                    </div>
                </td>
            </tr>
            <tr th:if="${vouchers == null or vouchers.isEmpty()}">
                <td colspan="9" class="empty-state">Chưa có voucher nào.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
