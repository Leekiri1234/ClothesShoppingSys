<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <title>Marketing - Banner</title>
</head>
<body>

<h1 layout:fragment="page-title">Banner Marketing</h1>

<div layout:fragment="page-actions">
    <form th:action="@{/admin/marketing/banners/create}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <button class="btn btn-dark" type="submit">
            <svg style="width: 14px; height: 14px;" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Tạo Banner
        </button>
    </form>
</div>

<div layout:fragment="content" class="marketing-banners-page">
    <div class="page-header">
        <h2>Quản lý Banner</h2>
        <span class="page-subtitle">Sắp xếp thứ tự, trạng thái và điểm đến của banner</span>
    </div>

    <div class="dashboard-card" style="margin-bottom: 20px;">
        <table class="admin-table">
            <thead>
            <tr>
                <th style="width: 80px;">Thứ tự</th>
                <th style="width: 320px;">Ảnh Banner</th>
                <th>Tiêu đề</th>
                <th>Liên kết</th>
                <th>Trạng thái</th>
                <th style="width: 180px;">Thao tác</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="banner : ${banners}">
                <td th:text="${banner.order}">1</td>
                <td>
                    <img th:src="@{${banner.image}}" th:alt="${banner.title}" style="width: 100%; max-width: 300px; border-radius: 6px; border: 1px solid var(--border);">
                </td>
                <td th:text="${banner.title}" style="font-weight: 600;">Summer Collection 2026</td>
                <td><span th:text="${banner.link}">/collections/summer-2026</span></td>
                <td>
                    <span class="badge" th:classappend="${banner.status == 'ACTIVE'} ? ' badge-success' : ' badge-muted'" th:text="${banner.status == 'ACTIVE'} ? 'Đang hiển thị' : 'Nháp'">Đang hiển thị</span>
                </td>
                <td>
                    <div class="actions-cell" style="justify-content: center;">
                        <a class="btn btn-xs btn-outline" th:href="@{/admin/marketing/banners/{id}/edit(id=${banner.id})}">Sửa</a>
                        <form th:action="@{/admin/marketing/banners/{id}/toggle(id=${banner.id})}" method="post" th:if="${banner.status == 'ACTIVE'}">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <input type="hidden" name="status" value="ACTIVE"/>
                            <button class="btn btn-xs btn-danger" type="submit">Ẩn</button>
                        </form>
                        <form th:action="@{/admin/marketing/banners/{id}/toggle(id=${banner.id})}" method="post" th:if="${banner.status != 'ACTIVE'}">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <input type="hidden" name="status" value="INACTIVE"/>
                            <button class="btn btn-xs btn-success" type="submit">Kích hoạt</button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
