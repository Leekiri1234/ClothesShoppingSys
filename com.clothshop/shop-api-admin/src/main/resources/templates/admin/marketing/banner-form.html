<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <title>Chỉnh sửa banner</title>
</head>
<body>

<div layout:fragment="styles">
    <style>
        .banner-option-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 12px;
            margin-top: 10px;
        }

        .banner-option-item {
            border: 1px solid #dfdcd6;
            border-radius: 8px;
            background: #f8f7f4;
            overflow: hidden;
        }

        .banner-option-item img {
            width: 100%;
            height: 110px;
            object-fit: cover;
            display: block;
        }

        .banner-option-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 8px;
            font-size: 12px;
            color: #3f3c36;
        }
    </style>
</div>

<h1 layout:fragment="page-title">Chỉnh sửa banner</h1>

<div layout:fragment="content" class="marketing-banner-form-page">
    <div class="page-header">
        <h2>Cập nhật thông tin banner</h2>
        <span class="page-subtitle">Chỉnh ảnh, tiêu đề, liên kết và thứ tự hiển thị</span>
    </div>

    <div class="form-card" style="max-width: 860px; margin: 0 auto;">
        <form th:action="@{/admin/marketing/banners/{id}/edit(id=${banner.id})}" method="post" data-validate>
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="form-row">
                <div class="form-group">
                    <label>Tiêu đề</label>
                    <input type="text" name="title" th:value="${banner.title}" required>
                </div>
                <div class="form-group">
                    <label>Thứ tự hiển thị</label>
                    <input type="number" name="order" min="1" th:value="${banner.order}" required>
                </div>
            </div>

            <div class="form-group">
                <label>Link ảnh</label>
                <input type="text" name="image" id="bannerImageInput" th:value="${banner.image}" required>
                <small style="font-size: 12px; color: var(--muted);">Bạn có thể nhập URL tùy ý hoặc chọn ảnh có sẵn bên dưới.</small>

                <div class="banner-option-grid">
                    <div class="banner-option-item" th:each="opt : ${bannerImageOptions}">
                        <img th:src="@{${opt.url}}" th:alt="${opt.label}">
                        <div class="banner-option-meta">
                            <span th:text="${opt.label}">Banner option</span>
                            <button class="btn btn-xs btn-outline" type="button"
                                    th:attr="data-image-url=${opt.url}"
                                    onclick="selectBannerImage(this)">
                                Chọn ảnh
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label>Liên kết điều hướng</label>
                <input type="text" name="link" th:value="${banner.link}" required>
            </div>

            <div class="form-group" style="max-width: 260px;">
                <label>Trạng thái</label>
                <select name="status" required>
                    <option value="ACTIVE" th:selected="${banner.status == 'ACTIVE'}">Đang hiển thị</option>
                    <option value="INACTIVE" th:selected="${banner.status != 'ACTIVE'}">Ẩn</option>
                </select>
            </div>

            <div style="margin: 12px 0 18px;">
                <img id="bannerPreview" th:src="@{${banner.image}}" alt="Banner preview" style="max-width: 100%; width: 100%; border: 1px solid var(--border); border-radius: 6px;">
            </div>

            <div class="form-actions">
                <a class="btn btn-outline" th:href="@{/admin/marketing/banners}">Quay lại</a>
                <button class="btn btn-dark" type="submit">Lưu thay đổi</button>
            </div>
        </form>
    </div>
</div>

<div layout:fragment="scripts">
    <script>
        function selectBannerImage(button) {
            const imageUrl = button.getAttribute('data-image-url');
            const input = document.getElementById('bannerImageInput');
            const preview = document.getElementById('bannerPreview');
            if (!input || !preview || !imageUrl) {
                return;
            }
            input.value = imageUrl;
            preview.src = imageUrl;
        }

        document.addEventListener('DOMContentLoaded', function () {
            const input = document.getElementById('bannerImageInput');
            const preview = document.getElementById('bannerPreview');
            if (!input || !preview) {
                return;
            }

            input.addEventListener('input', function () {
                const value = input.value.trim();
                if (value.length > 0) {
                    preview.src = value;
                }
            });
        });
    </script>
</div>

</body>
</html>
