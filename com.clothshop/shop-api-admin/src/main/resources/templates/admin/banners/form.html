<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">

<head>
    <title th:text="${banner.id != null} ? 'Chỉnh sửa banner' : 'Tạo banner'">Quản lý banner</title>
</head>

<body>

<h1 layout:fragment="page-title" th:text="${banner.id != null} ? 'Chỉnh sửa banner' : 'Tạo banner mới'">Banner</h1>

<div layout:fragment="content">

    <div class="dashboard-card" style="max-width: 800px;">

        <form th:action="${banner.id != null} ? @{/admin/banners/{id}(id=${banner.id})} : @{/admin/banners}"
              th:object="${banner}"
              method="post"
              enctype="multipart/form-data"
              class="admin-form">

            <!-- CSRF Token -->
            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}"/>

            <!-- Title -->
            <div class="form-group">
                <label for="title" class="form-label">Tiêu đề <span class="text-danger">*</span></label>
                <input type="text"
                       class="form-control"
                       id="title"
                       th:field="*{title}"
                       placeholder="Nhập tiêu đề banner"
                       required>
                <div class="form-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
            </div>

            <!-- Link URL -->
            <div class="form-group">
                <label for="linkUrl" class="form-label">Liên kết</label>
                <input type="text"
                       class="form-control"
                       id="linkUrl"
                       th:field="*{linkUrl}"
                       placeholder="https://example.com">
                <small class="form-text text-muted">URL mà banner sẽ dẫn đến khi bấm vào</small>
            </div>

            <!-- Image Upload -->
            <div class="form-group">
                <label for="imageFile" class="form-label">Ảnh banner <span class="text-danger">*</span></label>
                <div class="image-preview-container" style="margin-bottom: 12px;">
                    <img id="imagePreview"
                         th:if="${banner.imageUrl != null and !#strings.isEmpty(banner.imageUrl) and banner.imageUrl != 'undefined'}"
                         th:src="@{${banner.imageUrl}}"
                         alt="Banner preview"
                         style="max-width: 100%; max-height: 200px; display: block;">
                    <img id="imagePreviewPlaceholder"
                         th:unless="${banner.imageUrl != null and !#strings.isEmpty(banner.imageUrl) and banner.imageUrl != 'undefined'}"
                         src=""
                         alt="Banner preview"
                         style="max-width: 100%; max-height: 200px; display: none;">
                </div>
                <div class="form-control-file">
                    <input type="file"
                           class="form-control"
                           id="imageFile"
                           name="file"
                           accept="image/*"
                           th:required="${banner.imageUrl == null or #strings.isEmpty(banner.imageUrl) or banner.imageUrl == 'undefined'}">
                    <small class="form-text text-muted">Định dạng: JPG, PNG, GIF. Kích thước tối đa: 5MB</small>
                </div>
                <script>
                    document.getElementById('imageFile').addEventListener('change', function(e) {
                        const file = e.target.files[0];
                        if (file) {
                            const reader = new FileReader();
                            reader.onload = function(event) {
                                const preview = document.getElementById('imagePreview') || document.getElementById('imagePreviewPlaceholder');
                                if (preview) {
                                    preview.src = event.target.result;
                                    preview.style.display = 'block';
                                }
                            };
                            reader.readAsDataURL(file);
                        }
                    });
                </script>
            </div>

            <!-- Display Order -->
            <div class="form-group">
                <label for="displayOrder" class="form-label">Thứ tự hiển thị <span class="text-danger">*</span></label>
                <input type="number"
                       class="form-control"
                       id="displayOrder"
                       th:field="*{displayOrder}"
                       placeholder="0"
                       min="0"
                       required>
                <small class="form-text text-muted">Số nhỏ hơn sẽ hiển thị trước (0, 1, 2...)</small>
                <div class="form-error" th:if="${#fields.hasErrors('displayOrder')}" th:errors="*{displayOrder}"></div>
            </div>

            <!-- Status -->
            <div class="form-group">
                <label for="status" class="form-label">Trạng thái <span class="text-danger">*</span></label>
                <select class="form-control" id="status" th:field="*{status}" required>
                    <option value="">-- Chọn trạng thái --</option>
                    <option value="ACTIVE">Hoạt động</option>
                    <option value="INACTIVE">Ngừng hoạt động</option>
                </select>
                <div class="form-error" th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></div>
            </div>

            <!-- Start Date -->
            <div class="form-group">
                <label for="startDate" class="form-label">Ngày bắt đầu <span class="text-danger">*</span></label>
                <input type="date"
                       class="form-control"
                       id="startDate"
                       th:field="*{startDate}"
                       required>
                <div class="form-error" th:if="${#fields.hasErrors('startDate')}" th:errors="*{startDate}"></div>
            </div>

            <!-- End Date -->
            <div class="form-group">
                <label for="endDate" class="form-label">Ngày kết thúc <span class="text-danger">*</span></label>
                <input type="date"
                       class="form-control"
                       id="endDate"
                       th:field="*{endDate}"
                       required>
                <div class="form-error" th:if="${#fields.hasErrors('endDate')}" th:errors="*{endDate}"></div>
            </div>

            <!-- Form Actions -->
            <div class="form-actions" style="display: flex; gap: 8px; margin-top: 24px;">
                <button type="submit" class="btn btn-primary">
                    <span th:if="${banner.id != null}">Cập nhật</span>
                    <span th:if="${banner.id == null}">Tạo banner</span>
                </button>
                <a th:href="@{/admin/banners}" class="btn btn-secondary">
                    Hủy
                </a>
            </div>

        </form>

    </div>

</div>

<style>
    .admin-form {
        display: flex;
        flex-direction: column;
        gap: 16px;
    }

    .form-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
    }

    .form-label {
        font-weight: 600;
        font-size: 14px;
        color: var(--text-primary);
    }

    .form-control {
        padding: 8px 12px;
        border: 1px solid var(--border);
        border-radius: 6px;
        font-size: 14px;
        transition: border-color 0.2s;
    }

    .form-control:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(197, 168, 130, 0.15);
    }

    .form-control-file {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 6px;
    }

    .form-control-file input[type="file"] {
        padding: 8px 12px;
    }

    .form-text {
        font-size: 12px;
        color: var(--muted);
    }

    .form-error {
        font-size: 12px;
        color: #dc3545;
        margin-top: 4px;
    }

    .form-actions {
        margin-top: 24px;
        padding-top: 16px;
        border-top: 1px solid var(--border);
    }

    .image-preview-container {
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 8px;
        background-color: var(--bg);
        min-height: 100px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .image-preview-container img {
        max-width: 100%;
        max-height: 200px;
        object-fit: contain;
    }
</style>

</body>
</html>
