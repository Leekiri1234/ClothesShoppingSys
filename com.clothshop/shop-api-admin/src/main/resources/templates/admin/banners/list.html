<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">

<head>
    <title>Quản lý banner</title>
</head>

<body>

<h1 layout:fragment="page-title">Banner</h1>

<div layout:fragment="page-actions">
    <a th:href="@{/admin/banners/form}" class="btn btn-primary">
        + Thêm banner
    </a>
</div>

<div layout:fragment="content">

    <!-- TABLE -->
    <div class="dashboard-card">
        <table class="admin-table">
            <thead>
            <tr>
                <th style="width: 60px;">ID</th>
                <th style="width: 150px;">Ảnh</th>
                <th>Tiêu đề</th>
                <th style="width: 120px;">Order</th>
                <th style="width: 120px;">Trạng thái</th>
                <th style="width: 180px;">Thao tác</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="b : ${banners}">

                <td th:text="${b.id}"></td>

                <td>
                    <img th:if="${b.imageUrl != null and !#strings.isEmpty(b.imageUrl) and b.imageUrl != 'undefined'}"
                         th:src="@{${b.imageUrl}}"
                         alt="Banner"
                         style="width: 120px; height: 60px; object-fit: cover; border-radius: 6px;">
                    <span th:unless="${b.imageUrl != null and !#strings.isEmpty(b.imageUrl) and b.imageUrl != 'undefined'}"
                          style="font-size: 12px; color: var(--muted);">
                        Chua co anh
                    </span>
                </td>

                <td th:text="${b.title}"></td>

                <td th:text="${b.displayOrder}"></td>

                <td>
                    <span th:if="${b.status == 'ACTIVE'}"
                          class="status-badge status-active">
                        Active
                    </span>

                    <span th:if="${b.status == 'INACTIVE'}"
                          class="status-badge status-pending">
                        Inactive
                    </span>
                </td>

                <td>
                    <div class="action-buttons">

                        <!-- EDIT -->
                        <a th:href="@{/admin/banners/form(id=${b.id})}"
                           class="action-btn action-btn-edit"
                           title="Chỉnh sửa">
                            ✏️
                        </a>

                        <!-- TOGGLE STATUS -->
                        <form th:action="@{/admin/banners/form}"
                              method="post"
                              style="display:inline;"
                              th:onsubmit="return confirm('Bạn có chắc chắn muốn thay đổi trạng thái banner này?')">
                            <input type="hidden"
                                   th:name="${_csrf.parameterName}"
                                   th:value="${_csrf.token}"/>
                            <input type="hidden" name="id" th:value="${b.id}"/>

                            <button type="submit"
                                    class="action-btn"
                                    th:classappend="${b.status == 'ACTIVE'} ? 'action-btn-delete' : 'action-btn-edit'"
                                    th:title="${b.status == 'ACTIVE'} ? 'Vô hiệu hóa' : 'Kích hoạt'">
                                <span th:text="${b.status == 'ACTIVE'} ? '⏸' : '▶️'"></span>
                            </button>
                        </form>

                    </div>
                </td>

            </tr>
            </tbody>
        </table>

        <!-- EMPTY -->
        <div th:if="${#lists.isEmpty(banners)}" class="empty-state">
            <h3>Chưa có banner</h3>
            <a th:href="@{/admin/banners/form}" class="btn btn-primary">
                Tạo banner đầu tiên
            </a>
        </div>
    </div>

</div>
</body>
</html>
