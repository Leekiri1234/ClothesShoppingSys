<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <title>Báo cáo doanh thu</title>
</head>
<body>

<h1 layout:fragment="page-title">Báo cáo doanh thu</h1>

<div layout:fragment="content" class="reports-revenue-page">
    <div class="page-header">
        <h2>Revenue Analytics</h2>
        <span class="page-subtitle">Theo dõi doanh thu theo tháng và chỉ số giá trị đơn hàng trung bình</span>
    </div>

    <div class="dashboard-grid" style="grid-template-columns: 1fr;">
        <div class="dashboard-card chart-card">
            <div class="card-header"><h3>Doanh thu 6 tháng gần nhất</h3></div>
            <div style="display: grid; gap: 12px; padding-top: 10px;">
                <div th:each="r : ${monthly}" style="display: grid; grid-template-columns: 120px 1fr 180px; align-items: center; gap: 12px;">
                    <div style="font-weight: 600;" th:text="${r.month}">T10/2025</div>
                    <div style="height: 12px; background: #ebe8df; border-radius: 999px; overflow: hidden;">
                        <div th:style="'height: 100%; background: var(--accent); width: ' + ${r.percent} + '%;'" style="height: 100%; background: var(--accent); width: 80%;"></div>
                    </div>
                    <div style="text-align: right; font-weight: 700;" th:text="${r.revenue} + ' ₫'">74.500.000 ₫</div>
                </div>
            </div>
        </div>
    </div>

    <div class="dashboard-card" style="margin-top: 20px;">
        <table class="admin-table">
            <thead>
            <tr>
                <th>Tháng</th>
                <th>Doanh thu</th>
                <th>Số đơn</th>
                <th>AOV</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="r : ${monthly}">
                <td th:text="${r.month}">T10/2025</td>
                <td th:text="${r.revenue} + ' ₫'">74.500.000 ₫</td>
                <td th:text="${r.orders}">158</td>
                <td th:text="${r.aov} + ' ₫'">471.519 ₫</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
