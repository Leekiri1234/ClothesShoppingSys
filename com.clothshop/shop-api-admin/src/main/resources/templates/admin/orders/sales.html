<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <title>Báo cáo doanh thu</title>
</head>
<body>

<h1 layout:fragment="page-title">Báo cáo doanh thu</h1>

<div layout:fragment="content">
    <!-- FILTER SECTION -->
    <div class="dashboard-card" style="margin-bottom: 20px;">
        <div class="card-header">
            <h3>Lọc theo ngày</h3>
        </div>
        <form method="get" th:action="@{/admin/reports/sales}" style="display: flex; gap: 15px; align-items: flex-end;">
            <div style="flex: 1;">
                <label for="startDate" style="display: block; margin-bottom: 5px; font-weight: 500;">Từ ngày</label>
                <input type="date" id="startDate" name="startDate" th:value="${startDate}" required style="width: 100%; padding: 8px; border: 1px solid var(--border);">
            </div>
            <div style="flex: 1;">
                <label for="endDate" style="display: block; margin-bottom: 5px; font-weight: 500;">Đến ngày</label>
                <input type="date" id="endDate" name="endDate" th:value="${endDate}" required style="width: 100%; padding: 8px; border: 1px solid var(--border);">
            </div>
            <button type="submit" style="padding: 8px 20px; background: var(--primary); color: white; border: none; cursor: pointer;">
                Xem báo cáo
            </button>
        </form>
    </div>

    <!-- SUMMARY STATS -->
    <div class="stat-cards" style="margin-bottom: 20px;">
        <div class="stat-card">
            <div class="stat-icon" style="background: #f0f7ff;">
                <svg style="width: 20px; height: 20px; color: #2196F3;" viewBox="0 0 24 24">
                    <line x1="12" y1="1" x2="12" y2="23"/>
                    <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
                </svg>
            </div>
            <div class="stat-body">
                <div class="stat-label">Tổng doanh thu</div>
                <div class="stat-value" th:text="${#numbers.formatDecimal(report.totalRevenue, 0, 'COMMA', 0, 'POINT')} + '₫'">0₫</div>
            </div>
        </div>

        <div class="stat-card">
            <div class="stat-icon" style="background: #e8f5e9;">
                <svg style="width: 20px; height: 20px; color: #4CAF50;" viewBox="0 0 24 24">
                    <circle cx="9" cy="21" r="1"/>
                    <circle cx="20" cy="21" r="1"/>
                    <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
                </svg>
            </div>
            <div class="stat-body">
                <div class="stat-label">Số đơn hàng</div>
                <div class="stat-value" th:text="${report.totalOrders}">0</div>
            </div>
        </div>

        <div class="stat-card">
            <div class="stat-icon" style="background: #fff3e0;">
                <svg style="width: 20px; height: 20px; color: #f0a500;" viewBox="0 0 24 24">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                    <circle cx="9" cy="7" r="4"/>
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                    <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                </svg>
            </div>
            <div class="stat-body">
                <div class="stat-label">Khách hàng</div>
                <div class="stat-value" th:text="${report.totalCustomers}">0</div>
            </div>
        </div>

        <div class="stat-card">
            <div class="stat-icon" style="background: #fdecea;">
                <svg style="width: 20px; height: 20px; color: #e63946;" viewBox="0 0 24 24">
                    <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
                </svg>
            </div>
            <div class="stat-body">
                <div class="stat-label">Sản phẩm bán</div>
                <div class="stat-value" th:text="${report.totalProducts}">0</div>
            </div>
        </div>
    </div>

    <!-- REVENUE CHART -->
    <div class="dashboard-card" style="margin-bottom: 20px;">
        <div class="card-header">
            <h3>Biểu đồ doanh thu</h3>
        </div>
        <canvas id="revenueChart" style="max-height: 400px;"></canvas>
    </div>

    <!-- TOP PRODUCTS -->
    <div class="dashboard-card">
        <div class="card-header">
            <h3>Top 5 Sản phẩm bán chạy</h3>
        </div>
        <div class="top-products-list">
            <div th:if="${!report.topProducts.isEmpty()}" th:each="product, iter : ${report.topProducts}">
                <div class="top-product-item" th:classappend="${iter.index == 0 ? 'gold' : iter.index == 1 ? 'silver' : iter.index == 2 ? 'bronze' : ''}">
                    <div class="top-product-rank" th:classappend="${iter.index == 0 ? 'gold' : iter.index == 1 ? 'silver' : iter.index == 2 ? 'bronze' : ''}" th:text="${iter.count}">1</div>
                    <div class="top-product-info">
                        <div class="top-product-name" th:text="${product.productName}">Sản phẩm</div>
                        <div class="top-product-sold" th:text="'Số lượng: ' + ${product.quantity}">Số lượng: 0</div>
                    </div>
                    <div class="top-product-revenue" th:text="${#numbers.formatDecimal(product.revenue / 1000000, 1, 'COMMA', 1, 'POINT')} + 'M'">0M</div>
                </div>
            </div>
            <div th:if="${report.topProducts.isEmpty()}" style="text-align: center; padding: 20px; color: #999;">
                Chưa có dữ liệu sản phẩm
            </div>
        </div>
    </div>

    <!-- DAILY SALES TABLE -->
    <div class="dashboard-card" style="margin-top: 20px;">
        <div class="card-header">
            <h3>Chi tiết doanh thu theo ngày</h3>
        </div>
        <table class="admin-table">
            <thead>
                <tr>
                    <th>Ngày</th>
                    <th>Doanh thu</th>
                    <th>Số đơn hàng</th>
                </tr>
            </thead>
            <tbody th:if="${!report.dailySales.isEmpty()}">
                <tr th:each="daily : ${report.dailySales}">
                    <td th:text="${#temporals.format(daily.date, 'dd/MM/yyyy')}">01/01/2025</td>
                    <td th:text="${#numbers.formatDecimal(daily.amount, 0, 'COMMA', 0, 'POINT')} + '₫'">0₫</td>
                    <td th:text="${daily.orderCount}">0</td>
                </tr>
            </tbody>
            <tbody th:if="${report.dailySales.isEmpty()}">
                <tr>
                    <td colspan="3" style="text-align: center; padding: 20px; color: #999;">
                        Chưa có dữ liệu bán hàng
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<div layout:fragment="scripts">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
<script th:inline="javascript">
function renderChart() {
    const dailySales = /*[[${report.dailySales}]]*/ [];
    
    if (dailySales.length === 0) {
        return;
    }
    
    const ctx = document.getElementById('revenueChart').getContext('2d');
    
    const labels = dailySales.map(sale => {
        const date = new Date(sale.date);
        return date.toLocaleDateString('vi-VN', { month: '2-digit', day: '2-digit' });
    });
    
    const amounts = dailySales.map(sale => parseFloat(sale.amount));
    
    new Chart(ctx, {
        type: 'line',
        data: {
            labels: labels,
            datasets: [{
                label: 'Doanh thu (₫)',
                data: amounts,
                borderColor: '#2196F3',
                backgroundColor: 'rgba(33, 150, 243, 0.1)',
                borderWidth: 2,
                fill: true,
                tension: 0.4,
                pointRadius: 4,
                pointBackgroundColor: '#2196F3',
                pointBorderColor: '#fff',
                pointBorderWidth: 2
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: true,
            plugins: {
                legend: {
                    display: true,
                    labels: { font: { size: 12 } }
                },
                tooltip: {
                    backgroundColor: 'rgba(0, 0, 0, 0.8)',
                    padding: 12,
                    callbacks: {
                        label: function(context) {
                            const value = context.parsed.y;
                            return new Intl.NumberFormat('vi-VN', { 
                                style: 'currency', 
                                currency: 'VND',
                                minimumFractionDigits: 0
                            }).format(value);
                        }
                    }
                }
            },
            scales: {
                y: {
                    beginAtZero: true,
                    ticks: {
                        callback: function(value) {
                            return value >= 1000000 ? (value / 1000000).toFixed(1) + 'M' : value;
                        }
                    }
                }
            }
        }
    });
}

document.addEventListener('DOMContentLoaded', renderChart);
</script>
</div>

</body>
</html>
