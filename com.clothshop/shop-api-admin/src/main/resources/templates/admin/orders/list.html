<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <title>Quản lý đơn hàng</title>
</head>

<h1 layout:fragment="page-title">Đơn hàng</h1>

<div layout:fragment="content">
    <div class="container-fluid">


        <div class="card shadow mb-4 border-0">
            <div class="card-header py-3 bg-white d-flex flex-row align-items-center justify-content-between">
                <h6 class="m-0 font-weight-bold text-primary">Bộ lọc tìm kiếm</h6>
            </div>
            <div class="card-body">
                <form th:action="@{/admin/orders}" th:object="${filter}" method="get">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label fw-bold small text-uppercase text-muted">Từ khóa</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="fas fa-search text-muted"></i></span>
                                <input type="text" th:field="*{keyword}" class="form-control border-start-0" placeholder="Mã đơn, SĐT, Tên khách...">
                            </div>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label fw-bold small text-uppercase text-muted">Trạng thái đơn hàng</label>
                            <select class="form-select" th:field="*{status}">
                                <option value="" selected>Tất cả trạng thái</option>
                                <option th:each="st : ${allStatuses}"
                                        th:value="${st}"
                                        th:text="${st.displayName}"></option>
                            </select>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label fw-bold small text-uppercase text-muted">Ngày đặt hàng</label>
                            <div class="input-group">
                                <input type="datetime-local" th:field="*{startDate}" class="form-control" aria-label="Từ ngày">
                                <span class="input-group-text bg-light border-start-0 border-end-0"><i class="fas fa-arrow-right text-muted small"></i></span>
                                <input type="datetime-local" th:field="*{endDate}" class="form-control" aria-label="Đến ngày">
                            </div>
                        </div>

                        <div class="col-12 text-end mt-3">
                            <a th:href="@{/admin/orders}" class="btn btn-light me-2">
                                <i class="fas fa-undo me-1"></i> Xóa bộ lọc
                            </a>
                            <button type="submit" class="btn btn-primary px-4">
                                <i class="fas fa-filter me-1"></i> Áp dụng
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <div class="card shadow mb-4">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-bordered" width="100%" cellspacing="0">
                        <thead>
                        <tr>
                            <th>Mã đơn</th>
                            <th>Ngày đặt</th>
                            <th>Khách hàng</th>
                            <th>Tổng tiền</th>
                            <th>Trạng thái</th>
                            <th>Thao tác</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="order : ${orders.content}">
                            <td th:text="${order.orderInvoice}" class="font-weight-bold">INV-123</td>
                            <td th:text="${#temporals.format(order.createdAt, 'dd/MM/yyyy HH:mm')}"></td>
                            <td th:text="${order.customerName}">Nguyen Van A</td>
                            <td th:text="${#numbers.formatDecimal(order.totalPrice, 0, 'COMMA', 0, 'POINT')} + ' đ'" class="text-danger"></td>
                            <td>
                                    <span th:class="|badge ${order.status.name() == 'CANCELLED' ? 'badge-danger' :
                                                           (order.status.name() == 'DELIVERED' ? 'badge-success' : 'badge-warning')}|"
                                          th:text="${order.status.displayName}">
                                    </span>
                            </td>
                            <td>
                                <a th:href="@{/admin/orders/{id}(id=${order.orderId})}" class="btn btn-info btn-sm">
                                    <i class="fas fa-eye"></i> Chi tiết
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${orders.totalElements == 0}">
                            <td colspan="6" class="text-center">Không tìm thấy đơn hàng nào.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <div th:if="${orders.totalPages > 1}" class="mt-3">
                    <nav>
                        <ul class="pagination justify-content-center">
                            <li class="page-item" th:classappend="${orders.first} ? 'disabled'">
                                <a class="page-link" th:href="@{/admin/orders(page=${orders.number - 1}, keyword=${filter.keyword}, statuses=${filter.statuses}, startDate=${filter.startDate}, endDate=${filter.endDate})}">Trước</a>
                            </li>
                            <li class="page-item" th:each="i : ${#numbers.sequence(0, orders.totalPages - 1)}"
                                th:classappend="${i == orders.number} ? 'active'">
                                <a class="page-link" th:href="@{/admin/orders(page=${i}, keyword=${filter.keyword}, statuses=${filter.statuses}, startDate=${filter.startDate}, endDate=${filter.endDate})}" th:text="${i + 1}"></a>
                            </li>
                            <li class="page-item" th:classappend="${orders.last} ? 'disabled'">
                                <a class="page-link" th:href="@{/admin/orders(page=${orders.number + 1}, keyword=${filter.keyword}, statuses=${filter.statuses}, startDate=${filter.startDate}, endDate=${filter.endDate})}">Sau</a>
                            </li>
                        </ul>
                    </nav>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
