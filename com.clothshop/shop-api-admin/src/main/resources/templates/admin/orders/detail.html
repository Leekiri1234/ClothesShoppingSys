<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <title>Chi tiết đơn hàng</title>
    <style>
        .timeline { list-style: none; padding: 20px 0; position: relative; }
        .timeline:before { top: 0; bottom: 0; position: absolute; content: " "; width: 3px; background-color: #eeeeee; left: 20px; }
        .timeline > li { margin-bottom: 20px; position: relative; padding-left: 50px; }
        .timeline > li:before { content: " "; width: 15px; height: 15px; border-radius: 50%; background-color: #4e73df; position: absolute; left: 14px; top: 5px; border: 3px solid #fff; }
        .info-label { font-weight: bold; color: #4e73df; width: 150px; display: inline-block; }
        .price-summary p { display: flex; justify-content: space-between; margin-bottom: 0.5rem; }
    </style>
</head>
<body>
<div layout:fragment="content">
    <div class="container-fluid">
        <div class="d-sm-flex align-items-center justify-content-between mb-4">
            <h1 class="h3 mb-0 text-gray-800">Đơn hàng: <span class="text-primary" th:text="${order.orderInvoice}"></span></h1>
            <a th:href="@{/admin/orders}" class="btn btn-secondary btn-sm shadow-sm">
                <i class="fas fa-arrow-left fa-sm text-white-50"></i> Quay lại danh sách
            </a>
        </div>

        <div class="row">
            <div class="col-lg-8">
                <div class="card shadow mb-4">
                    <div class="card-header py-3">
                        <h6 class="m-0 font-weight-bold text-primary"><i class="fas fa-user"></i> Thông tin khách hàng</h6>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-6">
                                <p><span class="info-label">Khách hàng:</span> <span th:text="${order.customerName}"></span></p>
                                <p><span class="info-label">Email:</span> <span th:text="${order.customerEmail}"></span></p>
                            </div>
                            <div class="col-md-6">
                                <p><span class="info-label">Số điện thoại:</span> <span th:text="${order.customerPhone != null ? order.customerPhone : 'Chưa cập nhật'}"></span></p>
                                <p><span class="info-label">Ngày đặt:</span> <span th:text="${#temporals.format(order.createdAt, 'dd/MM/yyyy HH:mm')}"></span></p>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card shadow mb-4">
                    <div class="card-header py-3">
                        <h6 class="m-0 font-weight-bold text-primary"><i class="fas fa-box"></i> Sản phẩm đã đặt</h6>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover mb-0">
                                <thead class="bg-light">
                                <tr>
                                    <th class="pl-4">Sản phẩm</th>
                                    <th class="text-center">Đơn giá</th>
                                    <th class="text-center">Số lượng</th>
                                    <th class="text-right pr-4">Thành tiền</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="item : ${order.items}">
                                    <td class="pl-4">
                                        <div th:text="${item.productName}" class="font-weight-bold text-dark"></div>
                                        <small class="text-muted" th:text="${item.variantName}"></small>
                                    </td>
                                    <td class="text-center" th:text="${#numbers.formatDecimal(item.unitPrice, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>
                                    <td class="text-center" th:text="${item.quantity}"></td>
                                    <td class="text-right pr-4 font-weight-bold"
                                        th:text="${#numbers.formatDecimal(item.unitPrice * item.quantity, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                    <div class="card-footer bg-white border-top-0">
                        <div class="row justify-content-end">
                            <div class="col-md-5 price-summary">
                                <p>
                                    <span class="font-weight-bold">Tổng tiền hàng:</span>
                                    <span class="text-dark" th:text="${#numbers.formatDecimal(order.totalAmount, 0, 'COMMA', 0, 'POINT')} + ' đ'"></span>
                                </p>
                                <p class="text-danger">
                                    <span>Giảm giá (Voucher):</span>
                                    <span th:text="${order.discount > 0 ? '-' : ''} + ${#numbers.formatDecimal(order.discount, 0, 'COMMA', 0, 'POINT')} + ' đ'"></span>
                                </p>
                                <hr>
                                <p class="h5 font-weight-bold text-primary">
                                    <span>Tổng thanh toán:</span>
                                    <span th:text="${#numbers.formatDecimal(order.totalPrice, 0, 'COMMA', 0, 'POINT')} + ' đ'"></span>
                                </p>
                            </div>
                        </div>
                    </div>

                </div>
            </div>

            <div class="col-lg-4">
                <div class="card shadow mb-4">
                    <div class="card-header py-3">
                        <h6 class="m-0 font-weight-bold text-primary"><i class="fas fa-credit-card"></i> Thanh toán</h6>
                    </div>
                    <div class="card-body">
                        <p><span class="info-label">Phương thức:</span>
                            <span class="badge badge-info" th:text="${order.paymentMethod}"></span></p>
                        <p><span class="info-label">Trạng thái:</span>
                            <span th:class="|badge ${order.status.name() == 'CANCELLED' ? 'badge-danger' : 'badge-success'}|"
                                  th:text="${order.status.displayName}"></span></p>
                    </div>
                </div>

                <div class="card shadow mb-4">
                    <div class="card-header py-3">
                        <h6 class="m-0 font-weight-bold text-primary"><i class="fas fa-edit"></i> Cập nhật trạng thái</h6>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/admin/orders/{id}/status(id=${order.orderId})}" method="post">
                            <div class="form-group">
                                <select name="newStatus" class="form-control">
                                    <option th:each="st : ${allStatuses}"
                                            th:value="${st}"
                                            th:text="${st.displayName}"
                                            th:selected="${st == order.status}"></option>
                                </select>
                            </div>
                            <div class="form-group">
                                <textarea name="note" class="form-control" rows="2" placeholder="Ghi chú nội bộ..."></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary btn-block">Lưu thay đổi</button>
                        </form>
                    </div>
                </div>

                <div class="card shadow mb-4">
                    <div class="card-header py-3">
                        <h6 class="m-0 font-weight-bold text-primary"><i class="fas fa-history"></i> Lịch sử xử lý</h6>
                    </div>
                    <div class="card-body">
                        <ul class="timeline">
                            <li th:each="h : ${order.history}">
                                <div class="font-weight-bold small">
                                    <span th:text="${h.oldStatus != null ? h.oldStatus.displayName : 'Khởi tạo'}" class="text-muted"></span>
                                    <i class="fas fa-chevron-right mx-1 text-xs"></i>
                                    <span th:text="${h.newStatus.displayName}" class="text-primary"></span>
                                </div>
                                <small class="text-muted d-block">
                                    <i class="fas fa-user-edit"></i> <span th:text="${h.changedBy}"></span> |
                                    <i class="fas fa-clock"></i> <span th:text="${#temporals.format(h.changedAt, 'dd/MM/yyyy HH:mm')}"></span>
                                </small>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
