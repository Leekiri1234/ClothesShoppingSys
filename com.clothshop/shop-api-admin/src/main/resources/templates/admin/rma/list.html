<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <title>Quản lý yêu cầu Đổi/Trả (RMA)</title>
</head>
<body>
<div layout:fragment="content">
    <div class="container-fluid">
        <div class="d-sm-flex align-items-center justify-content-between mb-4">
            <h1 class="h3 mb-0 text-gray-800">Danh sách yêu cầu Đổi/Trả (RMA)</h1>
        </div>

        <div class="card shadow mb-4">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-bordered" width="100%" cellspacing="0">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>Mã đơn hàng</th>
                            <th>Khách hàng</th>
                            <th>Loại yêu cầu</th>
                            <th>Trạng thái</th>
                            <th>Ngày gửi</th>
                            <th>Thao tác</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="rma : ${rmaPage.content}">
                            <td th:text="${rma.id}"></td>
                            <td>
                                <a th:href="@{/admin/orders/{id}(id=${rma.orderId})}"
                                   th:text="${rma.orderInvoice}" class="font-weight-bold"></a>
                            </td>
                            <td>
                                <div th:text="${rma.customerName}"></div>
                                <small class="text-muted" th:text="${rma.customerPhone}"></small>
                            </td>
                            <td>
                                <span th:if="${rma.rmaType.name() == 'RETURN'}" class="badge bg-warning text-dark">Trả hàng</span>
                                <span th:if="${rma.rmaType.name() == 'EXCHANGE'}" class="badge bg-info text-dark">Đổi hàng</span>
                            </td>
                            <td>
                                <span th:if="${rma.status.name() == 'PENDING'}" class="badge bg-secondary" th:text="${rma.status.displayName}"></span>
                                <span th:if="${rma.status.name() == 'APPROVED'}" class="badge bg-primary" th:text="${rma.status.displayName}"></span>
                                <span th:if="${rma.status.name() == 'RECEIVED'}" class="badge bg-info text-dark" th:text="${rma.status.displayName}"></span>
                                <span th:if="${rma.status.name() == 'REJECTED'}" class="badge bg-danger" th:text="${rma.status.displayName}"></span>
                                <span th:if="${rma.status.name() == 'COMPLETED'}" class="badge bg-success" th:text="${rma.status.displayName}"></span>
                            </td>
                            <td th:text="${#temporals.format(rma.createdAt, 'dd/MM/yyyy HH:mm')}"></td>
                            <td>
                                <a th:href="@{/admin/rma/{id}(id=${rma.id})}" class="btn btn-sm btn-primary">
                                    <i class="fas fa-eye"></i> Chi tiết
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${rmaPage.content.empty}">
                            <td colspan="7" class="text-center">Chưa có yêu cầu RMA nào.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <nav th:if="${rmaPage.totalPages > 1}" aria-label="Page navigation">
                    <ul class="pagination justify-content-center">
                        <li class="page-item" th:classappend="${rmaPage.pageNumber == 0} ? 'disabled'">
                            <a class="page-link" th:href="@{/admin/rma(pageNumber=${rmaPage.pageNumber - 1})}">Trước</a>
                        </li>
                        <li class="page-item" th:each="i : ${#numbers.sequence(0, rmaPage.totalPages - 1)}"
                            th:classappend="${i == rmaPage.pageNumber} ? 'active'">
                            <a class="page-link" th:href="@{/admin/rma(pageNumber=${i})}" th:text="${i + 1}"></a>
                        </li>
                        <li class="page-item" th:classappend="${rmaPage.pageNumber == rmaPage.totalPages - 1} ? 'disabled'">
                            <a class="page-link" th:href="@{/admin/rma(pageNumber=${rmaPage.pageNumber + 1})}">Sau</a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>
</div>
</body>
</html>
