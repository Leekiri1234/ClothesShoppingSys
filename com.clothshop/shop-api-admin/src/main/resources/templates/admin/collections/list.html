<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <title>Quản lý Bộ sưu tập</title>
</head>
<body>

<h1 layout:fragment="page-title">Bộ sưu tập</h1>

<div layout:fragment="page-actions">
    <a th:href="@{/admin/collections/form}" class="btn btn-primary">
        <svg style="width: 14px; height: 14px;" viewBox="0 0 24 24">
            <line x1="12" y1="5" x2="12" y2="19"/>
            <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        Thêm bộ sưu tập
    </a>
</div>

<div layout:fragment="content">

    <!-- FILTER BAR -->
    <div class="filter-bar">
        <form th:action="@{/admin/collections}" method="get" style="display: flex; gap: 8px; flex: 1; max-width: 500px;" th:object="${filter}">
            <input type="text" th:field="*{keyword}" class="filter-input" style="flex: 1;"
                   placeholder="Tìm kiếm theo tên...">
            <select th:field="*{status}" class="filter-input" style="width: 150px;">
                <option value="">Tất cả trạng thái</option>
                <option value="true">Hoạt động</option>
                <option value="false">Tắt</option>
            </select>
            <button type="submit" class="btn btn-outline">
                <svg style="width: 14px; height: 14px;" viewBox="0 0 24 24">
                    <circle cx="11" cy="11" r="8"/>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
            </button>
            <a th:href="@{/admin/collections}" class="btn btn-outline"
               th:if="${(filter.keyword != null and !filter.keyword.isEmpty()) or filter.status != null}">
                <svg style="width: 14px; height: 14px;" viewBox="0 0 24 24">
                    <line x1="18" y1="6" x2="6" y2="18"/>
                    <line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
            </a>
        </form>
    </div>

    <!-- TABLE -->
    <div class="dashboard-card">
        <table class="admin-table">
            <thead>
                <tr>
                    <th style="width: 60px;">ID</th>
                    <th>Tên bộ sưu tập</th>
                    <th>Mô tả</th>
                    <th style="width: 100px; text-align: center;">Số SP</th>
                    <th style="width: 100px;">Trạng thái</th>
                    <th style="width: 140px;">Hành động</th>
                </tr>
            </thead>
            <tbody>
                <!-- Empty state -->
                <tr th:if="${collections.content.isEmpty()}">
                    <td colspan="6" class="empty-state">
                        <svg style="width: 48px; height: 48px; margin-bottom: 12px; color: var(--muted);" viewBox="0 0 24 24">
                            <rect x="3" y="3" width="7" height="7" rx="1"/>
                            <rect x="14" y="3" width="7" height="7" rx="1"/>
                            <rect x="14" y="14" width="7" height="7" rx="1"/>
                            <rect x="3" y="14" width="7" height="7" rx="1"/>
                        </svg>
                        <p>Chưa có bộ sưu tập nào</p>
                        <p th:if="${(filter.keyword != null and !filter.keyword.isEmpty()) or filter.status != null}" style="font-size: 12px; color: var(--muted);">
                            Không tìm thấy kết quả phù hợp với bộ lọc
                        </p>
                    </td>
                </tr>

                <!-- Data rows -->
                <tr th:each="collection : ${collections.content}">
                    <td th:text="${collection.id}" style="font-weight: 600; color: var(--muted);">1</td>
                    <td>
                        <span style="font-weight: 600;" th:text="${collection.name}">Bộ sưu tập mùa hè</span>
                    </td>
                    <td>
                        <span style="font-size: 13px; color: var(--muted);"
                              th:text="${collection.description != null and !collection.description.isEmpty()
                                  ? (collection.description.length() > 80 ? collection.description.substring(0, 80) + '...' : collection.description)
                                  : 'Không có mô tả'}">Mô tả ngắn gọn</span>
                    </td>
                    <td style="text-align: center;">
                        <span class="badge badge-primary" th:text="${collection.itemCount} + ' SP'">0 SP</span>
                    </td>
                    <td>
                        <span th:if="${collection.isActive}" class="badge badge-success">Hoạt động</span>
                        <span th:unless="${collection.isActive}" class="badge badge-muted">Tắt</span>
                    </td>
                    <td>
                        <div style="display: flex; gap: 6px;">
                            <a th:href="@{/admin/collections/{id}/assign(id=${collection.id})}"
                               class="btn btn-xs btn-outline" title="Gán SP">
                                <svg style="width: 12px; height: 12px;" viewBox="0 0 24 24">
                                    <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
                                    <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
                                </svg>
                            </a>
                            <a th:href="@{/admin/collections/form(id=${collection.id})}"
                               class="btn btn-xs btn-outline" title="Sửa">
                                <svg style="width: 12px; height: 12px;" viewBox="0 0 24 24">
                                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                                    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                                </svg>
                            </a>
                            <form th:action="@{/admin/collections/{id}/toggle-status(id=${collection.id})}"
                                  method="post" style="display: inline;"
                                  th:onsubmit="'return confirm(\'' + (${collection.isActive} ? 'Tắt bộ sưu tập này? Sản phẩm bên trong sẽ bị ẩn.' : 'Kích hoạt bộ sưu tập này?') + '\');'">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <button type="submit" class="btn btn-xs"
                                        th:classappend="${collection.isActive} ? 'btn-danger' : 'btn-success'"
                                        th:title="${collection.isActive ? 'Tắt' : 'Kích hoạt'}">

                                    <!-- Icon cho Tắt (khi đang Active) -->
                                    <svg th:if="${collection.isActive}" style="width: 12px; height: 12px;" viewBox="0 0 24 24">
                                        <polyline points="3 6 5 6 21 6"/>
                                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                                    </svg>

                                    <!-- Icon cho Bật (khi đang Inactive) -->
                                    <svg th:unless="${collection.isActive}" style="width: 12px; height: 12px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <polyline points="20 6 9 17 4 12"></polyline>
                                    </svg>
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>

        <!-- PAGINATION -->
        <div th:if="${collections.totalPages > 1}" class="pagination">
            <button class="page-btn"
                    th:disabled="${collections.first}"
                    th:onclick="'window.location.href=\'' + @{/admin/collections(page=${collections.number - 1}, size=${collections.size}, keyword=${filter.keyword}, status=${filter.status})} + '\''">
                ‹
            </button>
            <th:block th:each="pageNum : ${#numbers.sequence(0, collections.totalPages - 1)}">
                <button class="page-btn"
                        th:classappend="${pageNum == collections.number} ? 'active'"
                        th:text="${pageNum + 1}"
                        th:onclick="'window.location.href=\'' + @{/admin/collections(page=${pageNum}, size=${collections.size}, keyword=${filter.keyword}, status=${filter.status})} + '\''">
                    1
                </button>
            </th:block>
            <button class="page-btn"
                    th:disabled="${collections.last}"
                    th:onclick="'window.location.href=\'' + @{/admin/collections(page=${collections.number + 1}, size=${collections.size}, keyword=${filter.keyword}, status=${filter.status})} + '\''">
                ›
            </button>
        </div>

        <!-- Count -->
        <div style="text-align: center; color: var(--muted); font-size: 12px; margin-top: 12px;">
            Hiển thị <strong th:text="${collections.content.size()}">0</strong> trong tổng số
            <strong th:text="${collections.totalElements}">0</strong> bộ sưu tập
        </div>
    </div>
</div>

</body>
</html>
