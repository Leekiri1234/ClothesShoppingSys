<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <title th:text="${pageTitle}">Form Bộ Sưu Tập</title>
    <style>
        .image-preview-container {
            width: 100%;
            height: 200px;
            border: 2px dashed #ddd;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background-color: #f8f9fa;
            margin-bottom: 10px;
            cursor: pointer;
        }
        .image-preview-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .image-preview-container:hover {
            border-color: var(--primary);
        }
    </style>
</head>
<body>

<h1 layout:fragment="page-title" th:text="${pageTitle}">Form Bộ Sưu Tập</h1>

<div layout:fragment="page-actions">
    <a th:href="@{/admin/collections}" class="btn btn-outline">
        <svg style="width: 14px; height: 14px;" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        Quay lại
    </a>
</div>

<div layout:fragment="content">
    <form th:action="@{/admin/collections/save}"
          th:object="${collectionDTO}"
          method="post"
          enctype="multipart/form-data">

        <input type="hidden" th:field="*{id}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="row">
            <div class="col-lg-8">
                <div class="form-card shadow-sm">
                    <h3>
                        <svg style="width: 16px; height: 16px; margin-right: 6px;" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
                        Thông tin chi tiết
                    </h3>

                    <div class="form-group">
                        <label for="name">Tên Bộ Sưu Tập <span class="text-danger">*</span></label>
                        <input type="text" id="name" th:field="*{name}" placeholder="VD: Summer Collection 2024" required maxlength="100">
                        <span class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
                    </div>

                    <div class="form-group">
                        <label for="description">Mô tả</label>
                        <textarea id="description" th:field="*{description}" rows="6" maxlength="500" placeholder="Nhập mô tả bộ sưu tập..."></textarea>
                    </div>

                    <div class="form-actions mt-4">
                        <button type="submit" class="btn btn-primary" th:text="${collectionDTO.id == null ? 'Tạo mới' : 'Cập nhật'}">Lưu</button>
                        <button type="reset" class="btn btn-outline">Đặt lại</button>
                    </div>
                </div>
            </div>

            <div class="col-lg-4">
                <div class="card shadow mb-4">
                    <div class="card-header py-3">
                        <h6 class="m-0 font-weight-bold text-primary">Ảnh hiển thị</h6>
                    </div>
                    <div class="card-body p-3 text-center">
                        <div class="image-preview-container mb-3"
                             style="border: 2px dashed #333; padding: 10px; border-radius: 8px; cursor: pointer; background: #fdfdfd;"
                             onclick="document.getElementById('imageFile').click()">

                            <img id="preview"
                                 th:src="${collectionDTO.imageUrl != null ? collectionDTO.imageUrl : '/images/no-image.png'}"
                                 alt="Preview"
                                 class="img-fluid rounded"
                                 style="width: 100%; max-height: 200px; object-fit: cover; display: block;">
                        </div>

                        <div class="mb-2">
                            <button type="button" id="btnRemoveImage"
                                    th:style="${collectionDTO.imageUrl != null ? 'display:inline-block' : 'display:none'}"
                                    class="btn btn-danger btn-sm shadow-sm"
                                    onclick="removeImage()">
                                <i class="fas fa-trash-alt mr-1"></i> Xóa ảnh
                            </button>

                            <input type="file" id="imageFile" name="imageFile" style="display: none;" accept="image/*">
                            <input type="hidden" id="deleteImage" name="deleteImage" value="false">
                        </div>

                        <p class="text-muted small mb-0">Nhấn vào khung trên để thay đổi ảnh</p>
                    </div>
                </div>

                <div class="dashboard-card shadow-sm mb-4">
                    <div class="card-header">
                        <h3>Cấu hình hiển thị</h3>
                    </div>
                    <div class="card-body p-3">
                        <div class="form-group mb-0">
                            <label for="isActive">Trạng thái hoạt động</label>
                            <select id="isActive" th:field="*{isActive}" class="form-control">
                                <option th:value="true">Đang hoạt động</option>
                                <option th:value="false">Tạm tắt</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div th:if="${collectionDTO.id != null}" class="dashboard-card shadow-sm border-left-primary">
                    <div class="card-header">
                        <h3>Hành động liên quan</h3>
                    </div>
                    <div class="card-body p-3">
                        <a th:href="@{/admin/collections/{id}/assign(id=${collectionDTO.id})}" class="btn btn-sm btn-outline btn-block mb-2">
                            <i class="fas fa-link mr-1"></i> Gán sản phẩm
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>

<div layout:fragment="scripts">
    <script>
        function removeImage() {
            if (confirm('Bạn có chắc chắn muốn gỡ bỏ ảnh này?')) {
                const preview = document.getElementById('preview');
                const deleteFlag = document.getElementById('deleteImage');
                const btnRemove = document.getElementById('btnRemoveImage');
                const fileInput = document.getElementById('imageFile');

                // Reset về ảnh mặc định
                preview.src = '/images/no-image.png';
                // Báo cho Backend biết là cần xóa ảnh trong DB
                deleteFlag.value = "true";
                // Ẩn nút xóa đi
                btnRemove.style.display = 'none';
                // Xóa giá trị trong input file (nếu đang chọn file mà đổi ý xóa)
                fileInput.value = '';
            }
        }

        // Lắng nghe sự kiện thay đổi file để hiện lại nút Xóa
        document.getElementById('imageFile').addEventListener('change', function() {
            const file = this.files[0];
            const preview = document.getElementById('preview');
            const btnRemove = document.getElementById('btnRemoveImage');
            const deleteFlag = document.getElementById('deleteImage');

            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    // Khi chọn file, nó dùng đường dẫn ảo Base64 đè lên ảnh no-image
                    preview.src = e.target.result;
                    btnRemove.style.display = 'inline-block';
                    deleteFlag.value = "false";
                }
                reader.readAsDataURL(file);
            }
        });

        // Character counter (Dữ nguyên logic cũ của bạn)
        const descriptionTextarea = document.getElementById('description');
        if (descriptionTextarea) {
            const maxLength = descriptionTextarea.getAttribute('maxlength');
            const counterDiv = document.createElement('div');
            counterDiv.style.cssText = 'text-align: right; color: var(--muted); font-size: 11px; margin-top: 4px;';
            descriptionTextarea.parentNode.appendChild(counterDiv);
            function updateCounter() {
                counterDiv.textContent = descriptionTextarea.value.length + '/' + maxLength + ' ký tự';
            }
            descriptionTextarea.addEventListener('input', updateCounter);
            updateCounter();
        }
    </script>
</div>
</body>
</html>
