<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập Admin - MINIMAL</title>
    <link rel="stylesheet" th:href="@{/css/legacy-admin.css}">
    <style>
        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            background: radial-gradient(circle at 15% 20%, #f3eee5 0%, #f3eee5 20%, transparent 21%),
                        radial-gradient(circle at 82% 75%, #ebe5db 0%, #ebe5db 22%, transparent 23%),
                        #fafaf8;
            padding: 24px;
        }

        .auth-card {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            border: 1px solid #e8e6e1;
            box-shadow: 0 24px 50px rgba(28, 28, 26, 0.08);
            padding: 32px 28px;
        }

        .auth-brand {
            text-align: center;
            margin-bottom: 20px;
        }

        .auth-brand h1 {
            margin: 0;
            font-size: 13px;
            letter-spacing: 0.25em;
        }

        .auth-brand p {
            margin: 8px 0 0;
            font-size: 12px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #6b6b67;
        }

        .auth-alert {
            margin-bottom: 14px;
            border: 1px solid;
            font-size: 13px;
            padding: 10px 12px;
        }

        .auth-alert.error {
            border-color: #e9c3bc;
            background: #fff6f5;
            color: #9f2d21;
        }

        .auth-alert.success {
            border-color: #cbe6d0;
            background: #f5fff7;
            color: #2f7a39;
        }

        .form-group { margin-bottom: 14px; }

        .form-group label {
            display: block;
            font-size: 12px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 6px;
            color: #6b6b67;
        }

        .form-group input[type="text"],
        .form-group input[type="password"] {
            width: 100%;
            border: 1px solid #e8e6e1;
            background: #fafaf8;
            padding: 10px 12px;
            font-size: 14px;
            color: #1c1c1a;
        }

        .form-group input:focus {
            outline: none;
            border-color: #c5a882;
            background: #fff;
        }

        .remember {
            margin: 10px 0 18px;
            display: flex;
            gap: 8px;
            align-items: center;
            font-size: 13px;
            color: #6b6b67;
        }

        .remember input { accent-color: #1c1c1a; }

        .auth-submit {
            width: 100%;
            border: 1px solid #1c1c1a;
            background: #1c1c1a;
            color: #fff;
            padding: 12px 14px;
            font-size: 12px;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all .25s ease;
        }

        .auth-submit:hover {
            background: #c5a882;
            border-color: #c5a882;
        }

        .links {
            margin-top: 14px;
            text-align: center;
            font-size: 13px;
        }

        .links a {
            color: #1c1c1a;
            text-decoration: none;
            border-bottom: 1px solid #d2d0ca;
        }
    </style>
</head>
<body>
<div class="auth-card">
    <div class="auth-brand">
        <h1>MINIMAL ADMIN</h1>
        <p>Sign In</p>
    </div>

    <div th:if="${param.error}" class="auth-alert error">Tên đăng nhập hoặc mật khẩu không đúng.</div>
    <div th:if="${param.logout}" class="auth-alert success">Bạn đã đăng xuất thành công.</div>
    <div th:if="${message}" class="auth-alert success" th:text="${message}"></div>

    <form th:action="@{/admin/login}" method="post">
        <div class="form-group">
            <label for="username">Tên đăng nhập</label>
            <input id="username" name="username" type="text" autocomplete="username" required autofocus>
        </div>

        <div class="form-group">
            <label for="password">Mật khẩu</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>

        <div class="remember">
            <input id="remember-me" type="checkbox" name="remember-me">
            <label for="remember-me">Ghi nhớ đăng nhập</label>
        </div>

        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button class="auth-submit" type="submit">Đăng nhập</button>
    </form>

    <div class="links">
        <a th:href="@{/admin/forgot-password}">Quên mật khẩu</a>
    </div>
</div>
</body>
</html>
