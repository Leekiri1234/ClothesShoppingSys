<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - ClothShop Admin</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        body {
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: var(--primary);
            font-family: var(--font);
        }

        .login-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }

        .login-brand {
            text-align: center;
            color: var(--bg);
        }

        .login-brand-name {
            font-family: var(--font-display);
            font-size: 36px;
            font-weight: 600;
            letter-spacing: 0.12em;
            color: #FAFAF8;
            margin-bottom: 6px;
        }

        .login-brand-sub {
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--accent);
        }

        .login-card {
            background: var(--bg);
            width: 100%;
            padding: 44px 36px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .login-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 28px;
            text-align: center;
            letter-spacing: 0.04em;
        }

        .login-alert {
            padding: 12px 16px;
            font-size: 13px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .login-alert-danger {
            background: #fdecea;
            color: #c62828;
            border: 1px solid #f5c6cb;
        }

        .login-alert-success {
            background: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #c3e6cb;
        }

        .login-form .form-group {
            margin-bottom: 22px;
        }

        .login-form label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 8px;
        }

        .login-form input[type="text"],
        .login-form input[type="password"] {
            width: 100%;
            padding: 13px 14px;
            font-size: 14px;
            font-family: var(--font);
            border: 1px solid var(--border);
            background: var(--white);
            outline: none;
            transition: border-color 0.3s;
            color: var(--primary);
        }

        .login-form input:focus {
            border-color: var(--accent);
        }

        .login-form input::placeholder {
            color: #B5B3AE;
        }

        .remember-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 28px;
        }

        .remember-check {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--muted);
            cursor: pointer;
        }

        .remember-check input[type="checkbox"] {
            width: 15px;
            height: 15px;
            accent-color: var(--primary);
            cursor: pointer;
        }

        .forgot-link {
            font-size: 12px;
            color: var(--muted);
            text-decoration: none;
            transition: color 0.2s;
        }

        .forgot-link:hover {
            color: var(--accent);
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            font-size: 13px;
            font-weight: 600;
            font-family: var(--font);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--bg);
            background: var(--primary);
            border: 1px solid var(--primary);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-login:hover {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--primary);
        }

        .login-divider {
            width: 40px;
            height: 1px;
            background: var(--accent);
            margin: 0 auto;
            opacity: 0.6;
        }

        .login-footer {
            text-align: center;
            color: #6B6B67;
            font-size: 11px;
            letter-spacing: 0.05em;
        }

        .login-footer a {
            color: var(--accent);
            text-decoration: none;
        }

        @media (max-width: 480px) {
            .login-wrapper { padding: 16px; }
            .login-card { padding: 32px 24px; }
            .login-brand-name { font-size: 28px; }
        }
    </style>
</head>
<body>

<div class="login-wrapper">
    <!-- BRAND -->
    <div class="login-brand">
        <div class="login-brand-name">CLOTHSHOP</div>
        <div class="login-brand-sub">Admin Panel</div>
    </div>

    <!-- LOGIN CARD -->
    <div class="login-card">
        <div class="login-title">Đăng nhập hệ thống</div>

        <!-- Error Alert -->
        <div th:if="${param.error}" class="login-alert login-alert-danger">
            <svg style="width: 16px; height: 16px; flex-shrink: 0;" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="10"/>
                <line x1="12" y1="8" x2="12" y2="12"/>
                <line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
            Tên đăng nhập hoặc mật khẩu không đúng!
        </div>

        <!-- Logout Alert -->
        <div th:if="${param.logout}" class="login-alert login-alert-success">
            <svg style="width: 16px; height: 16px; flex-shrink: 0;" viewBox="0 0 24 24">
                <polyline points="20 6 9 17 4 12"/>
            </svg>
            Bạn đã đăng xuất thành công!
        </div>

        <!-- Login Form -->
        <form th:action="@{/admin/login}" method="post" class="login-form">
            <div class="form-group">
                <label for="username">Tên đăng nhập</label>
                <input type="text"
                       id="username"
                       name="username"
                       placeholder="Nhập tên đăng nhập"
                       required
                       autofocus>
            </div>

            <div class="form-group">
                <label for="password">Mật khẩu</label>
                <input type="password"
                       id="password"
                       name="password"
                       placeholder="Nhập mật khẩu"
                       required>
            </div>

            <div class="remember-row">
                <label class="remember-check">
                    <input type="checkbox" id="remember-me" name="remember-me">
                    Ghi nhớ đăng nhập
                </label>
                <a href="#" class="forgot-link"
                   onclick="alert('Vui lòng liên hệ quản trị viên để khôi phục mật khẩu'); return false;">
                    Quên mật khẩu?
                </a>
            </div>

            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <button type="submit" class="btn-login">Đăng nhập</button>
        </form>
    </div>

    <!-- FOOTER -->
    <div class="login-divider"></div>
    <div class="login-footer">
        © 2024 ClothShop. Powered by <a href="#">ClothShop Admin</a>
    </div>
</div>

</body>
</html>
