<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - ClothShop Admin</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        body {
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }

        .login-container {
            background: var(--white);
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            width: 100%;
            max-width: 420px;
            padding: 40px;
        }

        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-logo {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 0.1em;
            color: var(--primary);
            margin-bottom: 8px;
        }

        .login-subtitle {
            font-size: 13px;
            color: var(--muted);
        }

        .alert {
            padding: 12px 16px;
            border-radius: var(--radius);
            font-size: 13px;
            margin-bottom: 20px;
        }

        .alert-danger {
            background: #fdecea;
            color: #c62828;
            border: 1px solid #f5c6cb;
        }

        .alert-success {
            background: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #c3e6cb;
        }

        .login-form .form-group {
            margin-bottom: 20px;
        }

        .login-form label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 6px;
        }

        .login-form input {
            width: 100%;
            padding: 12px 14px;
            font-size: 14px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            outline: none;
            transition: border-color 0.2s;
        }

        .login-form input:focus {
            border-color: #667eea;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            margin-bottom: 24px;
        }

        .remember-me input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #667eea;
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            font-size: 14px;
            font-weight: 600;
            color: white;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: var(--radius);
            cursor: pointer;
            transition: transform 0.2s;
        }

        .btn-login:hover {
            transform: translateY(-2px);
        }

        .login-footer {
            text-align: center;
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid var(--border);
        }

        .login-footer a {
            font-size: 13px;
            color: #667eea;
            text-decoration: none;
        }

        .login-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="login-container">
    <div class="login-header">
        <div class="login-logo">CLOTHSHOP</div>
        <div class="login-subtitle">Quản trị viên</div>
    </div>

    <div th:if="${param.error}" class="alert alert-danger">
        <svg style="width: 16px; height: 16px; display: inline-block; vertical-align: middle; margin-right: 6px;" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="8" x2="12" y2="12"/>
            <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        Tên đăng nhập hoặc mật khẩu không đúng!
    </div>

    <div th:if="${param.logout}" class="alert alert-success">
        <svg style="width: 16px; height: 16px; display: inline-block; vertical-align: middle; margin-right: 6px;" viewBox="0 0 24 24">
            <polyline points="20 6 9 17 4 12"/>
        </svg>
        Bạn đã đăng xuất thành công!
    </div>

    <form th:action="@{/admin/login}" method="post" class="login-form">
        <div class="form-group">
            <label for="username">Tên đăng nhập</label>
            <input type="text"
                   id="username"
                   name="username"
                   placeholder="Nhập tên đăng nhập"
                   required
                   autofocus>
        </div>

        <div class="form-group">
            <label for="password">Mật khẩu</label>
            <input type="password"
                   id="password"
                   name="password"
                   placeholder="Nhập mật khẩu"
                   required>
        </div>

        <div class="remember-me">
            <input type="checkbox" id="remember-me" name="remember-me">
            <label for="remember-me" style="margin: 0; font-weight: 400; cursor: pointer;">Ghi nhớ đăng nhập</label>
        </div>

        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <button type="submit" class="btn-login">Đăng nhập</button>
    </form>

    <div class="login-footer">
        <a href="#" onclick="alert('Vui lòng liên hệ quản trị viên để khôi phục mật khẩu'); return false;">
            Quên mật khẩu?
        </a>
    </div>
</div>

</body>
</html>
