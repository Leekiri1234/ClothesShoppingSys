<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Loi he thong</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2c2c2c;
            --muted: #888;
            --bg: #fdfdfd;
        }
        body {
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: var(--bg);
            font-family: 'Inter', sans-serif;
            color: var(--primary);
            text-align: center;
        }
        .error-container {
            max-width: 560px;
            padding: 20px;
        }
        h1 {
            font-size: 120px;
            margin: 0;
            font-weight: 300;
            letter-spacing: -5px;
            line-height: 1;
        }
        h2 {
            font-size: 24px;
            font-weight: 500;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        p {
            color: var(--muted);
            margin-bottom: 10px;
            line-height: 1.6;
        }
        .error-detail {
            margin-bottom: 30px;
            font-size: 13px;
            color: #a33;
            word-break: break-word;
        }
        .btn-home {
            display: inline-block;
            padding: 12px 30px;
            background-color: var(--primary);
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 1px;
            transition: opacity 0.3s;
        }
        .btn-home:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>
<div class="error-container">
    <h1>500</h1>
    <h2>Co loi xay ra</h2>
    <p>He thong dang gap su co tam thoi. Vui long thu lai sau.</p>
    <p class="error-detail" th:if="${error}" th:text="${error}"></p>
    <a href="/admin" class="btn-home">QUAY LAI BANG DIEU KHIEN</a>
</div>
</body>
</html>
