<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!-- ============================================================
     ALERTS FRAGMENT
     Usage: th:replace="~{fragments/alerts :: alerts}"
     Displays success/error/warning flash messages from RedirectAttributes
     Supports: success, successMessage, error, errorMessage, warningMessage
     ============================================================ -->
<div th:fragment="alerts">
    <!-- Success alerts -->
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert" style="margin-bottom: 16px;">
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert" style="margin-bottom: 16px;">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- Error alerts -->
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert" style="margin-bottom: 16px;">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert" style="margin-bottom: 16px;">
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- Warning alerts -->
    <div th:if="${warningMessage}" class="alert alert-warning alert-dismissible fade show" role="alert" style="margin-bottom: 16px;">
        <span th:text="${warningMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
</div>

</html>
