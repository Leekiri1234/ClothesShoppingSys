<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<!-- ============================================================
     SIDEBAR FRAGMENT
     Usage: th:replace="~{fragments/sidebar :: sidebar}"
     ============================================================ -->
<aside th:fragment="sidebar" class="admin-sidebar" id="adminSidebar">
    <div class="sidebar-logo">
        <span class="logo-text">MINIMAL ADMIN</span>
    </div>

    <nav class="sidebar-nav" style="display: flex; flex-direction: column; flex: 1; overflow: hidden;">
        <!-- Nav links scroll area -->
        <div style="flex: 1; overflow-y: auto; padding-bottom: 8px;">
        <!-- TỔNG QUAN -->
        <div class="nav-group">
            <span class="nav-group-label">TỔNG QUAN</span>
            <a class="nav-link" th:href="@{/admin/dashboard}"
               th:classappend="${currentPath != null and #strings.contains(currentPath, '/dashboard')} ? 'active' : ''">
                <svg class="nav-icon" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
                <span>Dashboard</span>
            </a>
        </div>

        <!-- QUẢN LÝ ĐƠN -->
        <div class="nav-group" sec:authorize="hasAnyRole('SUPER_ADMIN', 'SALE_PRODUCT_STAFF')">
            <span class="nav-group-label">QUẢN LÝ ĐƠN</span>
            <a class="nav-link" th:href="@{/admin/orders}"
               th:classappend="${currentPath != null and #strings.contains(currentPath, '/orders')} ? 'active' : ''">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                    <line x1="16" y1="13" x2="8" y2="13"></line>
                    <line x1="16" y1="17" x2="8" y2="17"></line>
                    <polyline points="10 9 9 9 8 9"></polyline>
                </svg>
                <span>Đơn hàng</span>
            </a>
            <a class="nav-link" th:href="@{/admin/rma}"
               sec:authorize="hasAnyRole('SUPER_ADMIN', 'CUSTOMER_SERVICE')"
               th:classappend="${currentPath != null and #strings.contains(currentPath, '/rma')} ? 'active' : ''">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 8v13H3V8"></path>
                    <path d="M1 3h22v5H1z"></path>
                    <path d="M10 12h4"></path>
                    <path d="M12 10v4"></path>
                </svg>
                <span>Yêu cầu đổi trả (RMA)</span>
            </a>
        </div>

        <!-- BÁN HÀNG -->
        <div class="nav-group">
            <span class="nav-group-label">BÁN HÀNG</span>
            <a class="nav-link" th:href="@{/admin/products}"
               th:classappend="${currentPath != null and #strings.contains(currentPath, '/products')} ? 'active' : ''">
                <svg class="nav-icon" viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
                <span>Sản phẩm</span>
            </a>
            <a class="nav-link" th:href="@{/admin/reviews}"
               sec:authorize="hasAnyRole('SUPER_ADMIN', 'CUSTOMER_SERVICE', 'SALE_PRODUCT_STAFF')"
               th:classappend="${currentPath != null and #strings.contains(currentPath, '/reviews')} ? 'active' : ''">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                    <path d="M8 9h8"></path>
                    <path d="M8 13h5"></path>
                </svg>
                <span>Đánh giá</span>
            </a>            <a class="nav-link" th:href="@{/admin/categories}"
               th:classappend="${currentPath != null and #strings.contains(currentPath, '/categories')} ? 'active' : ''">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                </svg>
                <span>Danh mục</span>
            </a>
        </div>

        <!-- MARKETING -->
        <div class="nav-group">
            <span class="nav-group-label">MARKETING</span>
            <a class="nav-link" th:href="@{/admin/collections}"
               th:classappend="${currentPath != null and #strings.contains(currentPath, '/collections')} ? 'active' : ''">
                <svg class="nav-icon" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
                <span>Bộ sưu tập</span>
            </a>
            <a class="nav-link" th:href="@{/admin/vouchers}"
               th:classappend="${currentPath != null and #strings.contains(currentPath, '/vouchers')} ? 'active' : ''">
                <svg class="nav-icon" viewBox="0 0 24 24"><path d="M3 7h18v4H3z"/><path d="M3 13h18v4H3z"/><circle cx="8" cy="9" r="1"/><circle cx="8" cy="15" r="1"/></svg>
                <span>Voucher</span>
            </a>
            <a class="nav-link" th:href="@{/admin/settings/featured}"
               th:classappend="${currentPath != null and #strings.contains(currentPath, '/settings/featured')} ? 'active' : ''">
                <svg class="nav-icon" viewBox="0 0 24 24"><path d="M12 2l2.39 4.84L20 8l-4 3.9.94 5.48L12 15.77 7.06 17.4 8 11.9 4 8l5.61-1.16L12 2z"/></svg>
                <span>Sản phẩm nổi bật</span>
            </a>
            <a class="nav-link" th:href="@{/admin/banners}"
               th:classappend="${currentPath != null and #strings.contains(currentPath, '/banners')} ? 'active' : ''">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                    <circle cx="8.5" cy="8.5" r="1.5"></circle>
                    <polyline points="21 15 16 10 5 21"></polyline>
                </svg>
                <span>Banner</span>
            </a>
            <a class="nav-link" th:href="@{/admin/notifications/send-manual}"
               th:classappend="${currentPath != null and #strings.contains(currentPath, '/notifications')} ? 'active' : ''">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                    <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                </svg>
                <span>Gửi thông báo</span>
            </a>
        </div>

        <!-- Há»† THá»NG (Super Admin only) -->
        <div class="nav-group" sec:authorize="hasRole('SUPER_ADMIN')">
            <span class="nav-group-label">Há»† THá»NG</span>
            <a class="nav-link" th:href="@{/admin/staff}"
               th:classappend="${currentPath != null and #strings.contains(currentPath, '/staff')} ? 'active' : ''">
                <svg class="nav-icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                <span>Quản lý nhân sự</span>
            </a>
            <a class="nav-link" th:href="@{/admin/customers}"
               th:classappend="${currentPath != null and #strings.contains(currentPath, '/customers')} ? 'active' : ''">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                    <circle cx="9" cy="7" r="4"></circle>
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                    <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                </svg>
                <span>Quản lý khách hàng</span>
            </a>
        </div>
        </div><!-- end scroll area -->

        <!-- USER PROFILE & LOGOUT (pinned to bottom) -->
        <div style="border-top: 1px solid var(--border); padding: 14px 18px; flex-shrink: 0;">
            <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 10px;">
                <div class="admin-avatar" style="width: 32px; height: 32px; font-size: 13px; flex-shrink: 0;"
                     th:text="${#authentication.name.substring(0,1).toUpperCase()}">U</div>
                <div style="flex: 1; min-width: 0;">
                    <div style="font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" sec:authentication="name">Admin</div>
                    <div style="font-size: 10px; color: var(--muted);">
                        <span sec:authorize="hasRole('SUPER_ADMIN')">Super Admin</span>
                        <span sec:authorize="!hasRole('SUPER_ADMIN')">Admin</span>
                    </div>
                </div>
            </div>
            <form th:action="@{/admin/logout}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn btn-outline" style="width: 100%; font-size: 12px; padding: 6px;">
                    <svg style="width: 14px; height: 14px;" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                    <span>Đăng xuất</span>
                </button>
            </form>
        </div>
    </nav>
</aside>

</html>
