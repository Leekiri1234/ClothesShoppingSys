<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta th:if="${_csrf != null}" name="_csrf" th:content="${_csrf.token}"/>
    <meta th:if="${_csrf != null}" name="_csrf_header" th:content="${_csrf.headerName}"/>
    <meta th:if="${_csrf != null}" name="_csrf_parameter" th:content="${_csrf.parameterName}"/>

    <title layout:title-pattern="$CONTENT_TITLE - MINIMAL ADMIN">MINIMAL ADMIN</title>

    <link rel="stylesheet" th:href="@{/css/legacy-admin.css}">
    <style>
        .admin-shell {
            min-height: 100vh;
            background: radial-gradient(circle at 85% 15%, #f2ece1 0, #f2ece1 18%, transparent 19%),
                        radial-gradient(circle at 15% 80%, #ece5d8 0, #ece5d8 20%, transparent 21%),
                        #fafaf8;
            display: grid;
            grid-template-columns: 260px 1fr;
        }

        .admin-sidebar {
            border-right: 1px solid #e8e6e1;
            background: #fff;
            padding: 24px 18px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .admin-brand {
            font-size: 12px;
            letter-spacing: .22em;
            text-transform: uppercase;
            color: #1c1c1a;
            text-decoration: none;
        }

        .admin-links {
            display: grid;
            gap: 8px;
        }

        .admin-links a {
            text-decoration: none;
            color: #1c1c1a;
            border: 1px solid #ece9e2;
            padding: 8px 10px;
            font-size: 12px;
            letter-spacing: .08em;
            text-transform: uppercase;
            background: #fafaf8;
        }

        .admin-links a:hover {
            border-color: #c5a882;
            color: #c5a882;
        }

        .admin-main {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .admin-topbar {
            border-bottom: 1px solid #e8e6e1;
            background: rgba(250, 250, 248, 0.95);
            backdrop-filter: blur(6px);
            padding: 14px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .admin-title {
            margin: 0;
            font-size: 20px;
            font-weight: 300;
            letter-spacing: .04em;
        }

        .admin-user {
            font-size: 12px;
            letter-spacing: .08em;
            text-transform: uppercase;
            color: #6b6b67;
        }

        .admin-content {
            padding: 20px 18px 26px;
        }

        .admin-panel {
            background: #fff;
            border: 1px solid #e8e6e1;
            box-shadow: 0 20px 45px rgba(28, 28, 26, 0.07);
            padding: 20px;
        }

        .admin-flash {
            border: 1px solid;
            padding: 10px 12px;
            margin-bottom: 12px;
            font-size: 13px;
        }

        .admin-flash.success { border-color: #cbe6d0; background: #f5fff7; color: #2f7a39; }
        .admin-flash.error { border-color: #e9c3bc; background: #fff6f5; color: #9f2d21; }

        .logout-btn {
            margin-top: auto;
            background: #1c1c1a;
            color: #fff;
            border: 1px solid #1c1c1a;
            padding: 8px 10px;
            font-size: 11px;
            letter-spacing: .14em;
            text-transform: uppercase;
            cursor: pointer;
        }

        .logout-btn:hover {
            background: #c5a882;
            border-color: #c5a882;
        }

        @media (max-width: 980px) {
            .admin-shell {
                grid-template-columns: 1fr;
            }

            .admin-sidebar {
                border-right: none;
                border-bottom: 1px solid #e8e6e1;
            }

            .logout-btn {
                margin-top: 10px;
            }
        }
    </style>

    <th:block layout:fragment="styles"></th:block>
</head>
<body>
<div class="admin-shell">
    <aside class="admin-sidebar">
        <a class="admin-brand" th:href="@{/admin/dashboard}">Minimal Admin</a>

        <nav class="admin-links">
            <a th:href="@{/admin/dashboard}">Dashboard</a>
            <a th:href="@{/admin/products}">San pham</a>
            <a th:href="@{/admin/categories}">Danh muc</a>
            <a th:href="@{/admin/collections}">Bo suu tap</a>
            <a th:href="@{/admin/vouchers}">Voucher</a>
            <a th:href="@{/admin/staff}" sec:authorize="hasRole('SUPER_ADMIN')">Nhan su</a>
            <a th:href="@{/admin/settings/featured}">Noi bat</a>
        </nav>

        <form th:action="@{/admin/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit" class="logout-btn">Dang xuat</button>
        </form>
    </aside>

    <div class="admin-main">
        <header class="admin-topbar">
            <h1 class="admin-title" layout:fragment="page-title">Dashboard</h1>
            <div class="admin-user">
                <span sec:authentication="name">Admin</span>
            </div>
        </header>

        <main class="admin-content">
            <div th:if="${success}" class="admin-flash success" th:text="${success}"></div>
            <div th:if="${error}" class="admin-flash error" th:text="${error}"></div>

            <section class="admin-panel" layout:fragment="content">
                <p style="margin:0; color:#6b6b67;">Trang quan tri dang duoc cap nhat theo giao dien moi.</p>
            </section>
        </main>
    </div>
</div>

<script th:src="@{/js/main.js}"></script>
<th:block layout:fragment="scripts"></th:block>
</body>
</html>
