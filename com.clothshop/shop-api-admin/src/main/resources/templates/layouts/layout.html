<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <meta name="_csrf_parameter" th:content="${_csrf.parameterName}"/>

    <title layout:title-pattern="$CONTENT_TITLE - ClothShop Admin">ClothShop Admin</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <div layout:fragment="styles">
    </div>

</head>
<body>

<aside class="admin-sidebar" id="adminSidebar">
    <div class="sidebar-logo">
        <span class="logo-text">CLOTHSHOP ADMIN</span>
    </div>

    <nav class="sidebar-nav">
        <div class="nav-group">
            <span class="nav-group-label">TỔNG QUAN</span>
            <a class="nav-link" th:href="@{/admin/dashboard}"
               th:classappend="${currentPath != null and #strings.contains(currentPath, '/dashboard')} ? 'active' : ''">
                <svg class="nav-icon" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
                <span>Dashboard</span>
            </a>
        </div>

        <div class="nav-group">
            <span class="nav-group-label">BÁN HÀNG</span>
            <a class="nav-link" th:href="@{/admin/products}"
               th:classappend="${currentPath != null and #strings.contains(currentPath, '/products')} ? 'active' : ''">
                <svg class="nav-icon" viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
                <span>Sản phẩm</span>
            </a>
            <a class="nav-link" th:href="@{/admin/categories}"
               th:classappend="${currentPath != null and #strings.contains(currentPath, '/categories')} ? 'active' : ''">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                </svg>
                <span>Danh mục</span>
            </a>
        </div>

        <div class="nav-group">
            <span class="nav-group-label">MARKETING</span>
            <a class="nav-link" th:href="@{/admin/collections}"
               th:classappend="${currentPath != null and #strings.contains(currentPath, '/collections')} ? 'active' : ''">
                <svg class="nav-icon" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
                <span>Bộ sưu tập</span>
            </a>
        </div>

        <div class="nav-group">
            <span class="nav-group-label">KHÁCH HÀNG</span>
            <a class="nav-link" th:href="@{/admin/customers}"
               th:classappend="${currentPath != null and #strings.contains(currentPath, '/customers')} ? 'active' : ''">
                <svg class="nav-icon" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                <span>Khách hàng</span>
            </a>
        </div>

        <div class="nav-group" sec:authorize="hasRole('SUPER_ADMIN')">
            <span class="nav-group-label">HỆ THỐNG</span>
            <a class="nav-link" th:href="@{/admin/staff}"
               th:classappend="${currentPath != null and #strings.contains(currentPath, '/staff')} ? 'active' : ''">
                <svg class="nav-icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                <span>Quản lý nhân sự</span>
            </a>
        </div>

        <div style="padding: 12px 18px; margin-top: auto; border-top: 1px solid var(--border);">
            <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 10px;">
                <div class="admin-avatar" style="width: 28px; height: 28px; font-size: 11px;" th:text="${#authentication.name.substring(0,1).toUpperCase()}">U</div>
                <div style="flex: 1; min-width: 0;">
                    <div style="font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" sec:authentication="name">Admin</div>
                    <div style="font-size: 10px; color: var(--muted);">
                        <span sec:authorize="hasRole('SUPER_ADMIN')">Super Admin</span>
                        <span sec:authorize="!hasRole('SUPER_ADMIN')">Admin</span>
                    </div>
                </div>
            </div>
            <form th:action="@{/admin/logout}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn btn-outline" style="width: 100%; font-size: 12px; padding: 6px;">
                    <svg style="width: 14px; height: 14px;" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                    <span>Đăng xuất</span>
                </button>
            </form>
        </div>
    </nav>
</aside>

<div class="admin-main" id="adminMain">
    <header class="admin-header">
        <button class="hamburger-btn" onclick="AdminUI.toggleSidebar()">
            <svg style="width: 20px; height: 20px;" viewBox="0 0 24 24">
                <line x1="3" y1="12" x2="21" y2="12"/>
                <line x1="3" y1="6" x2="21" y2="6"/>
                <line x1="3" y1="18" x2="21" y2="18"/>
            </svg>
        </button>

        <h1 layout:fragment="page-title" class="page-title">
            Dashboard
        </h1>

        <div class="header-right">
            <div class="header-search" style="display: none;">
                <svg style="width: 16px; height: 16px;" viewBox="0 0 24 24">
                    <circle cx="11" cy="11" r="8"/>
                    <path d="m21 21-4.35-4.35"/>
                </svg>
                <label for="headerSearch" style="display: none;">Tìm kiếm</label>
                <input type="text" id="headerSearch" placeholder="Tìm kiếm...">
            </div>

            <button class="notif-btn">
                <svg style="width: 18px; height: 18px;" viewBox="0 0 24 24">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                    <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                </svg>
                <span class="notif-badge">3</span>
            </button>

            <div class="admin-user">
                <div class="admin-avatar" th:text="${#authentication.name.substring(0,1).toUpperCase()}">A</div>
                <span class="admin-name" sec:authentication="name">Admin</span>
            </div>

            <div layout:fragment="page-actions">
            </div>
        </div>
    </header>

    <div class="admin-content">
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert" style="margin-bottom: 16px;">
            <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert" style="margin-bottom: 16px;">
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div layout:fragment="content">
            <p>Content goes here</p>
        </div>
    </div>
</div>

<div class="sidebar-overlay" id="sidebarOverlay"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>

<div layout:fragment="scripts">
</div>

</body>
</html>
