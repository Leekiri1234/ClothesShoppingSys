<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <meta name="_csrf_parameter" th:content="${_csrf.parameterName}"/>

    <title layout:title-pattern="$CONTENT_TITLE - ClothShop Admin">MINIMAL ADMIN</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <div layout:fragment="styles">
    </div>

</head>
<body>

<!-- SIDEBAR -->
<th:block th:replace="~{fragments/sidebar :: sidebar}"/>

<!-- MAIN CONTENT -->
<div class="admin-main" id="adminMain">

    <!-- HEADER -->
    <header class="admin-header">
        <button class="hamburger-btn" onclick="AdminUI.toggleSidebar()">
            <svg style="width: 20px; height: 20px;" viewBox="0 0 24 24">
                <line x1="3" y1="12" x2="21" y2="12"/>
                <line x1="3" y1="6" x2="21" y2="6"/>
                <line x1="3" y1="18" x2="21" y2="18"/>
            </svg>
        </button>

        <h1 layout:fragment="page-title" class="page-title">
            Dashboard
        </h1>

        <div class="header-right">
            <div class="admin-user">
                <div class="admin-avatar" th:text="${#authentication.name.substring(0,1).toUpperCase()}">A</div>
                <span class="admin-name" sec:authentication="name">Admin</span>
            </div>

            <div layout:fragment="page-actions">
            </div>
        </div>
    </header>

    <!-- CONTENT -->
    <div class="admin-content">
        <!-- ALERTS -->
        <th:block th:replace="~{fragments/alerts :: alerts}"/>

        <div layout:fragment="content">
            <p>Content goes here</p>
        </div>
    </div>
</div>

<div class="sidebar-overlay" id="sidebarOverlay"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>

<div layout:fragment="scripts">
</div>

</body>
</html>
