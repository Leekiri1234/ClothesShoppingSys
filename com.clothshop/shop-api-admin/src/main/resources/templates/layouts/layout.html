<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <meta name="_csrf_parameter" th:content="${_csrf.parameterName}"/>

    <title layout:title-pattern="$CONTENT_TITLE - ClothShop Admin">ClothShop Admin</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <div layout:fragment="styles">
    </div>

</head>
<body>
<th:block th:replace="~{fragments/admin/chrome :: sidebar(${currentPath})}"></th:block>

<div class="admin-main" id="adminMain">
    <th:block th:replace="~{fragments/admin/chrome :: header}"></th:block>

    <div class="admin-content">
        <th:block th:replace="~{fragments/admin/chrome :: flash-messages}"></th:block>

        <div layout:fragment="content">
            <p>Content goes here</p>
        </div>
    </div>
</div>

<div class="sidebar-overlay" id="sidebarOverlay"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>

<div layout:fragment="scripts">
</div>

</body>
</html>
