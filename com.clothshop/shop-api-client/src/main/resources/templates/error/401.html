<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Cần xác thực - 401</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #f5f5f5 0%, #e0e0e0 100%);
        }
        .error-container {
            text-align: center;
            background: white;
            padding: 60px 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            max-width: 500px;
        }
        .error-code {
            font-size: 120px;
            font-weight: bold;
            color: #ef5350;
            margin: 0;
            line-height: 1;
        }
        .error-title {
            font-size: 24px;
            color: #333;
            margin: 20px 0;
        }
        .error-message {
            font-size: 16px;
            color: #666;
            margin: 20px 0;
        }
        .error-icon {
            font-size: 80px;
            margin-bottom: 20px;
            opacity: 0.8;
        }
    </style>
</head>
<body>
<div class="error-container">
    <div class="error-icon">🔐</div>
    <h1 class="error-code">401</h1>
    <h2 class="error-title">Cần Xác Thực</h2>
    <p class="error-message">
        Bạn cần đăng nhập để truy cập trang này.<br>
        Vui lòng đăng nhập bằng tài khoản của bạn.
    </p>
    <div style="margin-top: 30px;">
        <a href="/login" class="btn btn-primary btn-lg" style="margin-right: 10px;">Đăng nhập</a>
        <a href="/" class="btn btn-outline-secondary btn-lg">Quay về trang chủ</a>
    </div>
</div>
</body>
</html>
