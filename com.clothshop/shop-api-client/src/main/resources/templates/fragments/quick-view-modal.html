<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- ============================================================
     PRODUCT QUICK VIEW MODAL
     Dùng như fragment: th:replace="~{fragments/quick-view-modal :: quickViewModal}"
     ============================================================ -->
<div th:fragment="quickViewModal" id="quickViewModal" class="qv-overlay" role="dialog" aria-modal="true" aria-labelledby="qvProductName">

    <!-- Backdrop -->
    <div class="qv-backdrop" onclick="closeQuickViewModal()"></div>

    <!-- Modal panel -->
    <div class="qv-panel">

        <!-- Close button -->
        <button class="qv-close" onclick="closeQuickViewModal()" aria-label="Đóng">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="1.8"
                 stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
        </button>

        <!-- Loading skeleton -->
        <div class="qv-loading" id="qvLoading">
            <div class="qv-skeleton-img"></div>
            <div class="qv-skeleton-body">
                <div class="qv-skeleton-line w-60"></div>
                <div class="qv-skeleton-line w-40"></div>
                <div class="qv-skeleton-line w-80"></div>
                <div class="qv-skeleton-line w-80"></div>
                <div class="qv-skeleton-line w-50"></div>
            </div>
        </div>

        <!-- Content (filled by JS) -->
        <div class="qv-content" id="qvContent" style="display:none;">

            <!-- LEFT: Image gallery -->
            <div class="qv-gallery">
                <div class="qv-main-image-wrap">
                    <img id="qvMainImage" src="" alt="" class="qv-main-image">
                    <span class="qv-badge" id="qvBadge" style="display:none;">Sale</span>
                </div>
                <div class="qv-thumbs" id="qvThumbs"></div>
            </div>

            <!-- RIGHT: Product info -->
            <div class="qv-info">

                <p class="qv-brand" id="qvBrand">MINIMAL</p>
                <h2 class="qv-product-name" id="qvProductName">Tên sản phẩm</h2>

                <div class="qv-price-row">
                    <span class="qv-price" id="qvPrice">0₫</span>
                    <span class="qv-price-original" id="qvPriceOriginal" style="display:none;">0₫</span>
                    <span class="qv-discount-badge" id="qvDiscountBadge" style="display:none;"></span>
                </div>

                <p class="qv-description" id="qvDescription"></p>

                <div class="qv-divider"></div>

                <!-- Variant Selection (Color / Material…) -->
                <div class="qv-section" id="qvVariantSection" style="display:none;">
                    <div class="qv-section-label">
                        <span>Phân loại</span>
                        <span class="qv-selected-label" id="qvSelectedVariantLabel"></span>
                    </div>
                    <div class="qv-option-list" id="qvVariantList"></div>
                </div>

                <!-- Size Selection -->
                <div class="qv-section" id="qvSizeSection" style="display:none;">
                    <div class="qv-section-label">
                        <span>Kích cỡ</span>
                        <span class="qv-selected-label" id="qvSelectedSizeLabel"></span>
                    </div>
                    <div class="qv-option-list" id="qvSizeList"></div>
                </div>

                <!-- Quantity -->
                <div class="qv-section">
                    <div class="qv-section-label"><span>Số lượng</span></div>
                    <div class="qv-qty-row">
                        <button class="qv-qty-btn" onclick="qvChangeQty(-1)" aria-label="Giảm">−</button>
                        <span class="qv-qty-value" id="qvQtyDisplay">1</span>
                        <button class="qv-qty-btn" onclick="qvChangeQty(1)" aria-label="Tăng">+</button>
                        <span class="qv-stock-hint" id="qvStockHint"></span>
                    </div>
                </div>

                <!-- Error message -->
                <p class="qv-error" id="qvError" style="display:none;"></p>

                <!-- Actions -->
                <div class="qv-actions">
                    <button class="qv-btn-add" id="qvAddBtn" onclick="qvAddToCart()">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                             viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
                            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
                        </svg>
                        THÊM VÀO GIỎ
                    </button>
                    <a class="qv-btn-detail" id="qvDetailLink" href="#">XEM CHI TIẾT</a>
                </div>

            </div><!-- /qv-info -->
        </div><!-- /qv-content -->

    </div><!-- /qv-panel -->
</div><!-- /quickViewModal -->

</body>
</html>
