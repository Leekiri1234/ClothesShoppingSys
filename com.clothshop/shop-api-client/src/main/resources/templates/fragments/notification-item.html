<style>
    /* Dropdown Aesthetics */
    .noti-dropdown-header {
        padding: 12px 16px;
        border-bottom: 1px solid #f1f3f5;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: #ffffff;
        border-radius: 12px 12px 0 0;
    }
    
    .noti-dropdown-title {
        font-size: 14px;
        font-weight: 600;
        color: #1a1b1e;
        margin: 0;
    }

    .noti-dropdown-mark-btn {
        background: none;
        border: none;
        font-size: 12px;
        font-weight: 500;
        color: #0057ff;
        cursor: pointer;
        padding: 4px 8px;
        border-radius: 4px;
        transition: background 0.2s;
    }

    .noti-dropdown-mark-btn:hover {
        background: #f0f4ff;
    }

    .noti-item {
        display: block;
        text-decoration: none;
        padding: 14px 16px;
        transition: all 0.2s ease;
        border-bottom: 1px solid #f8f9fa;
        position: relative;
    }

    .noti-item:last-child {
        border-bottom: none;
    }

    .noti-item:hover {
        background: #f8f9fa;
    }

    .noti-item.unread {
        background: #f8fbff;
    }

    .noti-item.unread::before {
        content: '';
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 3px;
        background: #0057ff;
    }

    .noti-item-type {
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: #868e96;
        margin-bottom: 6px;
        display: flex;
        align-items: center;
        gap: 6px;
    }

    .noti-item.unread .noti-item-type {
        color: #0057ff;
    }

    .noti-item-badge {
        display: inline-block;
        width: 6px;
        height: 6px;
        background: #ff4b4b;
        border-radius: 50%;
        box-shadow: 0 0 6px rgba(255, 75, 75, 0.4);
    }

    .noti-item-title {
        font-size: 13px;
        color: #212529;
        margin-bottom: 6px;
        line-height: 1.4;
    }

    .noti-item.unread .noti-item-title {
        font-weight: 600;
    }

    .noti-item:not(.unread) .noti-item-title {
        font-weight: 400;
    }

    .noti-item-time {
        font-size: 11px;
        color: #adb5bd;
        display: flex;
        align-items: center;
        gap: 4px;
    }

    .noti-dropdown-empty {
        padding: 40px 20px;
        text-align: center;
        color: #adb5bd;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        font-size: 13px;
    }
</style>

<div th:fragment="notification-list" id="noti-items-container">
    <div class="noti-dropdown-header">
        <span class="noti-dropdown-title">Thông báo</span>
        <button onclick="markAllNotificationsAsRead()" class="noti-dropdown-mark-btn">Đánh dấu đã đọc</button>
    </div>

    <th:block th:if="${notifications != null and !notifications.empty}">
        <div>
            <a th:each="item : ${notifications}"
               th:href="@{/profile/notifications/{id}(id=${item.notification.id})}"
               class="noti-item"
               th:classappend="${item.isRead ? '' : 'unread'}">

                <div class="noti-item-type">
                    <span th:if="${!item.isRead}" class="noti-item-badge"></span>
                    <span th:text="${item.notification.type != null ? item.notification.type.displayName : 'Thông báo'}"></span>
                </div>
                
                <div class="noti-item-title" th:text="${item.notification.title}"></div>

                <div class="noti-item-time">
                    <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                    <span th:text="${#temporals.format(item.createdAt, 'dd/MM HH:mm')}"></span>
                </div>
            </a>
        </div>
    </th:block>

    <div th:if="${notifications == null or notifications.empty}" class="noti-dropdown-empty">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#ced4da" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
        Trống
    </div>
</div>
