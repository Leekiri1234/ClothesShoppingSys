<div th:fragment="notification-list" id="noti-items-container" style="max-height: 300px; overflow-y: auto;">
    <th:block th:if="${not #lists.isEmpty(notifications)}">
        <a th:each="item : ${notifications}"
           th:href="@{/profile/notifications/{id}(id=${item.notification.id})}"
           class="noti-item"
           th:classappend="${item.isRead ? '' : 'unread'}"
           style="display:block; text-decoration:none; border-bottom: 1px solid #f9f9f9; padding: 15px; transition: background 0.3s ease;">

            <span class="noti-item-title"
                  th:text="${item.notification.title}"
                  style="font-size: 13px; color: #1c1c1a; font-weight: 500; margin-bottom: 4px; display: block;">Tiêu đề</span>

            <span class="noti-item-time" style="font-size: 11px; color: #999; display: block;">
                <span th:text="${#temporals.format(item.createdAt, 'dd/MM HH:mm')}">Thời gian</span>
                • ID: <span th:text="${item.notification.id}">0</span>
            </span>
        </a>
    </th:block>

    <div th:if="${#lists.isEmpty(notifications)}"
         style="padding: 30px 20px; text-align: center; color: #999; font-size: 12px;">
        Không có thông báo nào.
    </div>
</div>
