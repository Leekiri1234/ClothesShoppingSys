<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$CONTENT_TITLE - MINIMAL">MINIMAL</title>

    <meta th:if="${_csrf != null}" name="_csrf" th:content="${_csrf.token}"/>
    <meta th:if="${_csrf != null}" name="_csrf_header" th:content="${_csrf.headerName}"/>

    <link rel="stylesheet" th:href="@{/css/legacy-client.css}">

    <th:block layout:fragment="styles"></th:block>
</head>
<body>
<header class="site-header" id="site-header">
    <div class="header-inner">
        <a class="header-logo" th:href="@{/}">MINIMAL</a>
        <nav class="site-nav">
            <a class="nav-link" th:href="@{/}">Trang chủ</a>
            <a class="nav-link" th:href="@{/products}">Sản phẩm</a>
            <a class="nav-link" th:href="@{/collections}">Bộ sưu tập</a>
            <a class="nav-link" th:href="@{/cart}">Giỏ hàng</a>
        </nav>
        <div class="header-actions">
            <a class="header-icon-btn" th:href="@{/products}" title="Tìm kiếm">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
            </a>
            <a class="header-icon-btn" th:href="@{/products}" title="Wishlist">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
            </a>
            <a class="header-icon-btn" th:href="@{/profile}" sec:authorize="isAuthenticated()" title="Tài khoản">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </a>
            <a class="header-icon-btn" th:href="@{/login}" sec:authorize="!isAuthenticated()" title="Đăng nhập">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </a>
            <a class="header-icon-btn" th:href="@{/cart}" title="Giỏ hàng">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
                <span class="cart-count">0</span>
            </a>
        </div>
    </div>
</header>

<main class="page-content" layout:fragment="content"></main>

<footer class="site-footer">
    <div class="container">
        <div class="footer-bottom">
            <span>© 2026 MINIMAL. All rights reserved.</span>
            <div class="footer-bottom-links">
                <span class="footer-bottom-link">Chính sách bảo mật</span>
                <span class="footer-bottom-link">Điều khoản sử dụng</span>
            </div>
            <div class="payment-icons">
                <span class="payment-chip">VISA</span>
                <span class="payment-chip">MOMO</span>
                <span class="payment-chip">COD</span>
            </div>
        </div>
    </div>
</footer>

<script th:src="@{/js/main.js}"></script>
<th:block layout:fragment="scripts"></th:block>
</body>
</html>
