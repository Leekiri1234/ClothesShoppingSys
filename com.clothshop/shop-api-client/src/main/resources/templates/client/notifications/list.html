<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <title>Thông báo của bạn</title>
</head>
<body>
<div layout:fragment="content">
    <main class="container" style="max-width: 800px; margin: 150px auto 100px; padding: 0 20px;">
        <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 50px; border-bottom: 1px solid #eee; padding-bottom: 20px;">
            <h2 style="font-weight: 300; letter-spacing: -1px; margin: 0;">
                Thông báo của bạn
            </h2>
            <button onclick="markAllNotificationsAsRead()" style="background: none; border: 1px solid #ddd; padding: 8px 16px; border-radius: 4px; font-size: 13px; cursor: pointer; transition: 0.2s;">
                Đánh dấu tất cả đã đọc
            </button>
        </div>

        <div class="notification-list">
            <div th:each="item : ${notifications}"
                 th:style="'padding: 25px 20px; margin-bottom: 15px; border-radius: 8px; display: flex; flex-direction: column; transition: 0.3s; ' + (${item.isRead} ? 'background-color: transparent; border: 1px solid #eee;' : 'background-color: #f7f9fc; border: 1px solid #e1e8f0; box-shadow: 0 2px 8px rgba(0,0,0,0.02);')">

                <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                    <div style="flex: 1;">
                        <span th:if="${!item.isRead}" style="display: inline-block; background: #ff4d4f; color: white; font-size: 10px; padding: 2px 6px; border-radius: 10px; margin-bottom: 8px; font-weight: 600;">MỚI</span>

                        <a th:href="@{/profile/notifications/{id}(id=${item.notification.id})}"
                           th:text="${item.notification.title}"
                           th:style="'text-decoration: none; color: #1c1c1a; font-size: 18px; display: block; margin-bottom: 8px; ' + (${item.isRead} ? 'font-weight: 400;' : 'font-weight: 600;')">
                        </a>

                        <div th:utext="${item.notification.content}"
                             style="font-size: 14px; color: #666; line-height: 1.6; margin-bottom: 12px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">
                        </div>

                        <span th:text="${#temporals.format(item.createdAt, 'dd MMMM, yyyy HH:mm')}"
                              style="color: #999; font-size: 12px; letter-spacing: 1px;">
                        </span>
                    </div>

                    <div th:if="${!item.isRead}"
                         style="width: 12px; height: 12px; background: #007bff; border-radius: 50%; margin-top: 8px; flex-shrink: 0; margin-left: 15px;">
                    </div>
                </div>
            </div>

            <div th:if="${#lists.isEmpty(notifications)}" style="text-align: center; padding: 100px 0; color: #999;">
                Danh sách thông báo trống.
            </div>
        </div>
    </main>
</div>
</body>
</html>
