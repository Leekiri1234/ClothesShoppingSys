<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}"> <head>
    <title>Thông báo của tôi</title>
</head>
<body>
<div layout:fragment="content">
    <main class="container" style="max-width: 800px; margin: 150px auto 100px; padding: 0 20px;">
        <h2 style="font-weight: 300; letter-spacing: -1px; margin-bottom: 50px; border-bottom: 1px solid #eee; padding-bottom: 20px;">
            Thông báo
        </h2>

        <div class="notification-list">
            <div th:each="item : ${notifications}"
                 th:style="'padding: 25px 0; border-bottom: 1px solid #f5f5f5; display: flex; justify-content: space-between; align-items: center; transition: 0.3s; ' + (${item.isRead} ? 'opacity: 0.5;' : 'opacity: 1;')">

                <div style="flex: 1;">
                    <a th:href="@{/profile/notifications/{id}(id=${item.notification.id})}"
                       th:text="${item.notification.title}"
                       style="text-decoration: none; color: #1c1c1a; font-size: 16px; font-weight: 400; display: block; margin-bottom: 8px;">
                    </a>
                    <span th:text="${#temporals.format(item.createdAt, 'dd MMMM, yyyy')}"
                          style="color: #999; font-size: 12px; text-transform: uppercase; letter-spacing: 1px;">
                        </span>
                </div>

                <div th:if="${!item.isRead}"
                     style="width: 8px; height: 8px; background: #000; border-radius: 50%;">
                </div>
            </div>

            <div th:if="${#lists.isEmpty(notifications)}" style="text-align: center; padding: 100px 0; color: #999;">
                Danh sách thông báo trống.
            </div>
        </div>
    </main>
</div>
</body>
</html>
