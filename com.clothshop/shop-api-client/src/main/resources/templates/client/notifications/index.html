<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
  <title>Thông báo của tôi</title>
</head>
<body>
<div layout:fragment="content">
  <div class="row justify-content-center">
    <div class="col-md-10 col-lg-8">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="fw-bold mb-0"><i class="fas fa-bell me-2"></i>Thông báo</h4>
        <button th:if="${!#lists.isEmpty(notifications.content)}"
                class="btn btn-sm btn-outline-primary"
                onclick="markAllAsRead()">
          Đánh dấu tất cả đã đọc
        </button>
      </div>

      <div class="card shadow-sm border-0 overflow-hidden">
        <div class="list-group list-group-flush">
          <div th:each="item : ${notifications.content}"
               th:id="'notif-' + ${item.id}"
               class="notification-item border-bottom px-4 py-3"
               th:classappend="${!item.isRead} ? 'unread' : ''">

            <div class="notif-status-dot" th:if="${!item.isRead}"></div>

            <div class="notification-content">
              <div class="d-flex justify-content-between">
                <h6 class="notification-title mb-1 text-dark" th:text="${item.notification.title}"></h6>
                <span class="notification-time text-muted small"
                      th:text="${#temporals.format(item.createdAt, 'dd/MM/yyyy HH:mm')}"></span>
              </div>
              <p class="notification-text mb-2 text-secondary" th:text="${item.notification.content}"></p>

              <div th:if="${item.notification.title != null}" class="mt-2">
                <a th:href="${item.notification.title}" class="btn btn-sm btn-link p-0 text-decoration-none text-primary">
                  Chi tiết <i class="fas fa-chevron-right ms-1 small"></i>
                </a>
              </div>
            </div>
          </div>

          <div th:if="${#lists.isEmpty(notifications.content)}" class="text-center py-5">
            <img th:src="@{/images/no-notif.png}" alt="No notifications" style="width: 120px; opacity: 0.5;">
            <p class="text-muted mt-3">Bạn chưa có thông báo nào.</p>
            <a th:href="@{/products}" class="btn btn-primary btn-sm px-4">Tiếp tục mua sắm</a>
          </div>
        </div>
      </div>

      <nav th:if="${notifications.totalPages > 1}" class="mt-4">
        <ul class="pagination justify-content-center">
          <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
            <a class="page-link" th:href="@{/notifications(page=${currentPage - 1})}">Trước</a>
          </li>
          <li class="page-item" th:each="i : ${#numbers.sequence(0, notifications.totalPages - 1)}"
              th:classappend="${i == currentPage} ? 'active'">
            <a class="page-link" th:href="@{/notifications(page=${i})}" th:text="${i + 1}"></a>
          </li>
          <li class="page-item" th:classappend="${currentPage == notifications.totalPages - 1} ? 'disabled'">
            <a class="page-link" th:href="@{/notifications(page=${currentPage + 1})}">Sau</a>
          </li>
        </ul>
      </nav>
    </div>
  </div>
</div>

<th:block layout:fragment="scripts">
  <script>
    function markAllAsRead() {
      // Lấy CSRF từ main.js context đã có
      const csrfToken = document.querySelector('meta[name="_csrf"]')?.content;
      const csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.content;

      fetch('/api/notifications/mark-all-read', {
        method: 'POST',
        headers: {
          [csrfHeader]: csrfToken
        }
      }).then(res => {
        if(res.ok) {
          // Cập nhật UI ngay lập tức: xóa class unread và dấu chấm xanh
          document.querySelectorAll('.notification-item.unread').forEach(el => {
            el.classList.remove('unread');
            el.querySelector('.notif-status-dot')?.remove();
          });
          // Cập nhật lại số lượng trên chuông
          if(typeof initializeNotifications === "function") initializeNotifications();
        }
      });
    }
  </script>
</th:block>
</body>
</html>
