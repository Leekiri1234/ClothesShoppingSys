<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <title th:text="${product.productName != null ? product.productName : 'Chi tiết sản phẩm'}">Chi tiết sản phẩm</title>
    <style>
        input[type="radio"]:checked + .size-btn { background-color: #000 !important; color: #fff !important; border-color: #000 !important; }

        .disabled-size { opacity: 0.4; cursor: not-allowed !important; pointer-events: none; background-color: #f9f9f9; color: #ccc !important; border-color: #eee !important; text-decoration: line-through; }
        .disabled-action-btn { opacity: 0.5; pointer-events: none; background-color: #ccc !important; border-color: #ccc !important; color: #fff !important; cursor: not-allowed; }

        .product-detail-wrap { display: flex; flex-wrap: wrap; gap: 40px; margin: 40px 0; }
        .product-gallery { flex: 1; min-width: 300px; display: flex; gap: 15px; }
        .thumbnail-list { display: flex; flex-direction: column; gap: 10px; width: 80px; }
        .thumbnail-item { width: 100%; aspect-ratio: 3/4; object-fit: cover; cursor: pointer; border: 1px solid transparent; transition: 0.3s; }
        .thumbnail-item:hover { border-color: #000; }
        .main-image { flex: 1; aspect-ratio: 3/4; object-fit: cover; width: 100%; background: #f5f5f5; }

        .product-info { flex: 1; min-width: 300px; padding-top: 10px; }
        .breadcrumb { font-size: 12px; color: #999; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; }
        .product-title { font-size: 24px; font-weight: 400; margin-bottom: 15px; line-height: 1.3; }
        .product-price { font-size: 20px; font-weight: 600; margin-bottom: 25px; }

        .stock-status { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 500; margin-bottom: 20px; padding: 5px 12px; border-radius: 2px; }
        .stock-status .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
        .stock-status.in-stock  { background: #f0faf4; color: #1a7f45; border: 1px solid #c3e6cb; }
        .stock-status.in-stock  .dot { background: #1a7f45; }
        .stock-status.low-stock { background: #fff8ec; color: #a05a00; border: 1px solid #ffd28a; }
        .stock-status.low-stock .dot { background: #f09000; }
        .stock-status.out-stock { background: #fff0f0; color: #c0392b; border: 1px solid #f5c6cb; }
        .stock-status.out-stock .dot { background: #c0392b; }

        .section-title { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; display: block; }
        .action-btn { width: 100%; padding: 15px; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; transition: 0.3s; border: 1px solid #000; display: flex; justify-content: center; align-items: center; gap: 10px; margin-bottom: 10px; }
        .btn-add-cart { background: #fff; color: #000; }
        .btn-add-cart:hover:not(.disabled-action-btn) { background: #f5f5f5; }
        .btn-buy-now { background: #000; color: #fff; }
        .btn-buy-now:hover:not(.disabled-action-btn) { background: #333; }

        #cart-toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(80px); background: #000; color: #fff; padding: 14px 28px; font-size: 13px; font-weight: 500; letter-spacing: 0.5px; z-index: 9999; opacity: 0; transition: transform 0.35s ease, opacity 0.35s ease; pointer-events: none; }
        #cart-toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

        .accordion-item { border-bottom: 1px solid #eee; }
        .accordion-header { padding: 15px 0; font-size: 13px; font-weight: 600; text-transform: uppercase; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .accordion-content { padding-bottom: 15px; font-size: 14px; color: #666; line-height: 1.6; display: none; }
        .accordion-content.active { display: block; }

        .review-section { margin: 50px 0; border-top: 2px solid #000; padding-top: 40px; }
        .review-section-title { font-size: 18px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 30px; }
        .review-alert { padding: 12px 16px; font-size: 13px; margin-bottom: 24px; border-left: 3px solid; }
        .review-alert.success { background: #f0faf4; color: #1a7f45; border-color: #1a7f45; }
        .review-alert.error   { background: #fff0f0; color: #c0392b; border-color: #c0392b; }
        .btn-write-review { display: inline-flex; align-items: center; gap: 8px; padding: 12px 24px; background: #000; color: #fff; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; border: none; transition: background 0.2s; margin-bottom: 30px; }
        .btn-write-review:hover { background: #333; }
        .review-form-wrap { border: 1px solid #e5e5e5; padding: 28px; margin-bottom: 36px; display: none; }
        .review-form-wrap.open { display: block; }
        .review-form-title { font-size: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 20px; }
        .star-rating { display: flex; flex-direction: row-reverse; justify-content: flex-end; gap: 4px; margin-bottom: 20px; }
        .star-rating input[type="radio"] { display: none; }
        .star-rating label { font-size: 28px; color: #ddd; cursor: pointer; transition: color 0.15s; line-height: 1; }
        .star-rating label:hover, .star-rating label:hover ~ label, .star-rating input:checked ~ label { color: #f5a623; }
        .review-form-group { margin-bottom: 16px; }
        .review-form-group label { display: block; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; color: #333; }
        .review-textarea { width: 100%; padding: 12px; border: 1px solid #ddd; font-size: 14px; resize: vertical; min-height: 100px; font-family: inherit; outline: none; box-sizing: border-box; transition: border-color 0.2s; }
        .review-textarea:focus { border-color: #000; }
        .review-form-actions { display: flex; gap: 10px; margin-top: 20px; }
        .btn-submit-review { padding: 12px 28px; background: #000; color: #fff; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; border: 1px solid #000; transition: background 0.2s; }
        .btn-submit-review:hover { background: #333; }
        .btn-cancel-review { padding: 12px 28px; background: #fff; color: #000; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; border: 1px solid #ddd; transition: background 0.2s; }
        .btn-cancel-review:hover { background: #f5f5f5; }
        .review-list { display: flex; flex-direction: column; gap: 24px; }
        .review-item { padding-bottom: 24px; border-bottom: 1px solid #eee; }
        .review-item:last-child { border-bottom: none; }
        .review-item-header { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; flex-wrap: wrap; }
        .review-author { font-size: 14px; font-weight: 600; }
        .review-date { font-size: 12px; color: #999; }
        .review-stars { display: flex; gap: 2px; color: #f5a623; font-size: 14px; }
        .review-comment { font-size: 14px; color: #555; line-height: 1.6; }
        .review-empty { font-size: 14px; color: #999; padding: 20px 0; text-align: center; }

        @media (max-width: 768px) { .product-gallery { flex-direction: column-reverse; } .thumbnail-list { flex-direction: row; width: 100%; overflow-x: auto; } .thumbnail-item { width: 80px; } }
    </style>
</head>
<body>

<div id="cart-toast"></div>

<section layout:fragment="content">
    <div class="container">
        <div class="product-detail-wrap">

            <!-- ── GALLERY ── -->
            <div class="product-gallery">
                <div class="thumbnail-list" th:if="${!#lists.isEmpty(product.images)}">
                    <img th:each="img : ${product.images}" th:src="${img}" class="thumbnail-item"
                         onclick="document.getElementById('main-img').src=this.src;">
                </div>
                <img id="main-img" th:src="${product.imageUrl}" class="main-image" th:alt="${product.productName}">
            </div>

            <!-- ── PRODUCT INFO ── -->
            <div class="product-info">
                <div class="breadcrumb" th:text="${product.categoryName != null ? product.categoryName : 'SẢN PHẨM'}">DANH MỤC</div>
                <h1 class="product-title" th:text="${product.productName}">Tên sản phẩm</h1>

                <div id="stock-status-badge"
                     th:with="totalStock=${#aggregates.sum(product.variants.![stockQuantity])}"
                     th:classappend="${product.available == false ? 'out-stock' : (totalStock <= 5 ? 'low-stock' : 'in-stock')}"
                     class="stock-status">
                    <span class="dot"></span>
                    <span id="stock-status-text"
                          th:text="${product.available == false ? 'Hết hàng' : (totalStock <= 5 ? 'Sắp hết hàng — còn ' + totalStock + ' sản phẩm' : 'Còn hàng')}">
                        Còn hàng
                    </span>
                </div>

                <div id="product-price" class="product-price"
                     th:text="${product.price != null ? #numbers.formatDecimal(product.price, 0, 'POINT', 0, 'COMMA') + '₫' : 'Đang cập nhật'}"></div>

                <form id="productForm" th:action="@{/cart/add}" method="post">
                    <input type="hidden" name="productId" th:value="${product.productId}" id="productId">
                    <input type="hidden" name="variantId" id="selectedVariantId" value="">

                    <div style="margin-bottom: 25px;" th:if="${!#lists.isEmpty(product.availableColors)}">
                        <span class="section-title">MÀU SẮC</span>
                        <div class="color-options" style="display: flex; flex-wrap: wrap; gap: 10px;">
                            <label th:each="c : ${product.availableColors}" style="cursor: pointer;">
                                <input type="radio" name="color" th:value="${c}" style="display: none;" onchange="onSelectionChange()">
                                <span class="size-btn" th:text="${c}"
                                      style="display: inline-block; padding: 8px 18px; border: 1px solid #ddd; text-transform: uppercase; font-size: 13px; font-weight: 500; transition: 0.2s; background: #fff; color: #000;"></span>
                            </label>
                        </div>
                    </div>

                    <div style="margin-bottom: 25px;" th:if="${!#lists.isEmpty(product.availableSizes)}">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                            <span class="section-title" style="margin: 0;">KÍCH THƯỚC</span>
                            <a href="#" style="font-size: 12px; color: #666; text-decoration: underline;">Hướng dẫn chọn size</a>
                        </div>
                        <div class="size-options" style="display: flex; flex-wrap: wrap; gap: 10px;">
                            <label th:each="s : ${product.availableSizes}" style="cursor: pointer;">
                                <input type="radio" name="size" th:value="${s}" style="display: none;" onchange="onSelectionChange()">
                                <span class="size-btn" th:text="${s}"
                                      style="display: inline-block; padding: 8px 18px; border: 1px solid #ddd; text-transform: uppercase; font-size: 13px; font-weight: 500; transition: 0.2s; background: #fff; color: #000;"></span>
                            </label>
                        </div>
                    </div>

                    <div style="margin-bottom: 30px;">
                        <span class="section-title">SỐ LƯỢNG</span>
                        <div style="display: flex; border: 1px solid #ddd; width: 120px;">
                            <button type="button" onclick="changeQty(-1)"
                                    style="width: 40px; height: 40px; background: none; border: none; cursor: pointer; font-size: 18px;">-</button>
                            <input type="number" id="qty" name="quantity" value="1" min="1" max="99"
                                   style="width: 40px; text-align: center; border: none; outline: none; -moz-appearance: textfield;"
                                   oninput="saveQty()">
                            <button type="button" onclick="changeQty(1)"
                                    style="width: 40px; height: 40px; background: none; border: none; cursor: pointer; font-size: 18px;">+</button>
                        </div>
                    </div>

                    <div style="display: flex; gap: 15px;">
                        <button type="button" id="btn-add-cart" class="action-btn btn-add-cart disabled-action-btn" onclick="addToCart()">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
                                <line x1="3" y1="6" x2="21" y2="6"></line>
                                <path d="M16 10a4 4 0 0 1-8 0"></path>
                            </svg>
                            THÊM VÀO GIỎ
                        </button>
                        <button type="button" class="action-btn btn-add-cart btn-wishlist"
                                style="flex: 0 0 50px; padding: 0;" onclick="toggleWishlist(this)" title="Thêm vào yêu thích">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="transition: all 0.2s;">
                                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                            </svg>
                        </button>
                    </div>
                    <button type="button" id="btn-buy-now" class="action-btn btn-buy-now disabled-action-btn" onclick="buyNow()">MUA NGAY</button>
                </form>

                <div style="margin-top: 40px; border-top: 1px solid #eee;">
                    <div class="accordion-item">
                        <div class="accordion-header" onclick="this.nextElementSibling.classList.toggle('active')">
                            MÔ TẢ SẢN PHẨM
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
                        </div>
                        <div class="accordion-content active" th:utext="${product.description}"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ── REVIEW SECTION ── -->
        <div class="review-section">
            <h2 class="review-section-title">Đánh giá sản phẩm</h2>

            <div class="review-alert success" th:if="${reviewSuccess}" th:text="${reviewSuccess}"></div>
            <div class="review-alert error"   th:if="${reviewError}"   th:text="${reviewError}"></div>

            <button class="btn-write-review"
                    th:if="${canReview}"
                    onclick="document.getElementById('review-form-wrap').classList.toggle('open')">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 20h9"></path>
                    <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
                </svg>
                VIẾT ĐÁNH GIÁ
            </button>

            <div id="review-form-wrap" class="review-form-wrap" th:if="${canReview}">
                <div class="review-form-title">Đánh giá của bạn</div>
                <form th:action="@{/reviews/submit}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <input type="hidden" name="productId"   th:value="${product.productId}"/>
                    <input type="hidden" name="productSlug" th:value="${product.productSlug}"/>
                    <div class="review-form-group">
                        <label>Số sao</label>
                        <div class="star-rating">
                            <input type="radio" id="star5" name="rating" value="5" required>
                            <label for="star5" title="5 sao">★</label>
                            <input type="radio" id="star4" name="rating" value="4">
                            <label for="star4" title="4 sao">★</label>
                            <input type="radio" id="star3" name="rating" value="3">
                            <label for="star3" title="3 sao">★</label>
                            <input type="radio" id="star2" name="rating" value="2">
                            <label for="star2" title="2 sao">★</label>
                            <input type="radio" id="star1" name="rating" value="1">
                            <label for="star1" title="1 sao">★</label>
                        </div>
                    </div>
                    <div class="review-form-group">
                        <label for="review-comment">Nhận xét</label>
                        <textarea id="review-comment" name="comment" class="review-textarea"
                                  placeholder="Chia sẻ trải nghiệm của bạn về sản phẩm này..."
                                  maxlength="1000"></textarea>
                    </div>
                    <div class="review-form-actions">
                        <button type="submit" class="btn-submit-review">Gửi đánh giá</button>
                        <button type="button" class="btn-cancel-review"
                                onclick="document.getElementById('review-form-wrap').classList.remove('open')">Hủy</button>
                    </div>
                </form>
            </div>

            <div class="review-list" th:if="${reviews != null and reviews.totalElements > 0}">
                <div class="review-item" th:each="review : ${reviews.content}">
                    <div class="review-item-header">
                        <span class="review-author" th:text="${review.customerName}">Nguyễn Văn A</span>
                        <div class="review-stars">
                            <th:block th:each="i : ${#numbers.sequence(1, 5)}">
                                <span th:text="${i <= review.rating ? '★' : '☆'}">★</span>
                            </th:block>
                        </div>
                        <span class="review-date" th:text="${#temporals.format(review.reviewDate, 'dd/MM/yyyy')}">01/01/2025</span>
                    </div>
                    <div class="review-comment" th:text="${review.comment}">Nội dung đánh giá...</div>
                </div>
            </div>

            <div class="review-empty" th:if="${reviews == null or reviews.totalElements == 0}">
                Chưa có đánh giá nào cho sản phẩm này.
            </div>
        </div>

    </div><!-- /.container -->

    <script th:inline="javascript">
        const variantsData = /*[[${product.variants}]]*/ [];
        const productId = document.getElementById('productId')?.value;
        const SESSION_KEY = `product_selection_${productId}`;

        function getCsrfTokenFromCookie() {
            const name = 'XSRF-TOKEN=';
            for (let c of decodeURIComponent(document.cookie).split(';')) {
                c = c.trim();
                if (c.startsWith(name)) return c.substring(name.length);
            }
            return "";
        }

        function getSecurityHeaders() {
            const csrf = getCsrfTokenFromCookie();
            return {
                'Content-Type': 'application/json', 'Accept': 'application/json',
                'X-Requested-With': 'XMLHttpRequest',
                ...(csrf ? { 'X-XSRF-TOKEN': csrf } : {})
            };
        }

        function showToast(msg) {
            const toast = document.getElementById('cart-toast');
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        function saveSelection() {
            sessionStorage.setItem(SESSION_KEY, JSON.stringify({
                color: document.querySelector('input[name="color"]:checked')?.value || null,
                size:  document.querySelector('input[name="size"]:checked')?.value  || null,
                qty:   document.getElementById('qty')?.value || '1'
            }));
        }

        function saveQty() {
            const saved = JSON.parse(sessionStorage.getItem(SESSION_KEY) || '{}');
            saved.qty = document.getElementById('qty')?.value || '1';
            sessionStorage.setItem(SESSION_KEY, JSON.stringify(saved));
        }

        function onSelectionChange() { saveSelection(); updateVariantInfo(); }

        // ── DESELECT khi click lại vào option đang được chọn ──
        document.addEventListener('DOMContentLoaded', function() {
            ['color', 'size'].forEach(name => {
                document.querySelectorAll(`label:has(input[type="radio"][name="${name}"])`)
                    .forEach(label => {
                        let wasChecked = false;
                        label.addEventListener('mousedown', function() {
                            const radio = this.querySelector('input[type="radio"]');
                            wasChecked = radio && radio.checked;
                        });
                        label.addEventListener('click', function() {
                            if (wasChecked) {
                                const radio = this.querySelector('input[type="radio"]');
                                if (radio) {
                                    radio.checked = false;
                                    onSelectionChange();
                                }
                            }
                        });
                    });
            });
        });

        function changeQty(delta) {
            const input = document.getElementById('qty');
            const val = Math.min(parseInt(input.max) || 99, Math.max(1, (parseInt(input.value) || 1) + delta));
            input.value = val;
            saveQty();
        }

        function updateCartBadge() {
            fetch('/cart/count', { headers: getSecurityHeaders(), credentials: 'same-origin' })
            .then(r => r.ok ? r.json() : { count: 0 })
            .then(data => {
                const badge = document.getElementById('cart-count');
                const sidebarCount = document.getElementById('cart-sidebar-count');
                if (badge) badge.textContent = data.count || 0;
                if (sidebarCount) sidebarCount.textContent = data.count || 0;
            }).catch(() => {});
        }

        function updateWishlistBadge() {
            fetch('/wishlist/count', { headers: getSecurityHeaders(), credentials: 'same-origin' })
            .then(r => r.ok ? r.json() : { count: 0 })
            .then(data => {
                const badge = document.getElementById('wishlist-count');
                if (badge) { badge.textContent = data.count || 0; badge.style.display = data.count > 0 ? 'flex' : 'none'; }
            }).catch(() => {});
        }

        function updateStockBadge(variantStock) {
            const badge = document.getElementById('stock-status-badge');
            const text  = document.getElementById('stock-status-text');
            if (!badge || !text) return;
            const stock = variantStock !== null && variantStock !== undefined
                ? variantStock
                : variantsData.reduce((sum, v) => sum + (v.stockQuantity || 0), 0);
            badge.classList.remove('in-stock', 'low-stock', 'out-stock');
            if (stock <= 0) {
                badge.classList.add('out-stock'); text.textContent = 'Hết hàng';
            } else if (stock <= 5) {
                badge.classList.add('low-stock'); text.textContent = `Sắp hết hàng — còn ${stock} sản phẩm`;
            } else {
                badge.classList.add('in-stock'); text.textContent = 'Còn hàng';
            }
        }

        // ── SYNC WISHLIST: dùng /wishlist/ids giống product-actions.js ──
        function syncWishlistIcon() {
            if (!productId) return;
            fetch('/wishlist/ids', {
                credentials: 'same-origin',
                cache: 'no-store'
            })
            .then(r => r.ok ? r.json() : [])
            .then(ids => {
                const svg = document.querySelector('.btn-wishlist svg');
                const inWishlist = Array.isArray(ids) && ids.map(Number).includes(parseInt(productId));
                if (svg) svg.setAttribute('fill', inWishlist ? '#000' : 'none');
            })
            .catch(() => {});
        }

        function initPage() {
            document.getElementById('selectedVariantId').value = '';
            const saved = JSON.parse(sessionStorage.getItem(SESSION_KEY) || '{}');
            if (saved.color) { const r = document.querySelector(`input[name="color"][value="${saved.color}"]`); if (r) r.checked = true; }
            if (saved.size)  { const r = document.querySelector(`input[name="size"][value="${saved.size}"]`);  if (r) r.checked = true; }
            if (saved.qty)   document.getElementById('qty').value = saved.qty;

            updateVariantInfo();
            syncWishlistIcon();
            updateCartBadge();
            updateWishlistBadge();

            if (document.querySelector('.review-alert.success')) {
                document.querySelector('.review-section')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }

        // DOMContentLoaded: load trang lần đầu
        document.addEventListener('DOMContentLoaded', initPage);

        // visibilitychange: bắn khi back từ trang khác về (kể cả bfcache)
        // Đây là event duy nhất hoạt động chắc chắn trên mọi browser khi back button
        document.addEventListener('visibilitychange', function() {
            if (document.visibilityState === 'visible') {
                syncWishlistIcon();
                updateWishlistBadge();
            }
        });

        function updateVariantInfo() {
            const colorRadios   = document.querySelectorAll('input[name="color"]');
            const sizeRadios    = document.querySelectorAll('input[name="size"]');
            const selectedColor = document.querySelector('input[name="color"]:checked')?.value;
            const selectedSize  = document.querySelector('input[name="size"]:checked')?.value;
            const variantIdInput = document.getElementById('selectedVariantId');
            const quantityInput  = document.getElementById('qty');
            const priceEl        = document.getElementById('product-price');
            const btnAdd         = document.getElementById('btn-add-cart');
            const btnBuy         = document.getElementById('btn-buy-now');

            variantIdInput.value = '';

            sizeRadios.forEach(radio => {
                const sizeVal = radio.value; const spanUI = radio.nextElementSibling;
                const ok = !selectedColor
                    ? variantsData.some(v => v.sizeValue.toLowerCase() === sizeVal.toLowerCase() && v.stockQuantity > 0)
                    : variantsData.some(v => v.color.toLowerCase() === selectedColor.toLowerCase() && v.sizeValue.toLowerCase() === sizeVal.toLowerCase() && v.stockQuantity > 0);
                radio.disabled = !ok; spanUI.classList.toggle('disabled-size', !ok);
                if (!ok && radio.checked) radio.checked = false;
            });

            colorRadios.forEach(radio => {
                const colorVal = radio.value; const spanUI = radio.nextElementSibling;
                const ok = !selectedSize
                    ? variantsData.some(v => v.color.toLowerCase() === colorVal.toLowerCase() && v.stockQuantity > 0)
                    : variantsData.some(v => v.color.toLowerCase() === colorVal.toLowerCase() && v.sizeValue.toLowerCase() === selectedSize.toLowerCase() && v.stockQuantity > 0);
                radio.disabled = !ok; spanUI.classList.toggle('disabled-size', !ok);
                if (!ok && radio.checked) radio.checked = false;
            });

            const finalColor = document.querySelector('input[name="color"]:checked')?.value;
            const finalSize  = document.querySelector('input[name="size"]:checked')?.value;

            if (finalColor && finalSize) {
                const matched = variantsData.find(v =>
                    v.color.toLowerCase() === finalColor.toLowerCase() &&
                    v.sizeValue.toLowerCase() === finalSize.toLowerCase()
                );
                if (matched && matched.stockQuantity > 0) {
                    variantIdInput.value = matched.id;
                    if (matched.retailPrice != null && priceEl) priceEl.innerText = matched.retailPrice.toLocaleString('vi-VN') + '₫';
                    quantityInput.max = matched.stockQuantity;
                    if (parseInt(quantityInput.value) > matched.stockQuantity) quantityInput.value = matched.stockQuantity;
                    btnAdd.classList.remove('disabled-action-btn');
                    btnBuy.classList.remove('disabled-action-btn');
                    updateStockBadge(matched.stockQuantity);
                    return;
                }
            }

            btnAdd.classList.add('disabled-action-btn');
            btnBuy.classList.add('disabled-action-btn');
            updateStockBadge(null);
        }

        function addToCart() {
            const variantId = document.getElementById('selectedVariantId').value;
            const quantity  = parseInt(document.getElementById('qty').value) || 1;
            if (!variantId) { showToast("Vui lòng chọn màu và size!"); return; }
            fetch('/cart/add', { method: 'POST', headers: getSecurityHeaders(), credentials: 'same-origin',
                body: JSON.stringify({ productId: parseInt(productId), variantId: parseInt(variantId), quantity }) })
            .then(res => { if (res.status === 401 || res.status === 403) { window.location.href = '/login'; throw new Error('Unauthorized'); } if (!res.ok) throw new Error('Error'); return res.json(); })
            .then(data => { if (data?.success) { updateCartBadge(); showToast(data.message || "Đã thêm vào giỏ hàng!"); } })
            .catch(err => { if (err.message !== 'Unauthorized') showToast("Lỗi hệ thống!"); });
        }

        function buyNow() {
            const variantId = document.getElementById('selectedVariantId').value;
            const quantity  = parseInt(cadocument.getElementById('qty').value) || 1;
            if (!variantId) { showToast("Vui lòng chọn màu và size!"); return; }
            fetch('/checkout/direct', { method: 'POST', headers: getSecurityHeaders(), credentials: 'same-origin',
                body: JSON.stringify({ variantId: parseInt(variantId), quantity }) })
            .then(res => { if (res.status === 401 || res.status === 403) { window.location.href = '/login'; throw new Error('Unauthorized'); } if (!res.ok) throw new Error('Error'); return res.json(); })
            .then(data => { if (data?.success) window.location.href = '/checkout/direct'; })
            .catch(err => { if (err.message !== 'Unauthorized') showToast("Lỗi hệ thống!"); });
        }

        function toggleWishlist(btn) {
            if (!productId) return;
            const svg = btn.querySelector('svg');
            fetch(`/wishlist/toggle/${productId}`, { method: 'POST', headers: getSecurityHeaders(), credentials: 'same-origin' })
            .then(res => { if (res.status === 401 || res.status === 403) { window.location.href = '/login'; throw new Error('Unauthorized'); } return res.json(); })
            .then(data => {
                if (data?.success) {
                    svg.setAttribute('fill', data.isAdded ? '#000' : 'none');
                    updateWishlistBadge();
                }
            })
            .catch(err => { if (err.message !== 'Unauthorized') console.error(err); });
        }
    </script>
</section>
</body>
</html>
