<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <title th:text="${pageTitle != null ? pageTitle : 'Sản phẩm'}">Products</title>
</head>
<body>
<div layout:fragment="content">
    <div class="row mb-4">
        <div class="col-md-12">
            <h1 class="fw-bold" th:text="${pageTitle}">Shop</h1>
            <hr>
        </div>
    </div>

    <div class="row">
        <div th:if="${products.isEmpty()}" class="col-12 text-center py-5">
            <i class="fas fa-search fa-4x text-muted mb-3"></i>
            <h3 class="text-muted">Không tìm thấy sản phẩm nào phù hợp.</h3>
            <a th:href="@{/products}" class="btn btn-outline-primary mt-3">Xem tất cả sản phẩm</a>
        </div>

        <div th:each="product : ${products.content}" class="col-lg-3 col-md-4 col-sm-6 mb-4">
            <div class="card h-100 border-0 shadow-sm product-card py-2">
                <a th:href="@{/products/{slug}(slug=${product.productSlug})}" class="text-decoration-none">
                    <img th:src="${product.imageUrl != null ? product.imageUrl : 'https://via.placeholder.com/300x300?text=No+Image'}"
                         class="card-img-top"
                         alt="Product"
                         style="height: 250px; object-fit: cover;">
                </a>
                <div class="card-body d-flex flex-column">
                    <h6 class="card-title">
                        <a th:href="@{/products/{slug}(slug=${product.productSlug})}"
                           class="text-decoration-none text-dark fw-bold text-truncate d-block"
                           th:text="${product.productName}">Product Name</a>
                    </h6>
                    <p class="text-muted small mb-2" th:text="${product.categoryName}">Category</p>
                    <p class="card-text text-danger fw-bold mb-3">
                        <span th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')} + ' ₫'"></span>
                    </p>

                    <div class="d-grid mt-auto">
                        <a th:if="${product.price > 0}"
                           th:href="@{/products/{slug}(slug=${product.productSlug})}"
                           class="btn btn-dark btn-sm rounded-pill">
                            <i class="fas fa-eye me-1"></i> Xem chi tiết
                        </a>
                        <span th:unless="${product.price > 0}" class="badge bg-secondary">Hết hàng</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <nav th:if="${products.totalPages > 1}" class="mt-5">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${products.first} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/products(page=${products.number - 1}, q=${keyword}, categoryId=${currentCategoryId})}">
                    <i class="fas fa-chevron-left"></i>
                </a>
            </li>

            <li class="page-item"
                th:each="pageNum : ${#numbers.sequence(0, products.totalPages - 1)}"
                th:classappend="${pageNum == products.number} ? 'active'">
                <a class="page-link"
                   th:href="@{/products(page=${pageNum}, q=${keyword}, categoryId=${currentCategoryId})}"
                   th:text="${pageNum + 1}">1</a>
            </li>

            <li class="page-item" th:classappend="${products.last} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/products(page=${products.number + 1}, q=${keyword}, categoryId=${currentCategoryId})}">
                    <i class="fas fa-chevron-right"></i>
                </a>
            </li>
        </ul>
    </nav>
</div>
</body>
</html>
