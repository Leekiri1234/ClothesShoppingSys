<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <title>Danh sách sản phẩm — MINIMAL</title>
    <!-- Thêm CSS cho phần sidebar và bộ lọc -->
    <style>
        .shop-container {
            display: flex;
            gap: 30px;
            margin-top: 20px;
        }

        /* Sidebar Styles */
        .shop-sidebar {
            width: 280px;
            flex-shrink: 0;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.05); /* Hiệu ứng chuyên nghiệp */
        }

        .filter-section {
            margin-bottom: 25px;
            border-bottom: 1px solid #f0f0f0;
            padding-bottom: 15px;
        }

        .filter-section:last-child {
            border-bottom: none;
        }

        .filter-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }

        /* Cây danh mục (Accordion) */
        .category-tree {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .category-tree li {
            margin-bottom: 8px;
        }

        .category-tree label {
            color: #555;
            display: flex;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
        }

        .category-tree label:hover {
            color: #000;
            font-weight: 500;
        }

        .category-tree input[type="checkbox"] {
            margin-right: 10px;
        }

        .category-tree .sub-categories {
            list-style: none;
            padding-left: 20px;
            margin-top: 5px;
            border-left: 1px dashed #ddd; /* Hiệu ứng dạng cây */
        }

        /* Filter Checkbox styles */
        .filter-checkbox-group label {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            cursor: pointer;
            color: #555;
            transition: color 0.2s ease;
        }

        .filter-checkbox-group label:hover {
            color: #000;
        }

        .filter-checkbox-group input[type="checkbox"] {
            margin-right: 10px;
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        /* Price Range */
        .price-inputs {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        .price-inputs input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            outline: none;
        }

        .price-inputs input:focus {
            border-color: #000;
        }

        .filter-btn {
            width: 100%;
            padding: 10px;
            background-color: #000;
            color: #fff;
            border: none;
            border-radius: 4px;
            margin-top: 15px;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.2s;
        }

        .filter-btn:hover {
            background-color: #333;
        }

        /* Main Content Styles */
        .shop-main {
            flex-grow: 1;
            position: relative;
        }

        .shop-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }

        .sort-select {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            outline: none;
            background-color: #fff;
            min-width: 150px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr); /* 4 cột như yêu cầu */
            gap: 30px 20px;
            transition: opacity 0.3s ease;
        }

        /* Loading Skeleton Overlay */
        .grid-loading {
            opacity: 0.4;
            pointer-events: none;
        }

        /* Badge Sale */
        .badge-sale {
            position: absolute;
            top: 10px;
            left: 10px;
            background: #e81c24;
            color: #fff;
            padding: 4px 8px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 2px;
            z-index: 2;
        }

        .product-card {
            position: relative;
        }

        @media (max-width: 1200px) {
            .product-grid { grid-template-columns: repeat(3, 1fr); }
        }

        @media (max-width: 991px) {
            .shop-container {
                flex-direction: column;
            }
            .shop-sidebar {
                width: 100%;
            }
            .product-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 576px) {
            .product-grid {
                grid-template-columns: repeat(1, 1fr);
            }
        }
    </style>
</head>
<body>
<main layout:fragment="content" class="container" style="padding-top: 120px; padding-bottom: 60px;">

    <div class="shop-container">
        <!-- SIDEBAR -->
        <aside class="shop-sidebar">
            <form id="filterForm" method="GET" th:action="@{/products}">

                <!-- Category Tree Accordion -->
                <div class="filter-section">
                    <div class="filter-title" data-bs-toggle="collapse" data-bs-target="#categoryCollapse" aria-expanded="true">
                        Danh mục <i class="fas fa-chevron-down"></i>
                    </div>
                    <div class="collapse show" id="categoryCollapse">
                        <ul class="category-tree">
                            <li th:each="cat : ${allCategories}">
                                <label>
                                    <input type="checkbox" name="categoryIds" class="filter-input"
                                           th:value="${cat.id}"
                                           th:checked="${currentCategoryIds != null and #lists.contains(currentCategoryIds, cat.id)}">
                                    <span th:text="${cat.name}"></span>
                                </label>
                                <ul class="sub-categories" th:if="${not #lists.isEmpty(cat.children)}">
                                    <li th:each="child : ${cat.children}">
                                        <label>
                                            <input type="checkbox" name="categoryIds" class="filter-input"
                                                   th:value="${child.id}"
                                                   th:checked="${currentCategoryIds != null and #lists.contains(currentCategoryIds, child.id)}">
                                            <span th:text="${child.name}"></span>
                                        </label>
                                    </li>
                                </ul>
                            </li>
                        </ul>
                    </div>
                </div>

                <!-- Price Range Filter -->
                <div class="filter-section">
                    <div class="filter-title">Khoảng giá</div>
                    <div class="price-inputs">
                        <input type="number" name="minPrice" id="minPrice" class="filter-input" placeholder="Tối thiểu" th:value="${searchRequest.minPrice}">
                        <span>-</span>
                        <input type="number" name="maxPrice" id="maxPrice" class="filter-input" placeholder="Tối đa" th:value="${searchRequest.maxPrice}">
                    </div>
                </div>

                <!-- Size Filter -->
                <div class="filter-section">
                    <div class="filter-title">Kích thước</div>
                    <div class="filter-checkbox-group">
                        <label>
                            <input type="checkbox" name="sizes" class="filter-input" value="S" th:checked="${searchRequest.sizes != null and #lists.contains(searchRequest.sizes, 'S')}"> Size S
                        </label>
                        <label>
                            <input type="checkbox" name="sizes" class="filter-input" value="M" th:checked="${searchRequest.sizes != null and #lists.contains(searchRequest.sizes, 'M')}"> Size M
                        </label>
                        <label>
                            <input type="checkbox" name="sizes" class="filter-input" value="L" th:checked="${searchRequest.sizes != null and #lists.contains(searchRequest.sizes, 'L')}"> Size L
                        </label>
                        <label>
                            <input type="checkbox" name="sizes" class="filter-input" value="XL" th:checked="${searchRequest.sizes != null and #lists.contains(searchRequest.sizes, 'XL')}"> Size XL
                        </label>
                    </div>
                </div>

                <!-- Color Filter -->
                <div class="filter-section">
                    <div class="filter-title">Màu sắc</div>
                    <div class="filter-checkbox-group">
                        <label>
                            <input type="checkbox" name="colors" class="filter-input" value="Black" th:checked="${searchRequest.colors != null and #lists.contains(searchRequest.colors, 'Black')}"> Đen
                        </label>
                        <label>
                            <input type="checkbox" name="colors" class="filter-input" value="White" th:checked="${searchRequest.colors != null and #lists.contains(searchRequest.colors, 'White')}"> Trắng
                        </label>
                        <label>
                            <input type="checkbox" name="colors" class="filter-input" value="Blue" th:checked="${searchRequest.colors != null and #lists.contains(searchRequest.colors, 'Blue')}"> Xanh
                        </label>
                        <label>
                            <input type="checkbox" name="colors" class="filter-input" value="Red" th:checked="${searchRequest.colors != null and #lists.contains(searchRequest.colors, 'Red')}"> Đỏ
                        </label>
                    </div>
                </div>

                <input type="hidden" name="keyword" th:value="${searchRequest.keyword}">

                <button type="button" class="filter-btn" style="background-color: #fff; color: #000; border: 1px solid #000; margin-top: 20px;" onclick="window.location.href=window.location.pathname">
                    XÓA BỘ LỌC
                </button>
            </form>
        </aside>

        <!-- MAIN CONTENT -->
        <div class="shop-main">
            <!-- Toolbar -->
            <div class="shop-toolbar">
                <h1 th:text="${pageTitle != null ? pageTitle : 'Tất cả sản phẩm'}" style="margin: 0; font-size: 24px;"></h1>
                <div class="shop-sort">
                    <span id="totalProductsCount" th:text="${products.totalElements} + ' sản phẩm'" style="margin-right: 15px; color: #666;"></span>
                    <select name="sort" class="sort-select filter-input" form="filterForm">
                        <option value="newest" th:selected="${searchRequest != null and searchRequest.sort == 'newest'}">Mới nhất</option>
                        <option value="price_asc" th:selected="${searchRequest != null and searchRequest.sort == 'price_asc'}">Giá: Thấp đến Cao</option>
                        <option value="price_desc" th:selected="${searchRequest != null and searchRequest.sort == 'price_desc'}">Giá: Cao đến Thấp</option>
                    </select>
                </div>
            </div>

            <!-- Product Grid -->
            <div id="productGridContainer">
                <div th:fragment="product-grid-fragment">
                    <div class="product-grid" th:if="${not #lists.isEmpty(products.content)}">
                        <article class="product-card" th:each="p : ${products.content}" th:data-product-id="${p.id != null ? p.id : p.productId}" th:data-product-slug="${p.slug != null ? p.slug : p.productSlug}">
                            <a th:href="@{/products/{slug}(slug=${p.slug != null ? p.slug : p.productSlug})}">
                                <div class="product-card-image" style="position: relative; overflow: hidden;">

                                    <!-- Badges -->
                                    <div class="badge-sale" th:if="${p.originalPrice != null and p.price != null and p.originalPrice > p.price}">
                                        <span th:text="'-' + ${#numbers.formatDecimal((p.originalPrice - p.price) / p.originalPrice * 100, 0, 0)} + '%'"></span>
                                    </div>

                                    <div class="product-card-actions" th:if="${#authorization.expression('isAuthenticated()')}">
                                        <!-- Wishlist Button -->
                                        <button class="product-card-action-btn wishlist-btn" th:data-product-id="${p.id != null ? p.id : p.productId}" onclick="event.stopPropagation(); event.preventDefault(); wishlistToggle(this, event)" title="Yêu thích">
                                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                                        </button>
                                        <!-- Quick View Button -->
                                        <button class="product-card-action-btn quick-view-btn" th:data-product-slug="${p.slug != null ? p.slug : p.productSlug}" onclick="event.stopPropagation(); event.preventDefault(); openQuickViewModal(this, event)" title="Xem nhanh">
                                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                                        </button>
                                        <!-- Quick Cart Button -->
                                        <button class="product-card-action-btn cart-btn"
                                                th:data-variant-id="${p.defaultVariantId}"
                                                onclick="event.stopPropagation(); event.preventDefault(); quickAddToCart(this, event)" title="Thêm vào giỏ">
                                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                                <circle cx="9" cy="21" r="1"/>
                                                <circle cx="20" cy="21" r="1"/>
                                                <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
                                            </svg>
                                        </button>
                                    </div>
                                    <img th:src="${p.thumbnail != null ? p.thumbnail : p.imageUrl}" th:alt="${p.name != null ? p.name : p.productName}" loading="lazy" style="width: 100%; aspect-ratio: 3/4; object-fit: cover; transition: transform 0.5s ease;">
                                </div>
                                <div class="product-card-info" style="margin-top: 15px;">
                                    <div class="product-card-brand" th:text="${p.categoryName != null ? p.categoryName : 'MINIMAL'}" style="color: #888; font-size: 12px; margin-bottom: 5px; text-transform: uppercase;">MINIMAL</div>
                                    <h3 class="product-card-name" th:text="${p.name != null ? p.name : p.productName}" style="font-size: 15px; margin: 0 0 8px 0; font-weight: 500; color: #333; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;"></h3>
                                    <div class="product-card-price" style="display: flex; align-items: center; gap: 8px;">
                                        <span class="product-price-current" th:text="${#numbers.formatDecimal(p.price ?: (p.minPrice ?: 0), 0, 'POINT', 0, 'COMMA')} + '₫'" style="font-weight: 600; color: #000; font-size: 16px;"></span>
                                        <span class="product-price-old" th:if="${p.originalPrice != null and p.price != null and p.originalPrice > p.price}" th:text="${#numbers.formatDecimal(p.originalPrice, 0, 'POINT', 0, 'COMMA')} + '₫'" style="text-decoration: line-through; color: #999; font-size: 14px;"></span>
                                    </div>
                                </div>
                            </a>
                        </article>
                    </div>

                    <!-- Pagination -->
                    <div th:if="${not #lists.isEmpty(products.content)}" th:replace="~{fragments/pagination :: pagination(page=${products})}"></div>

                    <!-- Handle Empty State -->
                    <div th:if="${#lists.isEmpty(products.content)}" style="text-align: center; padding: 50px 0; color: #777;">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" style="margin-bottom: 15px; opacity: 0.5;">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="12" y1="8" x2="12" y2="12"></line>
                            <line x1="12" y1="16" x2="12.01" y2="16"></line>
                        </svg>
                        <p>Không tìm thấy sản phẩm nào phù hợp với bộ lọc.</p>
                        <button type="button" onclick="window.location.href='/products'" class="filter-btn" style="width: auto; padding: 10px 25px; margin-top: 10px;">XÓA BỘ LỌC</button>
                    </div>

                    <!-- Hidden count to update toolbar -->
                    <input type="hidden" id="hidden-total-count" th:value="${products.totalElements}">
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const filterForm = document.getElementById('filterForm');
            const gridContainer = document.getElementById('productGridContainer');
            const inputs = document.querySelectorAll('.filter-input');
            let timeoutId = null;

            inputs.forEach(input => {
                input.addEventListener('change', function() {
                    // Cập nhật khi checkbox đổi hoặc input (type=number/select) đổi
                    clearTimeout(timeoutId);
                    timeoutId = setTimeout(() => {
                        applyFilters();
                    }, 500); // debounce 500ms
                });
                if(input.type === 'number') {
                    input.addEventListener('keyup', function() {
                        clearTimeout(timeoutId);
                        timeoutId = setTimeout(() => {
                            applyFilters();
                        }, 500);
                    });
                }
            });

            function applyFilters() {
                const formData = new FormData(filterForm);
                const searchParams = new URLSearchParams(formData);

                // Dọn dẹp URL bằng cách xóa các param trống
                for(const [key, value] of [...searchParams.entries()]) {
                    if (!value || value.trim() === '') {
                        searchParams.delete(key);
                    }
                }

                // Cập nhật URL không reload trang
                const newUrl = `${window.location.pathname}?${searchParams.toString()}`;
                window.history.pushState({path: newUrl}, '', newUrl);

                // Thêm skeleton loading (Opacity Fade)
                gridContainer.classList.add('grid-loading');

                // Gọi AJAX lấy Fragment HTML
                fetch(`/products/filter-ajax?${searchParams.toString()}`)
                    .then(response => response.text())
                    .then(html => {
                        gridContainer.innerHTML = html;
                        // Khôi phục sau 200ms để hiệu ứng mượt mà
                        setTimeout(() => gridContainer.classList.remove('grid-loading'), 200);

                        // Cập nhật tổng số kết quả
                        const hiddenCount = document.getElementById('hidden-total-count');
                        if (hiddenCount) {
                            document.getElementById('totalProductsCount').textContent = hiddenCount.value + ' sản phẩm';
                        }

                        attachHoverEffect(); // Gắn lại hiệu ứng cho các phần tử mới
                    })
                    .catch(error => {
                        console.error('Error fetching filtered products:', error);
                        gridContainer.classList.remove('grid-loading');
                    });
            }

            function attachHoverEffect() {
                document.querySelectorAll('.product-card').forEach(card => {
                    card.addEventListener('mouseenter', () => {
                        const img = card.querySelector('img');
                        if (img) img.style.transform = 'scale(1.05)';
                    });
                    card.addEventListener('mouseleave', () => {
                        const img = card.querySelector('img');
                        if (img) img.style.transform = 'scale(1)';
                    });
                });
            }

            attachHoverEffect();
        });
    </script>
</main>
</body>
</html>
