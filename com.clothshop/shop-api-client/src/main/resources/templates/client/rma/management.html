<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layouts/layout}">

<head>
    <title>Quản lý yêu cầu đổi trả</title>
    <th:block layout:fragment="styles">
        <link rel="stylesheet" href="/css/rma/management.css">
    </th:block>
</head>

<body>
    <main layout:fragment="content" class="rma-management-container">
        <!-- Alert Messages -->
        <div th:if="${successMessage}" class="alert-message alert-success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="alert-message alert-error" th:text="${errorMessage}"></div>

        <!-- Header -->
        <div class="section-header">
            <p class="eyebrow">Tài khoản của bạn</p>
            <h2>Quản lý yêu cầu đổi trả</h2>
        </div>

        <!-- Empty State -->
        <div th:if="${rmaRequests.empty}" class="empty-state">
            <div class="empty-state-icon">📋</div>
            <h3 class="empty-state-title">Không có yêu cầu đổi trả nào</h3>
            <p class="empty-state-text">Bạn chưa gửi yêu cầu đổi trả nào. Hãy quay lại phần đơn hàng để gửi yêu cầu.</p>
            <a href="/orders" class="rma-btn rma-btn-primary">Xem đơn hàng</a>
        </div>

        <!-- RMA List -->
        <div th:if="${!rmaRequests.empty}" class="rma-list">
            <div th:each="rma : ${rmaRequests.content}" class="rma-item" th:onclick="'window.location.href=\'/rma-management/' + ${rma.rmaId} + '\''">
                <!-- Placeholder Image -->
                <div class="rma-item-image">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                        <circle cx="8.5" cy="8.5" r="1.5"></circle>
                        <polyline points="21 15 16 10 5 21"></polyline>
                    </svg>
                </div>

                <div class="rma-item-content">
                    <!-- Header -->
                    <div class="rma-item-header">
                        <div>
                            <div class="rma-item-title" th:text="${'Đơn hàng ' + rma.orderInvoice}"></div>
                            <small style="color: #999; font-size: 12px;" th:text="${#temporals.format(rma.createdAt, 'dd/MM/yyyy')}"></small>
                        </div>
                        <span class="rma-status" th:classappend="${'rma-status-' + rma.status.toLowerCase()}" th:text="${rma.status == 'PENDING' ? 'CHỜ XỬ LÝ' : rma.status == 'APPROVED' ? 'ĐÃ PHÊ DUYỆT' : rma.status == 'REJECTED' ? 'BỊ TỪ CHỐI' : 'ĐANG XỬ LÝ'}"></span>
                    </div>

                    <!-- Meta Info -->
                    <div class="rma-item-meta">
                        <div>
                            <strong>Loại:</strong> <span th:text="${rma.rmaType == 'RETURN' ? 'Trả hàng' : 'Đổi hàng'}"></span>
                        </div>
                        <div th:if="${rma.refundAmount}">
                            <strong>Tiền hoàn:</strong> <span th:text="${#numbers.formatDecimal(rma.refundAmount, 0, 'POINT', 0, 'COMMA') + '₫'}"></span>
                        </div>
                    </div>

                    <!-- Reason -->
                    <div class="rma-item-reason">
                        <strong>Lý do:</strong> <span th:text="${rma.reason}"></span>
                    </div>

                    <!-- Actions -->
                    <div class="rma-item-actions">
                        <a th:href="@{/rma-management/{id}(id=${rma.rmaId})}" class="rma-btn rma-btn-primary" onclick="event.stopPropagation();">XEM CHI TIẾT</a>
                        <form th:if="${rma.status == 'PENDING'}" 
                            th:action="@{/rma-management/{id}/cancel(id=${rma.rmaId})}" 
                            method="post" 
                            onclick="event.stopPropagation(); return confirm('Bạn có chắc chắn muốn hủy yêu cầu này?');"
                            style="display: inline;">
                            <button type="submit" class="rma-btn rma-btn-danger">HỦY YÊU CẦU</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- Pagination -->
        <div th:if="${!rmaRequests.empty}" class="pagination">
            <a th:if="${rmaRequests.hasPrevious()}" th:href="@{/rma-management(page=${rmaRequests.number - 1}, size=${rmaRequests.size})}">← Trước</a>
            <span th:if="!${rmaRequests.hasPrevious()}" class="disabled">← Trước</span>

            <span th:each="p : ${#numbers.sequence(0, rmaRequests.totalPages - 1)}" th:if="${rmaRequests.totalPages <= 10}">
                <a th:if="${p != rmaRequests.number}" th:href="@{/rma-management(page=${p}, size=${rmaRequests.size})}" th:text="${p + 1}"></a>
                <span th:if="${p == rmaRequests.number}" class="active" th:text="${p + 1}"></span>
            </span>

            <a th:if="${rmaRequests.hasNext()}" th:href="@{/rma-management(page=${rmaRequests.number + 1}, size=${rmaRequests.size})}">Sau →</a>
            <span th:if="!${rmaRequests.hasNext()}" class="disabled">Sau →</span>
        </div>
    </main>
</body>

</html>
