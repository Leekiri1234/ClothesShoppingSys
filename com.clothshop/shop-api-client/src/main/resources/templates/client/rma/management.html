<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layouts/layout}">

<head>
    <title>Quản lý yêu cầu đổi trả</title>
    <th:block layout:fragment="styles">
        <style>
            .rma-management-container {
                max-width: 1000px;
                margin: 0 auto;
                padding: 60px 24px;
            }

            .section-header {
                margin-bottom: 40px;
            }

            .section-header .eyebrow {
                font-size: 12px;
                letter-spacing: 0.15em;
                text-transform: uppercase;
                color: #999;
                margin-bottom: 8px;
            }

            .section-header h2 {
                font-size: 42px;
                font-weight: 300;
                letter-spacing: 0.01em;
                margin-bottom: 8px;
            }

            .alert-message {
                padding: 16px;
                border-radius: 4px;
                margin-bottom: 24px;
                font-size: 14px;
            }

            .alert-success {
                background: #d4edda;
                color: #155724;
                border: 1px solid #c3e6cb;
            }

            .alert-error {
                background: #f8d7da;
                color: #721c24;
                border: 1px solid #f5c6cb;
            }

            .rma-list {
                display: flex;
                flex-direction: column;
                gap: 24px;
            }

            .rma-item {
                display: flex;
                gap: 20px;
                padding: 20px;
                border: 1px solid #e8e6e1;
                border-radius: 4px;
                background: #fafaf8;
                transition: all 0.3s ease;
                cursor: pointer;
            }

            .rma-item:hover {
                border-color: #c5a882;
                box-shadow: 0 4px 12px rgba(197, 168, 130, 0.1);
            }

            .rma-item-image {
                flex-shrink: 0;
                width: 100px;
                height: 120px;
                background: #eee;
                border-radius: 4px;
                overflow: hidden;
            }

            .rma-item-image img {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }

            .rma-item-content {
                flex: 1;
                display: flex;
                flex-direction: column;
                justify-content: space-between;
            }

            .rma-item-header {
                display: flex;
                justify-content: space-between;
                align-items: flex-start;
                margin-bottom: 12px;
            }

            .rma-item-title {
                font-size: 16px;
                font-weight: 500;
                color: #1c1c1a;
            }

            .rma-status {
                display: inline-block;
                padding: 6px 12px;
                border-radius: 20px;
                font-size: 11px;
                font-weight: 600;
                letter-spacing: 0.05em;
                text-transform: uppercase;
            }

            .rma-status.pending {
                background: #fff3cd;
                color: #856404;
            }

            .rma-status.approved {
                background: #d4edda;
                color: #155724;
            }

            .rma-status.rejected {
                background: #f8d7da;
                color: #721c24;
            }

            .rma-status.processing {
                background: #d1ecf1;
                color: #0c5460;
            }

            .rma-item-meta {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 12px;
                margin-bottom: 12px;
                font-size: 13px;
                color: #666;
            }

            .rma-item-reason {
                font-size: 13px;
                color: #888;
                margin-bottom: 12px;
                line-height: 1.5;
            }

            .rma-item-actions {
                display: flex;
                gap: 12px;
                align-items: center;
            }

            .rma-btn {
                padding: 8px 16px;
                font-size: 12px;
                border-radius: 4px;
                border: 1px solid;
                cursor: pointer;
                transition: all 0.3s ease;
                text-decoration: none;
                display: inline-block;
                letter-spacing: 0.05em;
            }

            .rma-btn-primary {
                background: #1c1c1a;
                color: white;
                border-color: #1c1c1a;
            }

            .rma-btn-primary:hover {
                background: #333;
                border-color: #333;
            }

            .rma-btn-danger {
                background: #c0392b;
                color: white;
                border-color: #c0392b;
            }

            .rma-btn-danger:hover {
                background: #a02622;
                border-color: #a02622;
            }

            .rma-btn-outline {
                background: transparent;
                color: #1c1c1a;
                border-color: #1c1c1a;
            }

            .rma-btn-outline:hover {
                background: #1c1c1a;
                color: white;
            }

            .empty-state {
                text-align: center;
                padding: 80px 24px;
            }

            .empty-state-icon {
                font-size: 64px;
                margin-bottom: 16px;
            }

            .empty-state-title {
                font-size: 20px;
                font-weight: 400;
                margin-bottom: 8px;
                color: #1c1c1a;
            }

            .empty-state-text {
                font-size: 14px;
                color: #666;
                margin-bottom: 24px;
            }

            .pagination {
                display: flex;
                justify-content: center;
                gap: 8px;
                margin-top: 40px;
            }

            .pagination a,
            .pagination span {
                padding: 8px 12px;
                border: 1px solid #e8e6e1;
                border-radius: 4px;
                text-decoration: none;
                color: #1c1c1a;
                font-size: 13px;
            }

            .pagination a:hover {
                background: #f5f5f5;
            }

            .pagination .active {
                background: #1c1c1a;
                color: white;
                border-color: #1c1c1a;
            }

            .pagination .disabled {
                opacity: 0.5;
                cursor: not-allowed;
            }
        </style>
    </th:block>
</head>

<body>
    <main layout:fragment="content" class="rma-management-container">
        <!-- Alert Messages -->
        <div th:if="${successMessage}" class="alert-message alert-success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="alert-message alert-error" th:text="${errorMessage}"></div>

        <!-- Header -->
        <div class="section-header">
            <p class="eyebrow">Tài khoản của bạn</p>
            <h2>Quản lý yêu cầu đổi trả</h2>
        </div>

        <!-- Empty State -->
        <div th:if="${rmaRequests.empty}" class="empty-state">
            <div class="empty-state-icon">📋</div>
            <h3 class="empty-state-title">Không có yêu cầu đổi trả nào</h3>
            <p class="empty-state-text">Bạn chưa gửi yêu cầu đổi trả nào. Hãy quay lại phần đơn hàng để gửi yêu cầu.</p>
            <a href="/orders" class="rma-btn rma-btn-primary">Xem đơn hàng</a>
        </div>

        <!-- RMA List -->
        <div th:if="${!rmaRequests.empty}" class="rma-list">
            <div th:each="rma : ${rmaRequests.content}" class="rma-item" th:onclick="'window.location.href=\'/rma-management/' + ${rma.rmaId} + '\''">
                <!-- Placeholder Image -->
                <div class="rma-item-image">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                        <circle cx="8.5" cy="8.5" r="1.5"></circle>
                        <polyline points="21 15 16 10 5 21"></polyline>
                    </svg>
                </div>

                <div class="rma-item-content">
                    <!-- Header -->
                    <div class="rma-item-header">
                        <div>
                            <div class="rma-item-title" th:text="${'Đơn hàng ' + rma.orderInvoice}"></div>
                            <small style="color: #999; font-size: 12px;" th:text="${#temporals.format(rma.createdAt, 'dd/MM/yyyy')}"></small>
                        </div>
                        <span class="rma-status" th:classappend="${'rma-status-' + rma.status.toLowerCase()}" th:text="${rma.status == 'PENDING' ? 'CHỜ XỬ LÝ' : rma.status == 'APPROVED' ? 'ĐÃ PHÊ DUYỆT' : rma.status == 'REJECTED' ? 'BỊ TỪ CHỐI' : 'ĐANG XỬ LÝ'}"></span>
                    </div>

                    <!-- Meta Info -->
                    <div class="rma-item-meta">
                        <div>
                            <strong>Loại:</strong> <span th:text="${rma.rmaType == 'RETURN' ? 'Trả hàng' : 'Đổi hàng'}"></span>
                        </div>
                        <div th:if="${rma.refundAmount}">
                            <strong>Tiền hoàn:</strong> <span th:text="${#numbers.formatDecimal(rma.refundAmount, 0, 'POINT', 0, 'COMMA') + '₫'}"></span>
                        </div>
                    </div>

                    <!-- Reason -->
                    <div class="rma-item-reason">
                        <strong>Lý do:</strong> <span th:text="${rma.reason}"></span>
                    </div>

                    <!-- Actions -->
                    <div class="rma-item-actions">
                        <a th:href="@{/rma-management/{id}(id=${rma.rmaId})}" class="rma-btn rma-btn-primary" onclick="event.stopPropagation();">XEM CHI TIẾT</a>
                        <form th:if="${rma.status == 'PENDING'}" 
                            th:action="@{/rma-management/{id}/cancel(id=${rma.rmaId})}" 
                            method="post" 
                            onclick="event.stopPropagation(); return confirm('Bạn có chắc chắn muốn hủy yêu cầu này?');"
                            style="display: inline;">
                            <button type="submit" class="rma-btn rma-btn-danger">HỦY YÊU CẦU</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- Pagination -->
        <div th:if="${!rmaRequests.empty}" class="pagination">
            <a th:if="${rmaRequests.hasPrevious()}" th:href="@{/rma-management(page=${rmaRequests.number - 1}, size=${rmaRequests.size})}">← Trước</a>
            <span th:if="!${rmaRequests.hasPrevious()}" class="disabled">← Trước</span>

            <span th:each="p : ${#numbers.sequence(0, rmaRequests.totalPages - 1)}" th:if="${rmaRequests.totalPages <= 10}">
                <a th:if="${p != rmaRequests.number}" th:href="@{/rma-management(page=${p}, size=${rmaRequests.size})}" th:text="${p + 1}"></a>
                <span th:if="${p == rmaRequests.number}" class="active" th:text="${p + 1}"></span>
            </span>

            <a th:if="${rmaRequests.hasNext()}" th:href="@{/rma-management(page=${rmaRequests.number + 1}, size=${rmaRequests.size})}">Sau →</a>
            <span th:if="!${rmaRequests.hasNext()}" class="disabled">Sau →</span>
        </div>
    </main>
</body>

</html>
