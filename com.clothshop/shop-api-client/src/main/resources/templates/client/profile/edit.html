<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <title>Cập nhật hồ sơ - MINIMAL</title>
    <link rel="stylesheet" th:href="@{/css/profile/profile-edit.css}">
</head>
<body>
<div layout:fragment="content">
    <section class="page" style="display: block; opacity: 1; visibility: visible;" id="page-profile-edit">
        <div class="container" style="padding-top: 40px; padding-bottom: 80px;">
            <div class="profile-layout">
                <aside class="profile-sidebar">
                    <div class="profile-avatar-wrap">
                        <div class="profile-avatar">
                            <div class="img-placeholder" style="width:72px;height:72px;font-size:24px;border-radius:50%" th:text="${#strings.substring(profile.fullName != null ? profile.fullName : profile.username, 0, 1)}">N</div>
                        </div>
                        <div class="profile-name" th:text="${profile.fullName}">Họ và tên</div>
                        <div class="profile-email" th:text="${profile.email}">email@example.com</div>
                    </div>
                    <nav class="profile-sidebar-nav">
                        <a th:href="@{/profile}" class="profile-sidebar-link active" style="text-decoration: none;">Thông tin tài khoản</a>
                        <a href="#" class="profile-sidebar-link" style="text-decoration: none;">Đơn hàng của tôi</a>
                        <a href="#" class="profile-sidebar-link" style="text-decoration: none;">Danh sách yêu thích</a>
                        <a href="#" class="profile-sidebar-link" style="text-decoration: none;">Đổi / Trả hàng</a>
                        <form th:action="@{/logout}" method="post" style="margin: 0;">
                            <button type="submit" class="profile-sidebar-link" style="color:#e63946; border: none; background: none; width: 100%; text-align: left; padding: 12px 16px; font-family: inherit; font-size: 14px; cursor: pointer;">Đăng xuất</button>
                        </form>
                    </nav>
                </aside>
                <div>
                    <div class="profile-section">
                        <div class="profile-section-header">
                            <h5>Cập nhật thông tin</h5>
                            <a th:href="@{/profile}" class="btn btn--ghost btn--sm" style="text-decoration: none;">Hủy</a>
                        </div>
                        
                        <div th:if="${param.error}" class="alert alert-danger" style="color: #c0392b; background: #fdf2f2; padding: 10px; border-radius: 4px; border: 1px solid #f5c6cb; margin-bottom: 16px; font-size: 14px;" role="alert">
                            Có lỗi xảy ra, vui lòng kiểm tra lại.
                        </div>

                        <form th:action="@{/profile/update}" method="post" th:object="${updateRequest}">
                            <div class="form-grid">
                                <div class="form-group">
                                    <label class="form-label">Tên đăng nhập (Chỉ đọc)</label>
                                    <input type="text" class="form-input" th:value="${profile.username}" readonly style="background-color: #f9f9f9; color: #999; border-color: #e8e8e8;">
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Email (Chỉ đọc)</label>
                                    <input type="email" class="form-input" th:value="${profile.email}" readonly style="background-color: #f9f9f9; color: #999; border-color: #e8e8e8;">
                                </div>
                                <div class="form-group full" style="grid-column: 1 / -1;">
                                    <label class="form-label">Họ và tên</label>
                                    <input type="text" class="form-input" th:field="*{fullName}" placeholder="Nhập họ và tên đầy đủ của bạn">
                                    <div th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}" style="color: #c0392b; font-size: 12px; margin-top: 4px;"></div>
                                </div>
                                <div class="form-group full" style="grid-column: 1 / -1;">
                                    <label class="form-label">Số điện thoại</label>
                                    <input type="tel" class="form-input" th:field="*{phone}" placeholder="Ví dụ: 0912345678">
                                    <div th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}" style="color: #c0392b; font-size: 12px; margin-top: 4px;"></div>
                                </div>
                                <div class="form-group full" style="grid-column: 1 / -1;">
                                    <label class="form-label">Địa chỉ</label>
                                    <input type="text" class="form-input" th:field="*{address}" placeholder="Ví dụ: 123 Lê Lợi, Quận 1, Tp. Hồ Chí Minh">
                                    <div th:if="${#fields.hasErrors('address')}" th:errors="*{address}" style="color: #c0392b; font-size: 12px; margin-top: 4px;"></div>
                                </div>
                            </div>
                            
                            <div style="margin-top:24px; display: flex; gap: 12px;">
                                <button type="submit" class="btn btn--primary" style="padding: 12px 32px">Lưu thay đổi</button>
                                <a th:href="@{/profile}" class="btn btn--outline" style="text-decoration: none; padding: 12px 32px; display: inline-flex; align-items: center; justify-content: center;">Quay lại</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>
</div>

<th:block layout:fragment="scripts">
    <script th:src="@{/js/profile/profile-edit.js}"></script>
</th:block>
</body>
</html>
