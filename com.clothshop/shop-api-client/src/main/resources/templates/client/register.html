<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký - MINIMAL</title>
    <link rel="stylesheet" th:href="@{/css/legacy-client.css}">
    <style>
        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            background: radial-gradient(circle at 18% 20%, #f1ece3 0, #f1ece3 20%, transparent 21%),
                        radial-gradient(circle at 84% 82%, #ede7dc 0, #ede7dc 22%, transparent 23%),
                        #fafaf8;
            padding: 20px;
        }

        .auth {
            width: 100%;
            max-width: 760px;
            background: #fff;
            border: 1px solid #e8e6e1;
            box-shadow: 0 28px 60px rgba(28, 28, 26, .08);
            padding: 30px 26px;
        }

        .brand {
            text-align: center;
            margin-bottom: 22px;
        }

        .brand h1 {
            margin: 0;
            font-size: 13px;
            letter-spacing: .28em;
        }

        .brand p {
            margin: 10px 0 0;
            font-size: 12px;
            letter-spacing: .1em;
            text-transform: uppercase;
            color: #6b6b67;
        }

        .alert {
            border: 1px solid #e9c3bc;
            background: #fff6f5;
            color: #9f2d21;
            font-size: 13px;
            padding: 10px 12px;
            margin-bottom: 12px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .field.full { grid-column: 1 / -1; }

        .field label {
            font-size: 12px;
            letter-spacing: .08em;
            text-transform: uppercase;
            color: #6b6b67;
        }

        .field input {
            width: 100%;
            border: 1px solid #e8e6e1;
            background: #fafaf8;
            color: #1c1c1a;
            padding: 10px 12px;
            font-size: 14px;
        }

        .field input:focus {
            outline: none;
            border-color: #c5a882;
            background: #fff;
        }

        .field input.invalid {
            border-color: #e59e92;
            background: #fff7f6;
        }

        .error-text {
            font-size: 12px;
            color: #b23a2d;
        }

        .hint {
            font-size: 12px;
            color: #8c8c88;
        }

        .terms {
            margin-top: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #6b6b67;
        }

        .terms input { accent-color: #1c1c1a; }

        .submit {
            margin-top: 16px;
            width: 100%;
            border: 1px solid #1c1c1a;
            background: #1c1c1a;
            color: #fff;
            padding: 12px;
            font-size: 12px;
            letter-spacing: .18em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all .25s ease;
        }

        .submit:hover {
            border-color: #c5a882;
            background: #c5a882;
        }

        .links {
            margin-top: 14px;
            text-align: center;
            color: #6b6b67;
            font-size: 13px;
        }

        .links a {
            color: #1c1c1a;
            text-decoration: none;
            border-bottom: 1px solid #d2d0ca;
        }

        @media (max-width: 700px) {
            .grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div class="auth">
    <div class="brand">
        <h1>MINIMAL</h1>
        <p>Create Account</p>
    </div>

    <div th:if="${error}" class="alert" th:text="${error}"></div>

    <form th:action="@{/register}" th:object="${registerRequest}" method="post" id="registrationForm">
        <div class="grid">
            <div class="field full">
                <label for="username">Username</label>
                <input id="username" th:field="*{username}" th:classappend="${#fields.hasErrors('username')} ? 'invalid' : ''" required>
                <div class="error-text" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                <div class="hint">3-50 ký tự, chỉ gồm chữ, số, dấu gạch dưới</div>
            </div>

            <div class="field">
                <label for="firstName">First Name</label>
                <input id="firstName" th:field="*{firstName}" th:classappend="${#fields.hasErrors('firstName')} ? 'invalid' : ''" required>
                <div class="error-text" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></div>
            </div>

            <div class="field">
                <label for="lastName">Last Name</label>
                <input id="lastName" th:field="*{lastName}" th:classappend="${#fields.hasErrors('lastName')} ? 'invalid' : ''" required>
                <div class="error-text" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></div>
            </div>

            <div class="field full">
                <label for="email">Email</label>
                <input id="email" type="email" th:field="*{email}" th:classappend="${#fields.hasErrors('email')} ? 'invalid' : ''" required>
                <div class="error-text" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>

            <div class="field full">
                <label for="phoneNumber">Phone Number</label>
                <input id="phoneNumber" th:field="*{phoneNumber}" th:classappend="${#fields.hasErrors('phoneNumber')} ? 'invalid' : ''" placeholder="+84901234567">
                <div class="error-text" th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}"></div>
            </div>

            <div class="field">
                <label for="password">Password</label>
                <input id="password" type="password" th:field="*{password}" th:classappend="${#fields.hasErrors('password')} ? 'invalid' : ''" required>
                <div class="error-text" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
            </div>

            <div class="field">
                <label for="confirmPassword">Confirm Password</label>
                <input id="confirmPassword" type="password" th:field="*{confirmPassword}" th:classappend="${#fields.hasErrors('confirmPassword')} ? 'invalid' : ''" required>
                <div class="error-text" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                <div class="error-text" id="passwordMismatch" style="display:none">Mật khẩu xác nhận chưa khớp</div>
            </div>
        </div>

        <label class="terms" for="acceptTerms">
            <input id="acceptTerms" type="checkbox" required>
            Tôi đồng ý với điều khoản sử dụng
        </label>

        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button class="submit" type="submit">Đăng ký</button>
    </form>

    <div class="links">
        Đã có tài khoản?
        <a th:href="@{/login}">Đăng nhập</a>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const form = document.getElementById('registrationForm');
        const password = document.getElementById('password');
        const confirmPassword = document.getElementById('confirmPassword');
        const mismatch = document.getElementById('passwordMismatch');

        function validatePasswordMatch() {
            if (!confirmPassword.value) {
                mismatch.style.display = 'none';
                confirmPassword.classList.remove('invalid');
                return true;
            }

            const ok = password.value === confirmPassword.value;
            mismatch.style.display = ok ? 'none' : 'block';
            confirmPassword.classList.toggle('invalid', !ok);
            return ok;
        }

        password.addEventListener('input', validatePasswordMatch);
        confirmPassword.addEventListener('input', validatePasswordMatch);

        form.addEventListener('submit', function (e) {
            if (!validatePasswordMatch()) {
                e.preventDefault();
            }
        });
    });
</script>
</body>
</html>
