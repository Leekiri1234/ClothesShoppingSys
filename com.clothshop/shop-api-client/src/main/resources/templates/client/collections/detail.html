<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <title>Chi tiet bo suu tap</title>
</head>
<body>
<section layout:fragment="content">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px;">
        <div>
            <p style="margin:0 0 6px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#8a877f;">Collection</p>
            <h2 style="margin:0;font-size:24px;font-weight:300;" th:text="${collection.name}">Ten bo suu tap</h2>
        </div>
        <a th:href="@{/collections}" style="text-decoration:none;border:1px solid #c5a882;padding:9px 12px;color:#1c1c1a;font-size:12px;letter-spacing:.1em;text-transform:uppercase;">Tat ca bo suu tap</a>
    </div>

    <div style="border:1px solid #ece9e2;background:#fff;padding:16px;margin-bottom:16px;">
        <p style="margin:0;color:#6b6b67;line-height:1.65;" th:text="${collection.description}">Mo ta bo suu tap.</p>
        <p style="margin:8px 0 0;color:#8a877f;font-size:12px;" th:text="${#lists.size(collection.products)} + ' san pham'">0 san pham</p>
    </div>

    <div th:if="${#lists.isEmpty(collection.products)}" style="border:1px dashed #d8d3c8;padding:14px;background:#fdfcf9;color:#6b6b67;">
        Bo suu tap hien chua co san pham dang ban.
    </div>

    <div th:if="${!#lists.isEmpty(collection.products)}" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;">
        <article th:each="item : ${collection.products}" style="border:1px solid #ece9e2;background:#fff;padding:12px;display:flex;flex-direction:column;">
            <div style="height:170px;background:#f5f3ef;margin-bottom:10px;display:flex;align-items:center;justify-content:center;overflow:hidden;">
                <img th:if="${item.thumbnail != null or item.imageUrl != null}" th:src="${item.thumbnail != null ? item.thumbnail : item.imageUrl}" th:alt="${item.name}" style="width:100%;height:100%;object-fit:cover;">
                <span th:if="${item.thumbnail == null and item.imageUrl == null}" style="font-size:12px;color:#8a877f;">Khong co anh</span>
            </div>
            <h3 style="margin:0 0 6px;font-size:15px;font-weight:500;" th:text="${item.name != null ? item.name : item.productName}">Ten san pham</h3>
            <p style="margin:0 0 8px;color:#8a877f;font-size:12px;" th:text="${item.categoryName}">Danh muc</p>
            <p style="margin:0 0 12px;font-weight:600;" th:text="${item.price} + ' VND'">0 VND</p>
            <a th:href="@{/products/{slug}(slug=${item.slug != null ? item.slug : item.productSlug})}" style="margin-top:auto;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#1c1c1a;">Xem chi tiet</a>
        </article>
    </div>
</section>
</body>
</html>
