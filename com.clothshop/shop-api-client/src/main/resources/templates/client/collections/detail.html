<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <title th:text="${collection.name} + ' — MINIMAL'"></title>
</head>
<body>
<main layout:fragment="content" class="container" style="padding-top: 120px; padding-bottom: 80px;">
    <div style="margin-bottom: 60px; text-align: center;">
        <h1 style="font-weight: 300; font-size: 42px; margin-bottom: 16px;" th:text="${collection.name}"></h1>
        <p style="color: #666; max-width: 600px; margin: 0 auto;" th:text="${collection.description}"></p>
    </div>

    <div th:if="${#lists.isEmpty(collection.products)}" style="text-align: center; padding: 80px 0;">
        <p style="color: #999;">Chưa có sản phẩm nào trong bộ sưu tập này.</p>
    </div>

    <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 30px;">
        <div th:each="p : ${collection.products}" class="product-item">
            <a th:href="@{/products/{slug}(slug=${p.productSlug})}" style="text-decoration: none; color: inherit;">
                <div style="background: #f5f5f5; aspect-ratio: 3/4; margin-bottom: 15px; overflow: hidden;">
                    <img th:src="${p.imageUrl}" style="width: 100%; height: 100%; object-fit: cover;">
                </div>
                <h3 style="font-size: 14px; font-weight: 400; margin-bottom: 8px;" th:text="${p.productName}"></h3>
                <p style="font-size: 14px; font-weight: 500;"
                   th:text="${#numbers.formatDecimal(p.price, 0, 'COMMA', 0, 'POINT') + '₫'}"></p>
            </a>
        </div>
    </div>
</main>
</body>
</html>
