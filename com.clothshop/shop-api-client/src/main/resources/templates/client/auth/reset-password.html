<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <title>Đặt lại mật khẩu - MINIMAL</title>
    <link rel="stylesheet" th:href="@{/css/auth/forgot-password.css}">
</head>
<body>
<div layout:fragment="content">
    <div class="auth-page">
      <div class="auth-box" style="padding: 32px 24px;">
        <div class="auth-logo" style="margin-bottom: 24px;">MINIMAL</div>
        
        <div style="text-align: center; margin-bottom: 24px;">
            <h4 style="font-weight: 400; font-size: 18px; margin-bottom: 8px;">Đặt lại mật khẩu</h4>
            <p style="color: #666; font-size: 14px; line-height: 1.5;">Vui lòng nhập mật khẩu mới của bạn bên dưới.</p>
        </div>

        <div th:if="${error}" class="alert alert-danger" style="color: #c0392b; background: #fdf2f2; padding: 10px; border-radius: 4px; border: 1px solid #f5c6cb; margin-bottom: 16px; font-size: 14px;" role="alert">
            <span th:text="${error}"></span>
        </div>
        
        <form id="reset-password-form" class="auth-form" th:action="@{/reset-password}" th:object="${resetPasswordRequest}" method="post">
          <input type="hidden" th:field="*{email}">
          
          <div class="form-group" style="margin-bottom: 16px;">
            <label class="form-label" for="newPassword">Mật khẩu mới <span style="color:red">*</span></label>
            <input type="password" class="form-input" id="newPassword" th:field="*{newPassword}" placeholder="Nhập ít nhất 8 ký tự" required>
            <div th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}" style="color: #c0392b; font-size: 12px; margin-top: 4px;">Error</div>
          </div>

          <div class="form-group" style="margin-bottom: 24px;">
            <label class="form-label" for="confirmPassword">Nhập lại mật khẩu mới <span style="color:red">*</span></label>
            <input type="password" class="form-input" id="confirmPassword" th:field="*{confirmPassword}" placeholder="Nhập lại mật khẩu mới" required>
            <div th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}" style="color: #c0392b; font-size: 12px; margin-top: 4px;">Error</div>
          </div>
          
          <button type="submit" class="btn btn--primary btn--full" style="margin-bottom: 16px;">Xác nhận đặt lại mật khẩu</button>
          
          <div style="text-align: center; font-size: 14px;">
            <a th:href="@{/login}" style="color: #333; text-decoration: underline;">Quay lại đăng nhập</a>
          </div>
          
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        </form>
      </div>
    </div>
</div>

<th:block layout:fragment="scripts">
    <script>
        // Form validation
        document.getElementById('reset-password-form').addEventListener('submit', function(e) {
            var newPw = document.getElementById('newPassword').value;
            var confirmPw = document.getElementById('confirmPassword').value;
            if(newPw !== confirmPw) {
                e.preventDefault();
                alert('Mật khẩu và xác nhận mật khẩu không khớp!');
            }
        });
    </script>
</th:block>
</html>
