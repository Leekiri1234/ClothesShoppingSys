<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <title>Khôi phục mật khẩu - MINIMAL</title>
</head>
<body>
<div layout:fragment="content">
    <div class="auth-page">
      <div class="auth-box" style="padding: 32px 24px;">
        <div class="auth-logo" style="margin-bottom: 24px;">MINIMAL</div>
        
        <div style="text-align: center; margin-bottom: 24px;">
            <h4 style="font-weight: 400; font-size: 18px; margin-bottom: 8px;">Quên mật khẩu?</h4>
            <p style="color: #666; font-size: 14px; line-height: 1.5;">Vui lòng nhập địa chỉ email của bạn. Chúng tôi sẽ gửi thông tin để đặt lại mật khẩu của bạn.</p>
        </div>

        <div th:if="${error}" class="alert alert-danger" style="color: #c0392b; background: #fdf2f2; padding: 10px; border-radius: 4px; border: 1px solid #f5c6cb; margin-bottom: 16px; font-size: 14px;" role="alert">
            <span th:text="${error}"></span>
        </div>
        
        <div th:if="${success}" class="alert alert-success" style="color: #27ae60; background: #e8f5e9; padding: 10px; border-radius: 4px; margin-bottom: 16px; font-size: 14px;" role="alert">
            <span th:text="${success}"></span>
        </div>

        <form id="forgot-password-form" class="auth-form" th:action="@{/forgot-password}" method="post">
          <div class="form-group" style="margin-bottom: 24px;">
            <label class="form-label" for="email">Email <span style="color:red">*</span></label>
            <input type="email" class="form-input" id="email" name="email" placeholder="email@example.com" required>
          </div>
          
          <button type="submit" class="btn btn--primary btn--full" style="margin-bottom: 16px;">Gửi yêu cầu</button>
          
          <div style="text-align: center; font-size: 14px;">
            <a th:href="@{/login}" style="color: #333; text-decoration: underline;">Quay lại đăng nhập</a>
          </div>
          
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        </form>
      </div>
    </div>
</div>
</body>
</html>
