<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <title>Đăng nhập - MINIMAL</title>
</head>
<body>
<div layout:fragment="content">
    <div class="auth-page">
      <div class="auth-box">
        <div class="auth-logo">MINIMAL</div>
        <div class="auth-tabs">
          <div class="auth-tab active">Đăng nhập</div>
          <a class="auth-tab" th:href="@{/register}" style="text-decoration: none; color: inherit;">Đăng ký</a>
        </div>

        <div th:if="${success}" class="alert alert-success" style="color: #27ae60; background: #e8f5e9; padding: 10px; border-radius: 4px; margin-bottom: 16px; font-size: 14px;" role="alert">
            <span th:text="${success}"></span>
        </div>
        <div th:if="${param.error}" class="alert alert-danger" style="color: #c0392b; background: #fdf2f2; padding: 10px; border-radius: 4px; border: 1px solid #f5c6cb; margin-bottom: 16px; font-size: 14px;" role="alert">
            Tên đăng nhập hoặc mật khẩu không hợp lệ.
        </div>
        <div th:if="${error}" class="alert alert-danger" style="color: #c0392b; background: #fdf2f2; padding: 10px; border-radius: 4px; border: 1px solid #f5c6cb; margin-bottom: 16px; font-size: 14px;" role="alert">
            <span th:text="${error}"></span>
        </div>
        <div th:if="${param.logout}" class="alert alert-success" style="color: #27ae60; background: #e8f5e9; padding: 10px; border-radius: 4px; margin-bottom: 16px; font-size: 14px;" role="alert">
            Bạn đã đăng xuất thành công.
        </div>
        <div th:if="${message}" class="alert alert-info" style="color: #2980b9; background: #e1f5fe; padding: 10px; border-radius: 4px; margin-bottom: 16px; font-size: 14px;" role="alert">
            <span th:text="${message}"></span>
        </div>

        <!-- Login Form -->
        <form id="login-form" class="auth-form" th:action="@{/login}" method="post">
          <div class="form-group">
            <label class="form-label" for="username">Tên đăng nhập / Email</label>
            <input type="text" class="form-input" id="username" name="username" placeholder="email@example.com" required>
          </div>
          <div class="form-group" style="position:relative">
            <label class="form-label" for="login-pass">Mật khẩu</label>
            <input type="password" class="form-input" id="login-pass" name="password" placeholder="••••••••" required>
            <span onclick="togglePasswordVisibility('login-pass', this)" style="position:absolute;right:12px;bottom:14px;cursor:pointer;color:#999;font-size:12px">hiện</span>
          </div>
          <div class="auth-form-footer" style="display:flex; justify-content: space-between; align-items: center; margin-bottom: 24px; font-size: 13px;">
            <label class="remember-me" style="display:flex; align-items: center; gap: 8px; cursor: pointer;">
                <input type="checkbox" name="remember-me"> Nhớ đăng nhập
            </label>
            <a th:href="@{/forgot-password}" class="forgot-link" style="color: #666; text-decoration:none">Quên mật khẩu?</a>
          </div>
          <button type="submit" class="btn btn--primary btn--full">Đăng nhập</button>
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        </form>
        
        <div class="auth-divider" style="text-align: center; margin: 24px 0; color: #999; font-size: 13px; position: relative;">
          <span style="background: #fff; padding: 0 16px; position: relative; z-index: 1;">hoặc</span>
          <div style="position: absolute; top: 50%; left: 0; right: 0; height: 1px; background: #e8e8e8; z-index: 0;"></div>
        </div>
        
        <div class="social-buttons" style="display: flex; flex-direction: column; gap: 12px;">
          <button class="social-btn" type="button" style="display: flex; align-items: center; justify-content: center; gap: 12px; padding: 12px; border: 1px solid #e8e8e8; background: #fff; border-radius: 4px; font-size: 14px; cursor: pointer; transition: background 0.2s;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="#4285F4"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z M5.84 14.1c-.22-.66-.35-1.36-.35-2.1s.13-1.44.35-2.1V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.83z M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
            Tiếp tục với Google
          </button>
          <button class="social-btn" type="button" style="display: flex; align-items: center; justify-content: center; gap: 12px; padding: 12px; border: 1px solid #e8e8e8; background: #fff; border-radius: 4px; font-size: 14px; cursor: pointer; transition: background 0.2s;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="#1877F2"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
            Tiếp tục với Facebook
          </button>
        </div>
      </div>
    </div>
    
    <script>
      function togglePasswordVisibility(id, el) {
        const input = document.getElementById(id);
        if (input.type === 'password') {
          input.type = 'text';
          el.innerText = 'ẩn';
        } else {
          input.type = 'password';
          el.innerText = 'hiện';
        }
      }
    </script>
</div>
</body>
</html>
