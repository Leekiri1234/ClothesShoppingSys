<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layouts/layout}">

<head>
    <title th:text="'Đánh giá sản phẩm ' + ${product.productName} + ' — MINIMAL'"></title>
    <th:block layout:fragment="styles">
        <link rel="stylesheet" th:href="@{/css/reviews/form.css}">
    </th:block>
</head>

<body>
    <main layout:fragment="content" class="container" style="padding-top: 120px; padding-bottom: 80px;">
        <div class="review-container">
            <a th:href="@{/products/{slug}(slug=${product.productSlug})}" style="font-size: 12px; color: #999; text-decoration: none;">← QUAY LẠI SẢN PHẨM</a>
            
            <h2 style="margin-top: 24px; font-weight: 300; margin-bottom: 40px;">Viết đánh giá</h2>

            <div style="display: flex; gap: 20px; margin-bottom: 40px; align-items: center;">
                <div style="width: 80px; height: 100px; background: #eee; flex-shrink: 0;">
                    <img th:src="${product.imageUrl}" style="width: 100%; height: 100%; object-fit: cover;">
                </div>
                <div>
                    <h4 th:text="${product.productName}" style="font-weight: 400; margin-bottom: 4px;"></h4>
                    <p style="font-size: 13px; color: #666;" th:text="${product.categoryName}"></p>
                </div>
            </div>

            <form th:action="@{/products/{id}/reviews(id=${product.productId})}" method="post">
                <div class="form-group">
                    <label class="form-label">Chọn số sao</label>
                    <div class="star-rating">
                        <input type="radio" id="star5" name="rating" value="5" required /><label for="star5">★</label>
                        <input type="radio" id="star4" name="rating" value="4" /><label for="star4">★</label>
                        <input type="radio" id="star3" name="rating" value="3" /><label for="star3">★</label>
                        <input type="radio" id="star2" name="rating" value="2" /><label for="star2">★</label>
                        <input type="radio" id="star1" name="rating" value="1" /><label for="star1">★</label>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Nhận xét</label>
                    <textarea name="comment" class="form-textarea" rows="6" placeholder="Chia sẻ cảm nhận của bạn về sản phẩm này..." required></textarea>
                </div>

                <div style="margin-top: 40px;">
                    <button type="submit" class="btn btn--primary" style="padding: 16px 40px; width: 100%;">Gửi đánh giá</button>
                    <a th:href="@{/products/{slug}(slug=${product.productSlug})}" style="display: block; text-align: center; margin-top: 20px; font-size: 14px; color: #666; text-decoration: none;">Hủy bỏ</a>
                </div>
            </form>
        </div>
    </main>
</body>

</html>
