<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
  <title>Chi tiết đơn hàng - ClothShop</title>
</head>
<body>
<div layout:fragment="content" class="container py-5">
  <div class="mb-4">
    <a th:href="@{/orders}" class="text-decoration-none text-muted"><i class="fas fa-arrow-left me-2"></i>Quay lại danh sách đơn hàng</a>
  </div>

  <div class="row g-4">
    <div class="col-lg-8">
      <div class="card shadow-sm border-0 mb-4">
        <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
          <h5 class="mb-0 fw-bold">Mã đơn: <span th:text="${order.orderInvoice}"></span></h5>
          <span class="badge fs-6"
                th:classappend="${order.status.name() == 'PENDING'} ? 'bg-warning text-dark' : (${order.status.name() == 'COMPLETED'} ? 'bg-success' : 'bg-info')"
                th:text="${order.status.displayName}">Status</span>
        </div>
        <div class="card-body">
          <div class="d-flex align-items-center mb-3 pb-3 border-bottom" th:each="item : ${order.items}">
            <img th:src="${item.imageUrl != null ? item.imageUrl : '/images/no-image.png'}" class="rounded me-3" style="width: 80px; height: 80px; object-fit: cover;">
            <div class="flex-grow-1">
              <h6 class="mb-1 fw-bold"><a th:href="@{/products/{slug}(slug=${item.productSlug})}" class="text-dark text-decoration-none" th:text="${item.productName}">Product</a></h6>
              <p class="text-muted small mb-1" th:text="${item.variantInfo}">Variant</p>
              <p class="mb-0 text-dark">Số lượng: <span class="fw-bold" th:text="${item.quantity}">1</span></p>
            </div>
            <div class="text-end">
              <strong class="text-danger" th:text="${#numbers.formatDecimal(item.unitPrice, 0, 'COMMA', 0, 'POINT')} + ' ₫'">Price</strong>
            </div>
          </div>

          <div class="text-end mt-3" th:if="${order.status.name() == 'PENDING'}">
            <button type="button" class="btn btn-danger" data-bs-toggle="modal" data-bs-target="#cancelModal">Hủy đơn hàng</button>
          </div>
          <div class="text-end mt-3" th:if="${order.status.name() == 'CANCELLED'}">
            <form th:action="@{/orders/{orderInvoice}/reorder(orderInvoice=${order.orderInvoice})}" method="post"
                  onsubmit="return confirm('Bạn muốn đặt lại đơn hàng này?')">
              <button type="submit" class="btn btn-primary">Đặt lại đơn hàng</button>
            </form>
          </div>

          <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>
          <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>
        </div>
      </div>

      <div class="card shadow-sm border-0">
        <div class="card-body p-4">
          <h5 class="fw-bold mb-4"><i class="fas fa-route me-2 text-primary"></i>Hành trình đơn hàng</h5>
          <div class="position-relative" style="border-left: 2px solid #dee2e6; margin-left: 10px; padding-left: 20px;">
            <div th:each="hist, iterStat : ${order.history}" class="mb-4 position-relative">
              <i class="fas fa-circle position-absolute"
                 th:classappend="${iterStat.first} ? 'text-primary' : 'text-muted'"
                 style="left: -27px; top: 2px; font-size: 12px; background: white;"></i>
              <h6 class="fw-bold mb-1" th:text="${hist.statusId.displayName}">Status</h6>
              <p class="text-muted small mb-1" th:text="${#temporals.format(hist.changedAt, 'dd/MM/yyyy HH:mm')}">Date</p>
              <p class="mb-0 text-dark" style="font-size: 0.9rem;" th:text="${hist.note}"></p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="col-lg-4">
      <div class="card shadow-sm border-0 mb-4">
        <div class="card-body p-4">
          <h5 class="fw-bold mb-3">Tóm tắt thanh toán</h5>
          <div class="d-flex justify-content-between mb-2">
            <span class="text-muted">Tiền hàng:</span>
            <span th:text="${#numbers.formatDecimal(order.totalAmount, 0, 'COMMA', 0, 'POINT')} + ' ₫'">0</span>
          </div>
          <div class="d-flex justify-content-between mb-3 text-success">
            <span>Giảm giá:</span>
            <span th:text="'- ' + ${#numbers.formatDecimal(order.discount, 0, 'COMMA', 0, 'POINT')} + ' ₫'">0</span>
          </div>
          <hr>
          <div class="d-flex justify-content-between">
            <span class="fw-bold">Tổng cộng:</span>
            <strong class="text-danger fs-5" th:text="${#numbers.formatDecimal(order.totalPrice, 0, 'COMMA', 0, 'POINT')} + ' ₫'">0</strong>
          </div>

          <div class="mt-4 p-3 bg-light rounded">
            <p class="mb-1 text-muted small">Phương thức thanh toán:</p>
            <strong class="text-dark" th:text="${order.paymentMethod}">COD</strong>
          </div>
        </div>
      </div>

      <div class="card shadow-sm border-0">
        <div class="card-body p-4">
          <h5 class="fw-bold mb-3"><i class="fas fa-map-marker-alt me-2 text-danger"></i>Địa chỉ nhận hàng</h5>
          <p class="mb-1 fw-bold" th:text="${profile != null ? profile.fullName : 'Khách hàng'}"></p>
          <p class="mb-1 text-muted"><i class="fas fa-phone-alt me-2 small"></i><span th:text="${order.customerPhone}">Phone</span></p>
          <p class="mb-0 text-muted"><i class="fas fa-map-pin me-2 small"></i><span th:text="${order.shippingAddress}">Address</span></p>
        </div>
      </div>
    </div>
  </div>

  <!-- Cancel Order Modal -->
  <div class="modal fade" id="cancelModal" tabindex="-1" aria-labelledby="cancelModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="cancelModalLabel">Lý do hủy đơn hàng</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form th:action="@{/orders/{orderInvoice}/cancel(orderInvoice=${order.orderInvoice})}" method="post" th:object="${cancelRequest}">
          <div class="modal-body">
            <input type="hidden" th:field="*{orderInvoice}" th:value="${order.orderInvoice}" />
            <div class="mb-3">
              <label class="form-label">Vui lòng nhập lý do hủy *</label>
              <textarea class="form-control" rows="3" th:field="*{reason}" required></textarea>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
            <button type="submit" class="btn btn-danger">Xác nhận hủy</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
</body>
</html>
