<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layouts/layout}">

<head>
    <title>Danh sách yêu thích</title>
    <th:block layout:fragment="styles">
        <link rel="stylesheet" th:href="@{/css/home.css}">
    </th:block>
</head>

<body>
    <section layout:fragment="content">
        <div class="container" style="padding: 40px 0;">
            <div class="section-header">
                <p class="eyebrow">Sưu tập của bạn</p>
                <h2>Danh sách yêu thích (<span th:text="${wishlist.totalItems}">0</span> sản phẩm)</h2>
            </div>

            <!-- Empty Wishlist State -->
            <div th:if="${wishlist.totalItems == 0}" style="text-align: center; padding: 80px 0;">
                <div style="font-size: 48px; margin-bottom: 16px;">♡</div>
                <h4 style="font-size: 20px; margin-bottom: 8px;">Danh sách yêu thích trống</h4>
                <p style="color: #666; margin-bottom: 24px;">Thêm các sản phẩm yêu thích của bạn để tìm chúng dễ dàng hơn</p>
                <a class="btn btn--primary" th:href="@{/products}">Khám phá sản phẩm</a>
            </div>

            <!-- Wishlist Grid -->
            <div class="product-grid" th:if="${wishlist.totalItems > 0}">
                <article class="product-card wishlist-card" th:each="item : ${wishlist.items}" 
                    th:data-product-id="${item.productId}" th:data-item-id="${item.itemId}">
                    <a th:href="@{/products/{slug}(slug=${item.productSlug})}">
                        <div class="product-card-image">
                            <div class="product-card-actions">
                                <!-- Wishlist Remove Button -->
                                <button class="product-card-action-btn wishlist-btn active" 
                                    th:data-product-id="${item.productId}" 
                                    onclick="event.stopPropagation(); wishlistToggle(this, event); removeWishlistCard(this);" 
                                    title="Bỏ yêu thích">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.5">
                                        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                                    </svg>
                                </button>
                                <!-- Quick View Button -->
                                <button class="product-card-action-btn quick-view-btn" 
                                    th:data-product-slug="${item.productSlug}" 
                                    onclick="event.stopPropagation(); openQuickViewModal(this, event)" 
                                    title="Xem nhanh">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                                    </svg>
                                </button>
                                <!-- Quick Cart Button -->
                                <button class="product-card-action-btn cart-btn" 
                                    th:data-product-id="${item.productId}" 
                                    onclick="event.stopPropagation(); quickAddToCart(this, event)" 
                                    title="Thêm vào giỏ">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                        <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/>
                                    </svg>
                                </button>
                            </div>
                            <img th:if="${item.thumbnail != null}" 
                                th:src="${item.thumbnail}" 
                                th:alt="${item.productName}" 
                                loading="lazy"
                                style="width: 100%; height: 100%; object-fit: cover;">
                            <div class="img-placeholder" th:if="${item.thumbnail == null}">NO IMAGE</div>
                        </div>
                        <div class="product-card-info">
                            <div class="product-card-brand" th:text="${item.categoryName != null ? item.categoryName : 'MINIMAL'}">MINIMAL</div>
                            <div class="product-card-name" th:text="${item.productName}">Tên sản phẩm</div>
                            <div class="product-card-price">
                                <span class="product-price-current" 
                                    th:text="${#numbers.formatDecimal(item.price, 0, 'POINT', 0, 'COMMA')} + '₫'">0₫</span>
                            </div>
                        </div>
                    </a>
                </article>
            </div>
        </div>

        <!-- Quick View Modal -->
        <div id="quick-view-modal" class="quick-view-modal" style="display: none;">
            <div class="modal-overlay" onclick="closeQuickViewModal()"></div>
            <div class="modal-content">
                <button class="modal-close" onclick="closeQuickViewModal()">✕</button>
                
                <div class="modal-inner">
                    <!-- Product Image -->
                    <div class="modal-image-section" id="modal-image-section">
                        <div id="modal-image" class="modal-image img-placeholder">Loading...</div>
                    </div>

                    <!-- Product Info -->
                    <div class="modal-info-section">
                        <h2 id="modal-name">Product Name</h2>
                        <div id="modal-price" style="font-size: 20px; font-weight: 600; margin-bottom: 16px; color: #1C1C1A;">0₫</div>
                        
                        <!-- Variants Section -->
                        <div class="variants-section" style="margin-bottom: 20px;">
                            <div style="margin-bottom: 12px;">
                                <label style="font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: #999;">Màu sắc</label>
                                <div id="modal-colors" style="display: flex; gap: 8px; margin-top: 8px;"></div>
                            </div>
                            
                            <div style="margin-bottom: 12px;">
                                <label style="font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: #999;">Kích cỡ</label>
                                <div id="modal-sizes" style="display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap;"></div>
                            </div>

                            <div style="display: flex; align-items: center; gap: 12px;">
                                <label style="font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: #999; flex: 0 0 50px;">Số lượng</label>
                                <div style="display: flex; align-items: center; gap: 8px; border: 1px solid #e8e8e8; border-radius: 4px; padding: 0 8px;">
                                    <button onclick="decreaseModalQty()" style="background: none; border: none; cursor: pointer; padding: 6px;">−</button>
                                    <input id="modal-qty" type="number" value="1" min="1" max="10" style="width: 40px; text-align: center; border: none; outline: none;">
                                    <button onclick="increaseModalQty()" style="background: none; border: none; cursor: pointer; padding: 6px;">+</button>
                                </div>
                            </div>
                        </div>

                        <!-- Action Buttons -->
                        <div style="display: flex; gap: 12px; margin-bottom: 16px;">
                            <button class="btn btn--primary" style="flex: 1;" onclick="addModalToCart()">Thêm vào giỏ</button>
                            <button class="btn btn--outline" style="flex: 1;" onclick="closeQuickViewModal()">Xem chi tiết</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <style>
            .quick-view-modal {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                z-index: 1000;
            }

            .quick-view-modal .modal-overlay {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.4);
                cursor: pointer;
            }

            .quick-view-modal .modal-content {
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                background: white;
                border-radius: 8px;
                width: 90%;
                max-width: 800px;
                max-height: 90vh;
                overflow-y: auto;
                box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            }

            .quick-view-modal .modal-close {
                position: absolute;
                top: 12px;
                right: 16px;
                background: none;
                border: none;
                font-size: 24px;
                cursor: pointer;
                color: #999;
                z-index: 10;
            }

            .quick-view-modal .modal-inner {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 24px;
                padding: 32px;
            }

            .quick-view-modal .modal-image-section {
                display: flex;
                align-items: center;
                justify-content: center;
                background: #f5f5f5;
                border-radius: 4px;
                min-height: 400px;
            }

            .quick-view-modal .modal-image {
                width: 100%;
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .product-card .product-card-actions {
                position: absolute;
                top: 12px;
                right: 12px;
                display: flex;
                flex-direction: column;
                gap: 8px;
                z-index: 10;
                opacity: 0;
                transform: translateX(20px);
                transition: all 0.3s ease;
            }

            .product-card:hover .product-card-actions {
                opacity: 1;
                transform: translateX(0);
            }

            .product-card-action-btn {
                width: 36px;
                height: 36px;
                border-radius: 4px;
                background: white;
                border: 1px solid #e8e8e8;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                transition: all 0.2s ease;
                color: #1C1C1A;
            }

            .product-card-action-btn:hover {
                background: #f5f5f5;
                border-color: #ccc;
            }

            .product-card-action-btn.active {
                background: #1C1C1A;
                border-color: #1C1C1A;
                color: white;
                fill: white;
            }

            @media (max-width: 640px) {
                .quick-view-modal .modal-inner {
                    grid-template-columns: 1fr;
                    gap: 16px;
                    padding: 20px;
                }
            }
        </style>

        <script>
            function removeWishlistCard(button) {
                const card = button.closest('.wishlist-card');
                if (card) {
                    setTimeout(() => {
                        card.style.opacity = '0';
                        card.style.transform = 'scale(0.95)';
                        setTimeout(() => card.remove(), 300);
                    }, 200);
                }
            }

            function decreaseModalQty() {
                const input = document.getElementById('modal-qty');
                input.value = Math.max(1, parseInt(input.value) - 1);
            }

            function increaseModalQty() {
                const input = document.getElementById('modal-qty');
                input.value = Math.min(10, parseInt(input.value) + 1);
            }

            function addModalToCart() {
                const productId = document.getElementById('modal-image-section').dataset.productId;
                if (!productId) {
                    showToast('Vui lòng chọn sản phẩm', 'error');
                    return;
                }
                fetch('/cart/add', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRF-TOKEN': document.querySelector('meta[name="_csrf"]')?.content || ''
                    },
                    body: JSON.stringify({
                        variantId: 1, // Simplified: use default variant ID
                        quantity: parseInt(document.getElementById('modal-qty').value)
                    })
                })
                .then(r => r.json())
                .then(data => {
                    if (data.success) {
                        showToast(data.message, 'success');
                        closeQuickViewModal();
                    }
                })
                .catch(e => showToast('Có lỗi xảy ra', 'error'));
            }

            function closeQuickViewModal() {
                document.getElementById('quick-view-modal').style.display = 'none';
            }

            function showToast(msg, type) {
                const toast = document.createElement('div');
                toast.className = `toast ${type}`;
                toast.textContent = msg;
                toast.style.cssText = 'position:fixed;bottom:20px;right:20px;padding:12px 16px;background:#1C1C1A;color:white;border-radius:4px;z-index:9999;animation:slideIn 0.3s ease';
                document.body.appendChild(toast);
                setTimeout(() => toast.remove(), 3000);
            }
        </script>
    </section>
</body>

</html>
