<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <title>Virtual Try-On</title>
    <!-- Add page-specific styles -->
    <th:block layout:fragment="styles">
        <link rel="stylesheet" th:href="@{/css/try-on.css}">
    </th:block>
</head>
<body>
<div layout:fragment="content">
    <div class="virtual-tryon" th:if="${tryOnProducts != null}" style="max-width: 1200px; margin: 0 auto; padding: 40px 5%;">
        <div style="margin-bottom:32px;">
            <h2 style="font-size:28px;font-weight:400;letter-spacing:1px;margin-bottom:12px;color:#333;">Virtual Try-On</h2>
            <p style="color:#666;font-size:15px">Thử đồ ảo với AI — Chọn quần áo bên trái và tải ảnh cá nhân lên để xem kết quả</p>
        </div>
        
        <div class="tryon-layout-new">
            <!-- Left: Clothing catalog -->
            <div class="tryon-catalog">
                <h5 style="margin-bottom:12px;font-size:12px;letter-spacing:2px;text-transform:uppercase">Chọn sản phẩm để thử</h5>
                <div class="tryon-catalog-grid" id="tryon-items">
                    <!-- Iterate through products -->
                    <div th:each="product, status : ${tryOnProducts}" 
                         class="tryon-catalog-item"
                         th:classappend="${status.index == 0} ? 'selected' : ''"
                         th:attr="onclick='selectTryOnItem(this, ' + ${product.id != null ? product.id : product.productId} + ')'"
                         th:data-product-id="${product.id != null ? product.id : product.productId}">
                        <div class="img-placeholder" style="aspect-ratio:3/4; overflow:hidden; background-color:#f8f8f8; border-radius: 4px;">
                            <img th:if="${product.imageUrl != null}" th:src="${product.imageUrl}" style="width:100%;height:100%;object-fit:cover;" alt="Product">
                            <img th:unless="${product.imageUrl != null}" src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=400&q=80" style="width:100%;height:100%;object-fit:cover;" alt="Mẫu áo">
                        </div>
                        <div class="tryon-item-info">
                            <h4 th:text="${product.productName}">Tên Sản Phẩm</h4>
                            <p th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')} + '₫'">Giá</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right: Input + Result -->
            <div class="tryon-main">
                <div class="tryon-input-section">
                    <div class="tryon-input-buttons">
                        <button class="btn btn--outline btn--sm" onclick="startCamera()" id="tryon-camera-btn">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
                            Chụp ảnh
                        </button>
                        <button class="btn btn--outline btn--sm" onclick="document.getElementById('tryon-file').click()">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="16 16 12 12 8 16"/><line x1="12" y1="12" x2="12" y2="21"/><path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/></svg>
                            Tải ảnh lên
                        </button>
                        <input type="file" id="tryon-file" accept="image/*" style="display:none" onchange="handleTryOnUpload(event)">
                    </div>
                    <img id="user-image-preview" style="display:none;width:100%;max-height:400px;object-fit:contain;background:#f5f5f5;border-radius:8px;border:1px solid #e8e8e8;" />
                    <video id="tryon-video" style="display:none;width:100%;max-height:400px;object-fit:cover;background:#000;border-radius:8px;border:1px solid #e8e8e8" autoplay playsinline></video>
                    <canvas id="tryon-canvas" style="display:none"></canvas>
                </div>
                
                <div class="tryon-result-section">
                    <h5 style="margin-bottom:12px;font-size:12px;letter-spacing:2px;text-transform:uppercase">Kết quả thử đồ</h5>
                    <div class="tryon-preview-image img-placeholder" style="display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px" id="tryon-preview">
                        <!-- Loading or Placeholder SVG -->
                        <div id="tryon-result-placeholder">
                            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#ccc" stroke-width="1"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                            <div style="font-size:12px;color:#ccc;letter-spacing:1px;margin-top:8px">Kết quả sẽ hiện ở đây</div>
                        </div>
                    </div>
                    <div class="tryon-actions">
                        <button class="btn btn--primary btn--full" id="tryon-submit-btn" onclick="processTryOn()">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 3l14 9-14 9V3z"/></svg>
                            Thử ngay
                        </button>
                        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
                            <button class="btn btn--ghost btn--sm" onclick="saveTryOnImage()">Lưu ảnh</button>
                            <button class="btn btn--ghost btn--sm" onclick="shareTryOnImage()">Chia sẻ</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div th:if="${tryOnProducts == null or #lists.isEmpty(tryOnProducts)}" style="text-align:center; padding:50px;">
        <p>Không có sản phẩm nào khả dụng để thử.</p>
    </div>
</div>

<th:block layout:fragment="scripts">
    <script th:inline="javascript">
        // CSRF tokens config for Ajax requests
        const csrfToken = /*[[${_csrf != null ? _csrf.token : ''}]]*/ '';
        const csrfHeader = /*[[${_csrf != null ? _csrf.headerName : ''}]]*/ '';
    </script>
    <script th:src="@{/js/try-on.js}"></script>
</th:block>
</body>
</html>
