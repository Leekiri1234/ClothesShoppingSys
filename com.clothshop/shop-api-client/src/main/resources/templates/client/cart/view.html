<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
  <title>Giỏ hàng của bạn - ClothShop</title>
</head>
<body>
<div layout:fragment="content" class="container py-5">
  <h2 class="fw-bold mb-4">Giỏ hàng của bạn</h2>

  <div th:if="${#lists.isEmpty(cart.items)}" class="text-center py-5">
    <i class="fas fa-shopping-cart fa-4x text-muted mb-3"></i>
    <h4 class="text-muted">Giỏ hàng đang trống</h4>
    <p class="text-muted mb-4">Bạn chưa chọn sản phẩm nào vào giỏ hàng.</p>
    <a th:href="@{/products}" class="btn btn-dark px-4 py-2">Tiếp tục mua sắm</a>
  </div>

  <div th:if="${!#lists.isEmpty(cart.items)}" class="row g-4">
    <div class="col-lg-8">
      <div class="card shadow-sm border-0 mb-3" th:each="item : ${cart.items}">
        <div class="card-body p-3">
          <div class="row align-items-center">
            <div class="col-3 col-md-2">
              <a th:href="@{/products/{slug}(slug=${item.productSlug})}">
                <img th:src="${item.imageUrl}" class="img-fluid rounded" alt="Product">
              </a>
            </div>
            <div class="col-9 col-md-4">
              <h6 class="fw-bold mb-1">
                <a th:href="@{/products/{slug}(slug=${item.productSlug})}" class="text-dark text-decoration-none" th:text="${item.productName}">Name</a>
              </h6>
              <p class="text-muted small mb-1" th:text="${item.colorName + ' | Size: ' + item.sizeName}">Color | Size</p>
              <p class="text-danger fw-bold mb-0" th:text="${#numbers.formatDecimal(item.price, 0, 'COMMA', 0, 'POINT')} + ' ₫'">Price</p>
            </div>
            <div class="col-6 col-md-3 mt-3 mt-md-0">
              <form th:action="@{/cart/update/{id}(id=${item.cartItemId})}" method="post" class="d-flex align-items-center">
                <input type="number" name="quantity" class="form-control form-control-sm text-center me-2"
                       th:value="${item.quantity}" min="1" th:max="${item.maxStock}" onchange="this.form.submit()">
                <small class="text-muted d-block w-100" style="font-size: 0.7rem;" th:if="${item.maxStock < 10}">Còn [[${item.maxStock}]] sp</small>
              </form>
            </div>
            <div class="col-6 col-md-2 mt-3 mt-md-0 text-end">
              <strong th:text="${#numbers.formatDecimal(item.subtotal, 0, 'COMMA', 0, 'POINT')} + ' ₫'">Subtotal</strong>
            </div>
            <div class="col-12 col-md-1 mt-3 mt-md-0 text-end text-md-center">
              <form th:action="@{/cart/remove/{id}(id=${item.cartItemId})}" method="post">
                <button type="submit" class="btn btn-link text-danger p-0" title="Xóa" onclick="return confirm('Bạn muốn xóa sản phẩm này?');">
                  <i class="fas fa-trash-alt"></i>
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="col-lg-4">
      <div class="card shadow-sm border-0 sticky-top" style="top: 20px;">
        <div class="card-body p-4">
          <h5 class="fw-bold mb-4">Tổng thanh toán</h5>
          <div class="d-flex justify-content-between mb-2">
            <span class="text-muted">Tổng số lượng:</span>
            <span th:text="${cart.totalItems} + ' sản phẩm'">0</span>
          </div>
          <div class="d-flex justify-content-between mb-4">
            <span class="text-muted">Tạm tính:</span>
            <strong class="text-danger fs-5" th:text="${#numbers.formatDecimal(cart.totalAmount, 0, 'COMMA', 0, 'POINT')} + ' ₫'">0 ₫</strong>
          </div>
          <a th:href="@{/checkout}" class="btn btn-dark w-100 py-2 mb-2">Tiến hành đặt hàng</a>
          <a th:href="@{/products}" class="btn btn-outline-secondary w-100 py-2">Tiếp tục mua sắm</a>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
