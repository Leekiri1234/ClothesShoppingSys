<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - MINIMAL</title>
    <link rel="stylesheet" th:href="@{/css/legacy-client.css}">
    <style>
        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            background: radial-gradient(circle at 85% 15%, #f2ece1 0, #f2ece1 18%, transparent 19%),
                        radial-gradient(circle at 12% 80%, #efe8dd 0, #efe8dd 20%, transparent 21%),
                        #fafaf8;
            padding: 20px;
        }

        .auth {
            width: 100%;
            max-width: 440px;
            background: #fff;
            border: 1px solid #e8e6e1;
            box-shadow: 0 28px 60px rgba(28, 28, 26, .08);
            padding: 34px 28px;
        }

        .brand {
            text-align: center;
            margin-bottom: 22px;
        }

        .brand h1 {
            margin: 0;
            font-size: 13px;
            letter-spacing: .28em;
        }

        .brand p {
            margin: 10px 0 0;
            font-size: 12px;
            letter-spacing: .1em;
            color: #6b6b67;
            text-transform: uppercase;
        }

        .alert {
            border: 1px solid;
            font-size: 13px;
            padding: 10px 12px;
            margin-bottom: 12px;
        }

        .alert.error { border-color: #e9c3bc; background: #fff6f5; color: #9f2d21; }
        .alert.success { border-color: #cbe6d0; background: #f5fff7; color: #2f7a39; }
        .alert.info { border-color: #b9d6f5; background: #f5faff; color: #2f5f9f; }

        .field { margin-bottom: 14px; }

        .field label {
            display: block;
            margin-bottom: 6px;
            font-size: 12px;
            letter-spacing: .08em;
            text-transform: uppercase;
            color: #6b6b67;
        }

        .field input {
            width: 100%;
            border: 1px solid #e8e6e1;
            background: #fafaf8;
            color: #1c1c1a;
            padding: 10px 12px;
            font-size: 14px;
        }

        .field input:focus {
            outline: none;
            border-color: #c5a882;
            background: #fff;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 8px 0 18px;
            font-size: 13px;
            color: #6b6b67;
        }

        .remember input { accent-color: #1c1c1a; }

        .submit {
            width: 100%;
            border: 1px solid #1c1c1a;
            background: #1c1c1a;
            color: #fff;
            padding: 12px;
            font-size: 12px;
            letter-spacing: .18em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all .25s ease;
        }

        .submit:hover {
            background: #c5a882;
            border-color: #c5a882;
        }

        .links {
            margin-top: 16px;
            text-align: center;
            font-size: 13px;
            color: #6b6b67;
        }

        .links a {
            color: #1c1c1a;
            text-decoration: none;
            border-bottom: 1px solid #d2d0ca;
        }
    </style>
</head>
<body>
<div class="auth">
    <div class="brand">
        <h1>MINIMAL</h1>
        <p>Customer Login</p>
    </div>

    <div th:if="${success}" class="alert success" th:text="${success}"></div>
    <div th:if="${param.error}" class="alert error">Sai tài khoản hoặc mật khẩu.</div>
    <div th:if="${error}" class="alert error" th:text="${error}"></div>
    <div th:if="${param.logout}" class="alert success">Bạn đã đăng xuất thành công.</div>
    <div th:if="${message}" class="alert info" th:text="${message}"></div>

    <form th:action="@{/login}" method="post">
        <div class="field">
            <label for="username">Username hoặc Email</label>
            <input id="username" name="username" type="text" autocomplete="username" required autofocus>
        </div>

        <div class="field">
            <label for="password">Mật khẩu</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>

        <div class="remember">
            <input id="remember-me" name="remember-me" type="checkbox">
            <label for="remember-me">Ghi nhớ đăng nhập</label>
        </div>

        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button type="submit" class="submit">Đăng nhập</button>
    </form>

    <div class="links">
        Chưa có tài khoản?
        <a th:href="@{/register}">Đăng ký ngay</a>
    </div>
</div>
</body>
</html>
