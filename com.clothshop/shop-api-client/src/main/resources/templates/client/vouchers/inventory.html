<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
  <title>Kho Voucher - ClothShop</title>
  <style>
    .voucher-card {
      border-left: 5px solid #0d6efd;
      transition: transform 0.2s;
    }
    .voucher-card:hover {
      transform: translateY(-5px);
    }
    .voucher-code {
      letter-spacing: 1px;
      background: #f8f9fa;
      padding: 2px 8px;
      border: 1px dashed #0d6efd;
      display: inline-block;
    }
  </style>
</head>
<body>

<div layout:fragment="content" class="container py-5">
  <div class="d-flex align-items-center mb-4">
    <h2 class="fw-bold mb-0"><i class="fas fa-ticket-alt text-primary me-2"></i>Kho Voucher của bạn</h2>
    <span class="badge bg-secondary ms-3" th:text="${vouchers.size() + ' mã khả dụng'}">0 mã</span>
  </div>

  <div th:if="${#lists.isEmpty(vouchers)}" class="text-center py-5">
    <i class="fas fa-box-open fa-3x text-muted mb-3"></i>
    <p class="text-muted">Hiện tại bạn chưa có mã giảm giá nào. Hãy quay lại sau nhé!</p>
    <a th:href="@{/products}" class="btn btn-dark">Tiếp tục mua sắm</a>
  </div>

  <div class="row">
    <div class="col-md-4 mb-4" th:each="v : ${vouchers}">
      <div class="card h-100 shadow-sm voucher-card border-0">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-start mb-3">
            <h5 class="voucher-code text-primary fw-bold mb-0" th:text="${v.code}">CODE123</h5>
            <span class="badge bg-success" th:if="${v.discountType.name() == 'PERCENTAGE'}">Giảm %</span>
            <span class="badge bg-info text-white" th:unless="${v.discountType.name() == 'PERCENTAGE'}">Giảm tiền</span>
          </div>

          <h4 class="fw-bold text-danger mb-2">
            <span th:text="${v.discountType.name() == 'PERCENTAGE' ? v.discountValue + '%' : #numbers.formatDecimal(v.discountValue, 0, 'COMMA', 0, 'POINT') + 'đ'}"></span>
          </h4>

          <div class="small text-muted mb-3">
            <p class="mb-1"><i class="fas fa-shopping-cart me-1"></i> Đơn tối thiểu:
              <span class="fw-bold" th:text="${#numbers.formatDecimal(v.minOrderValue, 0, 'COMMA', 0, 'POINT')} + 'đ'"></span>
            </p>
            <p class="mb-1" th:if="${v.maxDiscount != null}">
              <i class="fas fa-arrow-down me-1"></i> Giảm tối đa:
              <span th:text="${#numbers.formatDecimal(v.maxDiscount, 0, 'COMMA', 0, 'POINT')} + 'đ'"></span>
            </p>
            <p class="mb-0"><i class="fas fa-clock me-1"></i> Hạn dùng:
              <span class="fw-bold text-dark" th:text="${#temporals.format(v.validTo, 'dd/MM/yyyy HH:mm')}"></span>
            </p>
          </div>

          <div class="pt-3 border-top">
            <a th:href="@{/products}" class="btn btn-primary btn-sm w-100 fw-bold">DÙNG NGAY</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<th:block layout:fragment="scripts">
  <script>
    console.log("Inventory page loaded with layout scripts.");
    // Bạn có thể thêm logic copy mã voucher vào clipboard ở đây nếu muốn
  </script>
</th:block>

</body>
</html>
