<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layouts/layout}"
      lang="vi">

<head>
    <title>Thanh toán</title>
    <link rel="stylesheet" th:href="@{/css/checkout.css}">
</head>
<body>
<div layout:fragment="content">
    <div class="checkout-wrapper">

        <div class="checkout-steps">
            <div class="step done">
                <div class="step-circle">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <polyline points="20 6 9 17 4 12"/>
                    </svg>
                </div>
                <span class="step-label">Giỏ hàng</span>
            </div>
            <div class="step-line done"></div>
            <div class="step active">
                <div class="step-circle">2</div>
                <span class="step-label">Thanh toán</span>
            </div>
            <div class="step-line"></div>
            <div class="step">
                <div class="step-circle">3</div>
                <span class="step-label">Hoàn thành</span>
            </div>
        </div>

        <div class="alert-error" th:if="${error}" th:text="${error}"></div>

        <div class="checkout-body">

            <div class="checkout-left">
                <!-- Phân nhánh action form theo loại checkout -->
                <form th:action="${isDirectPurchase} ? @{/checkout/direct/confirm} : @{/checkout/confirm}"
                      th:object="${orderRequest}" method="post" id="checkout-form">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <input type="hidden" th:field="*{voucherCode}" id="voucherCodeHidden" />

                    <div class="checkout-section-title">Thông tin giao hàng</div>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" for="fullName">Họ và tên</label>
                            <input type="text" id="fullName" th:field="*{fullName}"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid' : ''"
                                   placeholder="Nguyễn Văn A">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('fullName')}"
                                 th:errors="*{fullName}"></div>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="phoneNumber">Số điện thoại</label>
                            <input type="tel" id="phoneNumber" th:field="*{phoneNumber}"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('phoneNumber')} ? 'is-invalid' : ''"
                                   placeholder="0912 345 678">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('phoneNumber')}"
                                 th:errors="*{phoneNumber}"></div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="email">Email</label>
                        <input type="email" id="email" th:field="*{email}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
                               placeholder="email@example.com">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}"
                             th:errors="*{email}"></div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="shippingAddress">Địa chỉ</label>
                        <input type="text" id="shippingAddress" th:field="*{shippingAddress}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('shippingAddress')} ? 'is-invalid' : ''"
                               placeholder="Số nhà, tên đường">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('shippingAddress')}"
                             th:errors="*{shippingAddress}"></div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" for="province">Tỉnh / Thành</label>
                            <select id="province" th:field="*{province}" class="form-control">
                                <option value="HCM">Hồ Chí Minh</option>
                                <option value="HN">Hà Nội</option>
                                <option value="DN">Đà Nẵng</option>
                                <option value="HP">Hải Phòng</option>
                                <option value="CT">Cần Thơ</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="district">Quận / Huyện</label>
                            <select id="district" th:field="*{district}" class="form-control">
                                <option value="Q1">Quận 1</option>
                                <option value="Q2">Quận 2</option>
                                <option value="Q3">Quận 3</option>
                                <option value="Q7">Quận 7</option>
                                <option value="BT">Bình Thạnh</option>
                                <option value="GV">Gò Vấp</option>
                            </select>
                        </div>
                    </div>

                    <div class="checkout-section-title" style="margin-top: 12px;">Phương thức vận chuyển</div>
                    <div class="radio-card-group">
                        <label class="radio-card">
                            <input type="radio" th:field="*{shippingMethod}" value="STANDARD">
                            <div class="radio-card-content">
                                <div class="radio-card-title">Giao hàng tiêu chuẩn</div>
                                <div class="radio-card-sub">3-5 ngày làm việc</div>
                            </div>
                            <span class="radio-card-price">Miễn phí</span>
                        </label>

                        <label class="radio-card">
                            <input type="radio" th:field="*{shippingMethod}" value="EXPRESS">
                            <div class="radio-card-content">
                                <div class="radio-card-title">Giao hàng nhanh</div>
                                <div class="radio-card-sub">1-2 ngày làm việc</div>
                            </div>
                            <span class="radio-card-price">30.000₫</span>
                        </label>
                    </div>

                    <div class="checkout-section-title">Phương thức thanh toán</div>
                    <div class="radio-card-group">
                        <th:block th:each="method : ${paymentMethods}">
                            <label class="radio-card" th:if="${method.name() == 'COD'}">
                                <input type="radio" th:field="*{paymentMethod}" th:value="${method}">
                                <div class="radio-card-content">
                                    <div class="radio-card-title">Thanh toán khi nhận hàng (COD)</div>
                                    <div class="radio-card-sub">Thanh toán bằng tiền mặt khi nhận hàng</div>
                                </div>
                                <span class="radio-card-badge">COD</span>
                            </label>

                            <label class="radio-card" th:if="${method.name() == 'BANK_TRANSFER'}">
                                <input type="radio" th:field="*{paymentMethod}" th:value="${method}">
                                <div class="radio-card-content">
                                    <div class="radio-card-title">Chuyển khoản ngân hàng</div>
                                </div>
                                <span class="radio-card-badge">ATM</span>
                            </label>

                            <label class="radio-card" th:if="${method.name() == 'MOMO'}">
                                <input type="radio" th:field="*{paymentMethod}" th:value="${method}">
                                <div class="radio-card-content">
                                    <div class="radio-card-title">Ví điện tử MoMo</div>
                                </div>
                                <span class="radio-card-badge">MOMO</span>
                            </label>
                        </th:block>
                    </div>

                    <button type="submit" class="btn-place-order">Đặt hàng</button>
                </form>
            </div>

            <div class="checkout-right">
                <div class="order-summary-box">
                    <div class="order-summary-title">Đơn hàng của bạn</div>

                    <div class="order-items-list">

                        <!-- Trường hợp: Mua từ giỏ hàng -->
                        <th:block th:if="${!isDirectPurchase and cart != null and cart.items != null}">
                            <div class="order-item" th:each="item : ${cart.items}">
                                <div class="order-item-img">
                                    <img th:if="${item.imageUrl != null}"
                                         th:src="${item.imageUrl}"
                                         th:alt="${item.productName}">
                                    <div th:unless="${item.imageUrl != null}"
                                         style="width:100%;height:100%;background:#f0f0f0;"></div>
                                </div>
                                <div class="order-item-info">
                                    <div class="order-item-name" th:text="${item.productName}">Tên sản phẩm</div>
                                    <div class="order-item-meta"
                                         th:text="${(item.sizeName != null ? item.sizeName : '') + (item.colorName != null ? ' · ' + item.colorName : '') + ' × ' + item.quantity}">
                                        M · Đen × 1
                                    </div>
                                </div>
                                <div class="order-item-price"
                                     th:text="${item.subtotal != null ? #numbers.formatDecimal(item.subtotal, 0, 'COMMA', 0, 'POINT') + '₫' : '0₫'}">
                                    0₫
                                </div>
                            </div>
                        </th:block>

                        <!-- Trường hợp: Mua ngay (Direct Purchase) -->
                        <th:block th:if="${isDirectPurchase and directItem != null}">
                            <div class="order-item">
                                <div class="order-item-img">
                                    <img th:if="${directItem.imageUrl != null}"
                                         th:src="${directItem.imageUrl}"
                                         th:alt="${directItem.productName}">
                                    <div th:unless="${directItem.imageUrl != null}"
                                         style="width:100%;height:100%;background:#f0f0f0;"></div>
                                </div>
                                <div class="order-item-info">
                                    <div class="order-item-name" th:text="${directItem.productName}">Tên sản phẩm</div>
                                    <div class="order-item-meta">
                                        <span th:if="${directItem.sizeValue != null}" th:text="${directItem.sizeValue}"></span>
                                        <span th:if="${directItem.sizeValue != null and directItem.color != null}"> · </span>
                                        <span th:if="${directItem.color != null}" th:text="${directItem.color}"></span>
                                        <span> × </span>
                                        <span th:text="${directItem.quantity}">1</span>
                                    </div>
                                </div>
                                <div class="order-item-price"
                                     th:text="${directItem.totalPrice != null ? #numbers.formatDecimal(directItem.totalPrice, 0, 'COMMA', 0, 'POINT') + '₫' : '0₫'}">
                                    0₫
                                </div>
                            </div>
                        </th:block>

                    </div>

                    <div class="voucher-wrap">
                        <input type="text" id="voucher-code" class="voucher-input" placeholder="Mã giảm giá">
                        <button type="button" class="voucher-apply-btn" onclick="applyVoucher()">Áp dụng</button>
                    </div>
                    <div id="voucher-message"></div>

                    <div class="order-summary-row">
                        <span>Tạm tính</span>
                        <span id="subtotal-value"
                              th:text="${isDirectPurchase and directItem != null
                                  ? #numbers.formatDecimal(directItem.totalPrice, 0, 'COMMA', 0, 'POINT') + '₫'
                                  : (cart != null and cart.totalAmount != null
                                      ? #numbers.formatDecimal(cart.totalAmount, 0, 'COMMA', 0, 'POINT') + '₫'
                                      : '0₫')}">
                            0₫
                        </span>
                    </div>

                    <div class="order-summary-row">
                        <span>Vận chuyển</span>
                        <span id="shipping-value">Miễn phí</span>
                    </div>

                    <div class="order-summary-row" id="discount-row" style="display:none; color: #27ae60;">
                        <span>Giảm giá</span>
                        <span id="discount-value">-0₫</span>
                    </div>

                    <div class="order-summary-total">
                        <span>Tổng cộng</span>
                        <span id="total-value"
                              th:text="${isDirectPurchase and directItem != null
                                  ? #numbers.formatDecimal(directItem.totalPrice, 0, 'COMMA', 0, 'POINT') + '₫'
                                  : (cart != null and cart.totalAmount != null
                                      ? #numbers.formatDecimal(cart.totalAmount, 0, 'COMMA', 0, 'POINT') + '₫'
                                      : '0₫')}">
                            0₫
                        </span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<th:block layout:fragment="scripts">
    <script th:src="@{/js/checkout.js}"></script>
</th:block>
</body>
</html>
