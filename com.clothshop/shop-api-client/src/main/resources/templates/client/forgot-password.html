<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quen mat khau - MINIMAL</title>
    <link rel="stylesheet" th:href="@{/css/legacy-client.css}">
    <style>
        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            background: radial-gradient(circle at 85% 15%, #f2ece1 0, #f2ece1 18%, transparent 19%),
                        radial-gradient(circle at 12% 80%, #efe8dd 0, #efe8dd 20%, transparent 21%),
                        #fafaf8;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 460px;
            background: #fff;
            border: 1px solid #e8e6e1;
            box-shadow: 0 28px 60px rgba(28, 28, 26, .08);
            padding: 34px 28px;
        }

        .brand h1 {
            margin: 0;
            font-size: 13px;
            letter-spacing: .28em;
            text-align: center;
        }

        .brand p {
            margin: 10px 0 22px;
            font-size: 12px;
            letter-spacing: .1em;
            color: #6b6b67;
            text-transform: uppercase;
            text-align: center;
        }

        .alert {
            border: 1px solid #b9d6f5;
            background: #f5faff;
            color: #2f5f9f;
            font-size: 13px;
            padding: 10px 12px;
            margin-bottom: 12px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 12px;
            letter-spacing: .08em;
            text-transform: uppercase;
            color: #6b6b67;
        }

        input {
            width: 100%;
            border: 1px solid #e8e6e1;
            background: #fafaf8;
            color: #1c1c1a;
            padding: 10px 12px;
            font-size: 14px;
            margin-bottom: 14px;
        }

        button {
            width: 100%;
            border: 1px solid #1c1c1a;
            background: #1c1c1a;
            color: #fff;
            padding: 12px;
            font-size: 12px;
            letter-spacing: .18em;
            text-transform: uppercase;
            cursor: pointer;
        }

        button:hover {
            background: #c5a882;
            border-color: #c5a882;
        }

        .back {
            margin-top: 14px;
            text-align: center;
            font-size: 13px;
        }

        .back a {
            color: #1c1c1a;
            text-decoration: none;
            border-bottom: 1px solid #d2d0ca;
        }
    </style>
</head>
<body>
<div class="card">
    <div class="brand">
        <h1>MINIMAL</h1>
        <p>Khoi phuc mat khau</p>
    </div>

    <div th:if="${message}" class="alert" th:text="${message}"></div>

    <form th:action="@{/forgot-password}" method="post">
        <label for="email">Email da dang ky</label>
        <input id="email" name="email" type="email" autocomplete="email" required>

        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button type="submit">Gui yeu cau</button>
    </form>

    <div class="back">
        <a th:href="@{/login}">Quay lai dang nhap</a>
    </div>
</div>
</body>
</html>
